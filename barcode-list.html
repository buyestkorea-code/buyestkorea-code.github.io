<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>바코드 → 리스트화</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
  :root{
    --bg:#f6f6f4; --card:#fff; --ink:#15171a; --sub:#6a6f76; --line:#e4e4e0;
    --pri:#15171a; --ok:#0f766e; --okbg:#ecf8f5; --warn:#a15c07; --warnbg:#fdf3e0; --bad:#b42318; --badbg:#fdeceb; --blue:#1d4ed8;
    --font:"Pretendard",-apple-system,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);margin:0;padding:16px;font-size:14px;}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.02em;}
  .lead{color:var(--sub);font-size:13px;margin:0 0 14px;line-height:1.55;}
  .btn{font:600 14px var(--font);padding:9px 15px;border:1px solid transparent;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .btn:focus-visible,input:focus-visible,.row-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .btn-pri{background:var(--pri);color:#fff;}
  .btn-green{background:var(--ok);color:#fff;}
  .btn-out{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-danger{background:#fff;color:var(--bad);border-color:#f0c7c3;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  input[type=text],input[type=search],textarea{font:15px var(--font);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;}

  /* 스캔 입력 */
  .scan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .scan-row{display:flex;gap:8px;align-items:stretch;}
  #scanInput{font-size:22px;font-weight:700;letter-spacing:.04em;text-align:center;border:2px solid var(--pri);padding:14px 12px;}
  .scan-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .scan-tools .grow{flex:1;}
  .net{font-size:12px;color:var(--sub);}
  .net.bad{color:var(--bad);font-weight:700;}
  #camWrap{display:none;margin-top:10px;} #camReader{width:100%;max-width:420px;margin:0 auto;}

  /* 방금 찍은 상품 */
  .last{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-height:96px;transition:border-color .2s,background .2s;}
  .last.hit{border-color:var(--ok);background:var(--okbg);}
  .last.nok{border-color:#e7b76a;background:var(--warnbg);}
  .last.miss{border-color:var(--bad);background:var(--badbg);}
  .last.flash{animation:flash .5s ease-out;}
  @keyframes flash{from{transform:scale(1.015);}to{transform:scale(1);}}
  @media (prefers-reduced-motion:reduce){.last.flash{animation:none;}}
  .thumb{width:72px;height:72px;border-radius:10px;background:#ececE8;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#a3a39c;font-size:11px;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .last .info{flex:1;min-width:0;}
  .last .ko{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.02em;word-break:keep-all;}
  .last .meta{font-size:13px;color:var(--sub);margin-top:4px;}
  .last .qtybig{font-size:34px;font-weight:800;line-height:1;text-align:center;flex:none;min-width:56px;}
  .last .qtybig small{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-top:3px;}
  .last.idle{color:var(--sub);justify-content:center;border-style:dashed;}

  /* 요약 */
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--sub);}
  .stat b{display:block;font-size:19px;color:var(--ink);letter-spacing:-.02em;}
  .stat.warn b{color:var(--warn);} .stat.bad b{color:var(--bad);}

  /* 도구줄 */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .bar .grow{flex:1;min-width:160px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
  .seg button{font:600 13px var(--font);padding:8px 12px;border:0;background:#fff;cursor:pointer;color:var(--sub);}
  .seg button.on{background:var(--pri);color:#fff;}

  /* 목록 */
  .list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:0;}
  .item.fresh{background:#fbfbe9;}
  .item .thumb{width:44px;height:44px;border-radius:8px;font-size:0;}
  .item .main{flex:1;min-width:0;}
  .item .nm{font-size:14px;font-weight:700;line-height:1.35;word-break:keep-all;}
  .item .nm.raw{color:var(--warn);}
  .item .sub{font-size:12px;color:var(--sub);margin-top:2px;overflow-wrap:anywhere;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;}
  .tag.t-miss{background:var(--badbg);color:var(--bad);} .tag.t-nok{background:var(--warnbg);color:var(--warn);} .tag.t-load{background:#eee;color:#777;}
  .qty{display:flex;align-items:center;gap:4px;flex:none;}
  .qty b{min-width:34px;text-align:center;font-size:17px;}
  .row-btn{font:700 16px var(--font);width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;color:var(--ink);padding:0;}
  .row-btn.fix{width:auto;padding:0 10px;font-size:12px;color:var(--bad);border-color:#f0c7c3;}
  .empty{padding:34px 16px;text-align:center;color:var(--sub);line-height:1.7;}
  .more{padding:10px;text-align:center;font-size:12px;color:var(--sub);background:#fafaf8;}

  /* 마스터 패널 */
  details.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:0 14px;}
  details.panel summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center;}
  details.panel summary::-webkit-details-marker{display:none;}
  details.panel summary::after{content:"＋";margin-left:auto;color:var(--sub);} details.panel[open] summary::after{content:"－";}
  .panel-body{padding:0 0 14px;}
  .panel-body p{color:var(--sub);font-size:12.5px;line-height:1.6;margin:6px 0 10px;}
  .m-stats{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 10px;font-size:13px;} .m-stats b{font-size:17px;}
  .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .progress{height:6px;background:#eee;border-radius:99px;overflow:hidden;margin:8px 0;display:none;} .progress i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s;}
  .msearch-res .item{padding:7px 0;}

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%;}
  .modal h2{font-size:16px;margin:0 0 4px;} .modal .f{margin:10px 0 0;} .modal label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px;}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#15171a;color:#fff;padding:10px 18px;border-radius:9px;font-size:14px;z-index:100;display:none;max-width:90vw;}
  #toast.err{background:var(--bad);} #toast.ok{background:var(--ok);}
  .gate{background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center;padding:48px 20px;}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<div id="app"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="assets/camera-scan.js"></script>
<script>
'use strict';
/* ============================================================
   바코드 → 리스트화 (TEST)
   바코드를 찍으면 서버 상시 마스터(bc_master)에서 품목명·한글 상품명을 가져와 리스트로 쌓고 엑셀로 내보낸다.
   - 마스터: 재고파일/행사 재고/직접 입력으로 계속 쌓이며, 한글명은 사이트 상품명의 품번 매칭으로 자동 연결.
   - 리스트(스캔한 것)는 이 기기 localStorage 에 자동 저장 — 새로고침/탭 닫아도 이어서 가능. 서버엔 마스터만 저장.
   ============================================================ */
const API = 'https://buyest.co.kr/bc_master_api.php';
const LS_KEY = 'bcl.state.v1';
const SHOW_LIMIT = 500;

const S = {
  list: [],            // [{bc, qty, first, last}]  — 최근에 찍은 것이 앞
  log: [],             // [{t, bc}] 스캔 원본(시간순)
  view: 'recent',      // recent | brand
  q: '',
  lastBc: null,
  netBad: false,
  cam: null,
};
const master = new Map();      // bc -> row | 'missing'
const pending = new Set();     // 조회 대기
let flushTimer = null, saveTimer = null, freshBc = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getAuth(){ try { const a = JSON.parse(localStorage.getItem('buyest.dash.auth')||'null'); return (a && a.id) ? a : null; } catch(e){ return null; } }
const AUTH = getAuth();

function toast(msg, kind){ const t=$('toast'); t.textContent=msg; t.className=kind||''; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>{t.style.display='none';}, kind==='err'?4200:2200); }

/* ---------- 소리 ---------- */
let actx = null;
function tone(freq, ms, when){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=freq; g.gain.value=.18; o.connect(g); g.connect(actx.destination); const t=actx.currentTime+(when||0); o.start(t); o.stop(t+ms/1000); } catch(e){} }
const beepOk = () => tone(1040, 70);
const beepWarn = () => { tone(300, 110); tone(300, 110, .16); tone(300, 110, .32); };

/* ---------- 저장/복원 ---------- */
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify({list:S.list, log:S.log.slice(-20000), view:S.view})); } catch(e){} }, 300); }
function restore(){ try { const d = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if (d && Array.isArray(d.list)) { S.list = d.list; S.log = d.log||[]; S.view = d.view||'recent'; } } catch(e){} }

/* ---------- 서버 ---------- */
async function api(action, payload){
  const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({action, actor: AUTH.id}, payload||{})) });
  const j = await res.json();
  return j;
}

function queueLookup(bc){ if (master.has(bc) || pending.has(bc)) return; pending.add(bc); clearTimeout(flushTimer); flushTimer = setTimeout(flushLookup, 120); }
async function flushLookup(){
  const batch = Array.from(pending).slice(0, 500); if (!batch.length) return;
  batch.forEach(b => pending.delete(b));
  try {
    const j = await api('lookup', {barcodes: batch});
    if (!j.ok) throw new Error(j.error||'조회 실패');
    Object.keys(j.rows||{}).forEach(b => master.set(b, j.rows[b]));
    (j.missing||[]).forEach(b => master.set(b, 'missing'));
    setNet(false);
  } catch(e){ setNet(true); batch.forEach(b => { /* 다음에 다시 시도하도록 캐시에 안 넣음 */ }); }
  renderAll();
  if (pending.size) flushLookup();
}
function setNet(bad){ S.netBad = bad; const n = $('net'); if (n) { n.textContent = bad ? '서버 연결 실패 — 찍은 것은 저장돼요. 연결되면 [다시 조회]' : '서버 연결됨'; n.className = 'net' + (bad?' bad':''); } }
function lookupAllUnknown(){ S.list.forEach(it => { if (!master.has(it.bc)) pending.add(it.bc); }); flushLookup(); }

/* ---------- 스캔 ---------- */
function cleanBc(raw){ return String(raw||'').replace(/[\s\u0000-\u001f]+/g,'').slice(0,64); }
function addScan(raw, opts){
  const bc = cleanBc(raw); if (bc.length < 3) { toast('바코드가 너무 짧아요: ' + bc, 'err'); return; }
  const now = Date.now();
  let it = S.list.find(x => x.bc === bc);
  if (it) { it.qty += 1; it.last = now; S.list = [it].concat(S.list.filter(x => x !== it)); }
  else { it = {bc, qty:1, first:now, last:now}; S.list.unshift(it); }
  S.log.push({t: now, bc}); S.lastBc = bc; freshBc = bc;
  queueLookup(bc); saveSoon(); renderAll(true);
  const m = master.get(bc);
  if (m && m !== 'missing' && m.ko) beepOk(); else if (m === 'missing' || (m && !m.ko)) beepWarn(); else beepOk();
  if (!opts || !opts.noFocus) focusInput();
}
function undoLast(){
  const e = S.log.pop(); if (!e) { toast('되돌릴 스캔이 없어요'); return; }
  const it = S.list.find(x => x.bc === e.bc);
  if (it) { it.qty -= 1; if (it.qty <= 0) S.list = S.list.filter(x => x !== it); }
  S.lastBc = S.log.length ? S.log[S.log.length-1].bc : null; saveSoon(); renderAll(); toast('방금 스캔을 취소했어요');
}
function changeQty(bc, d){
  const it = S.list.find(x => x.bc === bc); if (!it) return;
  it.qty += d; if (it.qty <= 0) S.list = S.list.filter(x => x !== it);
  saveSoon(); renderAll();
}
function removeItem(bc){ S.list = S.list.filter(x => x.bc !== bc); S.log = S.log.filter(e => e.bc !== bc); if (S.lastBc === bc) S.lastBc = null; saveSoon(); renderAll(); }
function focusInput(){ const i = $('scanInput'); if (i && !document.querySelector('.modal-bg[style*="flex"]')) i.focus({preventScroll:true}); }

/* ---------- 표시용 ---------- */
function infoOf(bc){ const m = master.get(bc); return (m && m !== 'missing') ? m : null; }
function stateOf(bc){ const m = master.get(bc); if (m === undefined) return 'load'; if (m === 'missing') return 'miss'; return m.ko ? 'hit' : 'nok'; }
function displayName(bc){ const m = infoOf(bc); return m ? (m.ko || m.name || '') : ''; }
function subLine(bc){ const m = infoOf(bc); const p = []; if (m) { if (m.brand) p.push(m.brand); if (m.style) p.push(m.style); if (m.size) p.push('사이즈 ' + m.size); } p.push(bc); return p.join(' · '); }
function thumbHtml(bc, big){ const m = infoOf(bc); if (m && m.img) return `<div class="thumb"><img src="${esc(m.img)}" loading="lazy" alt="" onerror="this.parentNode.textContent=''"></div>`; return `<div class="thumb">${big?'사진 없음':''}</div>`; }
function tagHtml(st){ return st==='miss' ? '<span class="tag t-miss">미등록</span>' : st==='nok' ? '<span class="tag t-nok">한글명 없음</span>' : st==='load' ? '<span class="tag t-load">조회 중</span>' : ''; }

function sortedList(){
  let a = S.list.slice();
  const q = S.q.trim().toLowerCase();
  if (q) a = a.filter(it => (it.bc + ' ' + displayName(it.bc) + ' ' + subLine(it.bc)).toLowerCase().includes(q));
  if (S.view === 'brand') {
    a.sort((x, y) => { const mx = infoOf(x.bc)||{}, my = infoOf(y.bc)||{};
      return (mx.brand||'힣힣').localeCompare(my.brand||'힣힣','ko') || (mx.style||'').localeCompare(my.style||'') || String(mx.size||'').localeCompare(String(my.size||''), undefined, {numeric:true}); });
  }
  return a;
}

/* ---------- 화면 ---------- */
function renderShell(){
  if (!AUTH) {
    $('app').innerHTML = `<h1>바코드 → 리스트화</h1><div class="gate"><p class="lead" style="font-size:15px;margin:0 0 16px;">로그인한 직원만 사용할 수 있어요.<br>인트라넷 홈에서 로그인한 뒤 새로고침해주세요.</p><button class="btn btn-pri" onclick="location.reload()">새로고침</button></div>`;
    return false;
  }
  $('app').innerHTML = `
    <h1>바코드 → 리스트화 <span style="font-size:11px;font-weight:700;background:#eee;border-radius:99px;padding:2px 8px;vertical-align:3px;">시험판</span></h1>
    <p class="lead">바코드를 찍으면 한글 상품명과 함께 리스트로 쌓이고, 엑셀로 내려받을 수 있어요. 같은 바코드를 또 찍으면 수량이 올라가요.</p>

    <div class="scan">
      <div class="scan-row"><input id="scanInput" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 바코드 스캔 (스캐너 / 직접 입력 후 Enter)" aria-label="바코드 입력"></div>
      <div class="scan-tools">
        <button class="btn btn-out" id="btnCam">📷 카메라로 찍기</button>
        <button class="btn btn-out" id="btnPaste">붙여넣기로 추가</button>
        <button class="btn btn-out" id="btnUndo">방금 거 취소</button>
        <span class="grow"></span>
        <span class="net" id="net"></span>
        <button class="btn btn-out" id="btnRetry" style="display:none;">다시 조회</button>
      </div>
      <div id="camWrap"><div id="camReader"></div><div class="net" id="camMsg" style="text-align:center;margin-top:6px;"></div></div>
    </div>

    <div id="lastBox"></div>
    <div class="stats" id="stats"></div>

    <div class="bar">
      <input type="search" id="q" class="grow" placeholder="리스트에서 찾기 (이름·품번·바코드)" aria-label="리스트 검색">
      <div class="seg" role="group" aria-label="정렬"><button id="vRecent">최근 찍은 순</button><button id="vBrand">브랜드 순</button></div>
    </div>
    <div class="list" id="list"></div>

    <div class="bar" style="margin-top:12px;">
      <button class="btn btn-green" id="btnXlsx">엑셀로 내려받기</button>
      <button class="btn btn-out" id="btnCopy">표 복사</button>
      <span class="grow"></span>
      <button class="btn btn-danger" id="btnClear">새 리스트 시작</button>
    </div>

    <details class="panel" id="mpanel">
      <summary>바코드 마스터 <span id="mSum" style="font-weight:500;color:var(--sub);font-size:12px;"></span></summary>
      <div class="panel-body">
        <div class="m-stats" id="mStats">불러오는 중…</div>
        <p>바코드 마스터는 서버에 계속 쌓여서 모든 직원이 같이 써요. 재고파일(엑셀)을 올리면 바코드·품목명이 추가되고, 한글 상품명은 품번으로 사이트 상품과 자동 연결돼요. 이미 있는 바코드는 새 정보로 갱신돼요.</p>
        <div class="mrow">
          <button class="btn btn-pri" id="btnUpload">재고파일 올려서 마스터에 추가</button>
          <input type="file" id="mFile" accept=".xlsx,.xls,.csv" style="display:none;">
          <button class="btn btn-out" id="btnSeed">기존 재고 가져오기 (행사 POS·키즈매장)</button>
          <button class="btn btn-out" id="btnResolve">한글명 다시 찾기</button>
        </div>
        <div class="progress" id="mProg"><i></i></div>
        <div class="net" id="mMsg"></div>
        <div style="margin-top:12px;"><input type="search" id="mq" placeholder="마스터에서 찾기 (바코드·이름·품번)" aria-label="마스터 검색"></div>
        <div class="msearch-res" id="mRes"></div>
      </div>
    </details>
  `;
  return true;
}

function renderAll(fresh){
  if (!AUTH) return;
  renderLast(fresh); renderStats(); renderList();
  $('vRecent').className = S.view==='recent'?'on':''; $('vBrand').className = S.view==='brand'?'on':'';
  $('btnRetry').style.display = S.netBad ? '' : 'none';
}
function renderLast(fresh){
  const box = $('lastBox'); const bc = S.lastBc; const it = bc && S.list.find(x => x.bc === bc);
  if (!it) { box.innerHTML = `<div class="last idle">아직 찍은 바코드가 없어요. 위 칸을 누르고 바코드를 스캔하세요.</div>`; return; }
  const st = stateOf(bc); const m = infoOf(bc);
  const cls = st==='hit'?'hit':st==='nok'?'nok':st==='miss'?'miss':'';
  const name = m ? (m.ko || m.name || '(이름 없음)') : st==='miss' ? '마스터에 없는 바코드예요' : '조회 중…';
  const fix = (st==='miss' || st==='nok') ? `<button class="btn btn-out" style="margin-top:8px;" onclick="openManual('${esc(bc)}')">${st==='miss'?'이름 입력해서 마스터에 등록':'한글 상품명 직접 입력'}</button>` : '';
  box.innerHTML = `<div class="last ${cls}${fresh?' flash':''}">${thumbHtml(bc,true)}<div class="info"><div class="ko">${esc(name)}</div><div class="meta">${esc(subLine(bc))}</div>${fix}</div><div class="qtybig">${it.qty}<small>이 바코드 수량</small></div></div>`;
}
function renderStats(){
  const kinds = S.list.length, total = S.list.reduce((a,b)=>a+b.qty,0);
  let miss=0, nok=0; S.list.forEach(it => { const s = stateOf(it.bc); if (s==='miss') miss++; else if (s==='nok') nok++; });
  $('stats').innerHTML = `<div class="stat"><b>${kinds.toLocaleString()}</b>품목 종류</div><div class="stat"><b>${total.toLocaleString()}</b>총 수량</div>` +
    (miss?`<div class="stat bad"><b>${miss}</b>미등록</div>`:'') + (nok?`<div class="stat warn"><b>${nok}</b>한글명 없음</div>`:'');
}
function renderList(){
  const a = sortedList(); const el = $('list');
  if (!S.list.length) { el.innerHTML = `<div class="empty">리스트가 비어 있어요.<br>바코드를 스캔하거나 [붙여넣기로 추가]로 여러 개를 한 번에 넣을 수 있어요.</div>`; return; }
  if (!a.length) { el.innerHTML = `<div class="empty">“${esc(S.q)}” 와 맞는 항목이 없어요.</div>`; return; }
  const shown = a.slice(0, SHOW_LIMIT);
  el.innerHTML = shown.map(it => {
    const st = stateOf(it.bc); const nm = displayName(it.bc);
    const nameHtml = nm ? `<div class="nm${infoOf(it.bc) && !infoOf(it.bc).ko ? ' raw':''}">${esc(nm)}${tagHtml(st)}</div>` : `<div class="nm raw">${st==='load'?'조회 중…':'(미등록 바코드)'}${tagHtml(st)}</div>`;
    const fix = (st==='miss' || st==='nok') ? `<button class="row-btn fix" onclick="openManual('${esc(it.bc)}')">입력</button>` : '';
    return `<div class="item${freshBc===it.bc?' fresh':''}">${thumbHtml(it.bc,false)}<div class="main">${nameHtml}<div class="sub">${esc(subLine(it.bc))}</div></div>${fix}<div class="qty"><button class="row-btn" onclick="changeQty('${esc(it.bc)}',-1)" aria-label="수량 빼기">−</button><b>${it.qty}</b><button class="row-btn" onclick="changeQty('${esc(it.bc)}',1)" aria-label="수량 더하기">＋</button></div></div>`;
  }).join('') + (a.length > SHOW_LIMIT ? `<div class="more">${a.length.toLocaleString()}개 중 ${SHOW_LIMIT}개만 보여요. 검색으로 좁히거나 엑셀로 전체를 받으세요.</div>` : '');
}

/* ---------- 모달: 직접 입력 ---------- */
function showModal(html){ $('modal').innerHTML = html; $('modalBg').style.display = 'flex'; }
function closeModal(){ $('modalBg').style.display = 'none'; focusInput(); }
function openManual(bc){
  const m = infoOf(bc) || {};
  showModal(`<h2>한글 상품명 입력</h2><div class="net">바코드 ${esc(bc)}</div>
    <div class="f"><label for="mnName">상품명 (한글)</label><input type="text" id="mnName" value="${esc(m.ko||'')}" placeholder="예: 26FW 힐데 HILDE 케이프 샌드"></div>
    <div class="f"><label for="mnBrand">브랜드</label><input type="text" id="mnBrand" value="${esc(m.brand||'')}"></div>
    <div class="f"><label for="mnStyle">품번 (선택)</label><input type="text" id="mnStyle" value="${esc(m.style||'')}"></div>
    <div class="f"><label for="mnSize">사이즈 (선택)</label><input type="text" id="mnSize" value="${esc(m.size||'')}"></div>
    <div class="acts"><button class="btn btn-out" onclick="closeModal()">취소</button><button class="btn btn-pri" id="mnSave">마스터에 저장</button></div>`);
  $('mnName').focus();
  $('mnSave').onclick = async () => {
    const name = $('mnName').value.trim(); if (!name) { toast('상품명을 입력해주세요', 'err'); return; }
    $('mnSave').disabled = true;
    try {
      const j = await api('save_manual', {barcode: bc, name, brand: $('mnBrand').value.trim(), style_code: $('mnStyle').value.trim(), size: $('mnSize').value.trim()});
      if (!j.ok) throw new Error(j.error||'저장 실패');
      master.set(bc, j.row); closeModal(); renderAll(); toast('마스터에 저장했어요. 다음부터 자동으로 나와요.', 'ok'); loadMasterStats();
    } catch(e){ toast(e.message||'저장 실패', 'err'); $('mnSave').disabled = false; }
  };
}
function openPaste(){
  showModal(`<h2>바코드 여러 개 붙여넣기</h2><div class="net">한 줄에 하나씩 (엑셀 열 복사도 돼요). 같은 값이 여러 줄이면 수량으로 합쳐져요.</div>
    <div class="f"><textarea id="pasteArea" rows="9" placeholder="10038789&#10;10038769&#10;…"></textarea></div>
    <div class="acts"><button class="btn btn-out" onclick="closeModal()">취소</button><button class="btn btn-pri" id="pasteGo">리스트에 추가</button></div>`);
  $('pasteArea').focus();
  $('pasteGo').onclick = () => {
    const lines = $('pasteArea').value.split(/[\r\n,;\t]+/).map(cleanBc).filter(x => x.length >= 3);
    if (!lines.length) { toast('바코드를 찾지 못했어요', 'err'); return; }
    lines.forEach(b => addScan(b, {noFocus:true}));
    closeModal(); toast(lines.length + '개 추가했어요', 'ok');
  };
}

/* ---------- 엑셀 ---------- */
function rowsForExport(){
  return S.list.slice().sort((x,y) => { const mx = infoOf(x.bc)||{}, my = infoOf(y.bc)||{};
    return (mx.brand||'힣힣').localeCompare(my.brand||'힣힣','ko') || (mx.style||'').localeCompare(my.style||'') || String(mx.size||'').localeCompare(String(my.size||''), undefined, {numeric:true}); })
    .map(it => { const m = infoOf(it.bc)||{}; const st = stateOf(it.bc);
      return {bc: it.bc, qty: it.qty, brand: m.brand||'', ko: m.ko||'', style: m.style||'', size: m.size||'', raw: m.name||'', status: st==='hit'?'':st==='nok'?'한글명 없음':st==='miss'?'미등록':'조회 안 됨'}; });
}
function downloadXlsx(){
  if (!S.list.length) { toast('내려받을 리스트가 비어 있어요', 'err'); return; }
  const rows = rowsForExport();
  const wb = XLSX.utils.book_new();
  const head = ['순번','브랜드','한글 상품명','품번','사이즈','바코드','수량','원본 품목명','확인'];
  const aoa = [head].concat(rows.map((r,i) => [i+1, r.brand, r.ko || r.raw, r.style, r.size, r.bc, r.qty, r.raw, r.status]));
  aoa.push([]); aoa.push(['', '', '합계', '', '', '', rows.reduce((a,b)=>a+b.qty,0)]);
  const ws1 = XLSX.utils.aoa_to_sheet(aoa);
  ws1['!cols'] = [{wch:6},{wch:16},{wch:48},{wch:24},{wch:8},{wch:16},{wch:7},{wch:30},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws1, '리스트');
  const by = {}; rows.forEach(r => { const k = r.brand || '(브랜드 없음)'; by[k] = by[k] || {kinds:0, qty:0}; by[k].kinds++; by[k].qty += r.qty; });
  const ws2 = XLSX.utils.aoa_to_sheet([['브랜드','품목 종류','총 수량']].concat(Object.keys(by).sort((a,b)=>a.localeCompare(b,'ko')).map(k => [k, by[k].kinds, by[k].qty])));
  ws2['!cols'] = [{wch:22},{wch:10},{wch:10}]; XLSX.utils.book_append_sheet(wb, ws2, '브랜드별 합계');
  const need = rows.filter(r => r.status);
  if (need.length) { const ws3 = XLSX.utils.aoa_to_sheet([['바코드','수량','확인','원본 품목명','품번']].concat(need.map(r => [r.bc, r.qty, r.status, r.raw, r.style]))); ws3['!cols']=[{wch:18},{wch:7},{wch:12},{wch:34},{wch:24}]; XLSX.utils.book_append_sheet(wb, ws3, '확인 필요'); }
  const ws4 = XLSX.utils.aoa_to_sheet([['스캔 시각','바코드','상품명']].concat(S.log.map(e => [new Date(e.t).toLocaleString('ko-KR'), e.bc, displayName(e.bc)])));
  ws4['!cols'] = [{wch:22},{wch:18},{wch:48}]; XLSX.utils.book_append_sheet(wb, ws4, '스캔 내역');
  const d = new Date(), p = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `바코드리스트_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`);
  toast('엑셀을 내려받았어요', 'ok');
}
async function copyTable(){
  if (!S.list.length) return;
  const rows = rowsForExport();
  const tsv = ['브랜드\t한글 상품명\t품번\t사이즈\t바코드\t수량'].concat(rows.map(r => [r.brand, r.ko||r.raw, r.style, r.size, r.bc, r.qty].join('\t'))).join('\n');
  try { await navigator.clipboard.writeText(tsv); toast('표를 복사했어요. 엑셀에 붙여넣으세요', 'ok'); } catch(e){ toast('복사하지 못했어요. 엑셀 내려받기를 써주세요', 'err'); }
}

/* ---------- 마스터 관리 ---------- */
async function loadMasterStats(){
  try {
    const j = await api('stats'); if (!j.ok) throw new Error(j.error);
    const src = Object.keys(j.by_source||{}).map(k => `${esc(k)} ${j.by_source[k].toLocaleString()}`).join(' · ');
    $('mStats').innerHTML = `<span>전체 <b>${j.total.toLocaleString()}</b></span><span>한글명 연결 <b>${j.with_ko.toLocaleString()}</b></span><span>한글명 없음 <b>${j.without_ko.toLocaleString()}</b></span>`;
    $('mSum').textContent = `· ${j.total.toLocaleString()}개 등록됨`; if (src) $('mMsg').textContent = '출처: ' + src;
  } catch(e){ $('mStats').textContent = '마스터 현황을 불러오지 못했어요.'; }
}
function parseMasterFile(buf){
  const wb = XLSX.read(buf, {type:'array'}); const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
  let hr = -1, cBar=-1, cName=-1, cBrand=-1, cSize=-1;
  for (let r = 0; r < Math.min(12, aoa.length); r++) {
    const row = aoa[r].map(x => String(x).replace(/\s/g,''));
    const b = row.findIndex(x => /바코드|barcode/i.test(x)); if (b < 0) continue;
    hr = r; cBar = b;
    cName = row.findIndex(x => /품목명|상품명|품명|^품목$/.test(x));
    cBrand = row.findIndex(x => /분류명|브랜드/.test(x));
    cSize = row.findIndex(x => /^사이즈$|^규격$|^size$/i.test(x));
    break;
  }
  if (hr < 0) { hr = -1; cBar = 0; cName = 1; }
  const out = []; let brand = '';
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r]; const bc = cleanBc(String(row[cBar]||'').replace(/,/g,'')); if (cBrand >= 0 && String(row[cBrand]||'').trim()) brand = String(row[cBrand]).trim();
    if (bc.length < 3) continue;
    out.push({barcode: bc, name: cName>=0 ? String(row[cName]||'').trim() : '', brand: cBrand>=0 ? brand : '', size: cSize>=0 ? String(row[cSize]||'').trim() : ''});
  }
  return {rows: out, usedHeader: hr >= 0, cols: {cBar, cName, cBrand, cSize}};
}
async function uploadMaster(file){
  const prog = $('mProg'), bar = prog.querySelector('i'), msg = $('mMsg');
  try {
    const parsed = parseMasterFile(await file.arrayBuffer());
    if (!parsed.rows.length) { msg.textContent = '바코드가 있는 행을 찾지 못했어요. 첫 줄에 "바코드", "품목명" 제목이 있는지 확인해주세요.'; return; }
    if (!parsed.rows.some(r => r.name)) { msg.textContent = '품목명 열을 찾지 못했어요. 제목에 "품목명" 또는 "상품명"이 있어야 해요.'; return; }
    if (!confirm(`${parsed.rows.length.toLocaleString()}개 바코드를 마스터에 추가/갱신할까요?`)) return;
    prog.style.display = 'block'; let saved = 0, resolved = 0; const CH = 500;
    for (let i = 0; i < parsed.rows.length; i += CH) {
      const j = await api('upsert', {rows: parsed.rows.slice(i, i+CH), source: 'upload'});
      if (!j.ok) throw new Error(j.error||'올리기 실패');
      saved += j.saved; resolved += j.resolved; bar.style.width = Math.round(Math.min(i+CH, parsed.rows.length) / parsed.rows.length * 100) + '%';
    }
    msg.textContent = `완료: ${saved.toLocaleString()}개 저장, 그중 한글명 연결 ${resolved.toLocaleString()}개 (연결 못한 ${ (saved-resolved).toLocaleString() }개는 [한글명 다시 찾기] 또는 직접 입력)`;
    toast('마스터에 추가했어요', 'ok'); master.forEach((v,k)=>{ if (v==='missing') master.delete(k); }); lookupAllUnknown(); loadMasterStats();
  } catch(e){ msg.textContent = '실패: ' + (e.message||e); toast('올리기에 실패했어요', 'err'); }
  finally { setTimeout(()=>{ prog.style.display='none'; bar.style.width='0'; }, 1200); }
}
async function runSeed(){
  if (!confirm('행사 POS에 올라간 재고와 키즈매장재고 리스트의 바코드를 마스터에 가져옵니다. (이미 있는 것은 갱신) 진행할까요?')) return;
  $('mMsg').textContent = '가져오는 중… (잠시 걸려요)';
  try { const j = await api('seed'); if (!j.ok) throw new Error(j.error);
    $('mMsg').textContent = `완료: 행사 POS ${j.pos.saved.toLocaleString()}개 (한글명 ${j.pos.resolved.toLocaleString()}), 키즈매장 ${j.kids.saved.toLocaleString()}개 (한글명 ${j.kids.resolved.toLocaleString()})`;
    toast('기존 재고를 가져왔어요', 'ok'); master.forEach((v,k)=>{ if (v==='missing') master.delete(k); }); lookupAllUnknown(); loadMasterStats();
  } catch(e){ $('mMsg').textContent = '실패: ' + (e.message||e); }
}
async function runResolve(){
  $('mMsg').textContent = '한글명을 찾는 중…';
  try { const j = await api('resolve', {limit: 3000}); if (!j.ok) throw new Error(j.error);
    $('mMsg').textContent = `${j.tried.toLocaleString()}개 확인 → ${j.resolved.toLocaleString()}개 연결, 남은 한글명 없음 ${j.remaining.toLocaleString()}개`;
    master.forEach((v,k)=>{ if (v && v!=='missing' && !v.ko) master.delete(k); }); lookupAllUnknown(); loadMasterStats();
  } catch(e){ $('mMsg').textContent = '실패: ' + (e.message||e); }
}
let mqTimer = null;
function masterSearch(){
  clearTimeout(mqTimer); mqTimer = setTimeout(async () => {
    const q = $('mq').value.trim(); const res = $('mRes'); if (q.length < 2) { res.innerHTML = ''; return; }
    try { const j = await api('search', {q, limit: 30}); if (!j.ok) throw new Error(j.error);
      res.innerHTML = (j.rows.length ? j.rows.map(m => `<div class="item">${m.img?`<div class="thumb"><img src="${esc(m.img)}" loading="lazy" alt="" onerror="this.parentNode.textContent=''"></div>`:'<div class="thumb"></div>'}<div class="main"><div class="nm${m.ko?'':' raw'}">${esc(m.ko||m.name||'(이름 없음)')}</div><div class="sub">${esc([m.brand,m.style,m.size?('사이즈 '+m.size):'',m.barcode].filter(Boolean).join(' · '))}</div></div><button class="row-btn fix" style="color:var(--blue);border-color:#c9d6f5;" onclick="addScan('${esc(m.barcode)}')">리스트에 추가</button></div>`).join('') : '<div class="net" style="padding:8px 0;">검색 결과가 없어요.</div>') + (j.total > 30 ? `<div class="net" style="padding:6px 0;">${j.total.toLocaleString()}개 중 30개만 보여요.</div>` : '');
    } catch(e){ res.innerHTML = '<div class="net bad">검색에 실패했어요.</div>'; }
  }, 350);
}

/* ---------- 카메라 ---------- */
async function toggleCam(){
  const wrap = $('camWrap');
  if (S.cam && S.cam.isRunning()) { await S.cam.stop(); wrap.style.display = 'none'; $('btnCam').textContent = '📷 카메라로 찍기'; return; }
  if (typeof RobustCameraScan === 'undefined' || typeof Html5Qrcode === 'undefined') { toast('카메라 기능을 불러오지 못했어요', 'err'); return; }
  wrap.style.display = 'block'; $('btnCam').textContent = '카메라 끄기';
  S.cam = S.cam || RobustCameraScan.create({ elementId:'camReader', isKnown: (t) => { const m = master.get(cleanBc(t)); return !!(m && m !== 'missing'); }, onAccept: (t) => addScan(t, {noFocus:true}), onStatus: (msg) => { $('camMsg').textContent = msg || ''; } });
  try { await S.cam.start(); } catch(e){ toast('카메라를 켜지 못했어요: ' + (e.message||e), 'err'); wrap.style.display = 'none'; $('btnCam').textContent = '📷 카메라로 찍기'; }
}

/* ---------- 시작 ---------- */
function wire(){
  const inp = $('scanInput');
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const v = inp.value; inp.value = ''; if (v.trim()) addScan(v); } });
  $('btnCam').onclick = toggleCam; $('btnPaste').onclick = openPaste; $('btnUndo').onclick = undoLast;
  $('btnRetry').onclick = () => { S.list.forEach(it => { if (!master.has(it.bc)) pending.add(it.bc); }); flushLookup(); };
  $('q').oninput = (e) => { S.q = e.target.value; renderList(); };
  $('vRecent').onclick = () => { S.view = 'recent'; saveSoon(); renderAll(); };
  $('vBrand').onclick = () => { S.view = 'brand'; saveSoon(); renderAll(); };
  $('btnXlsx').onclick = downloadXlsx; $('btnCopy').onclick = copyTable;
  $('btnClear').onclick = () => { if (!S.list.length) return; if (!confirm(`지금 리스트(${S.list.length}종, 총 ${S.list.reduce((a,b)=>a+b.qty,0)}개)를 지우고 새로 시작할까요?\n엑셀로 내려받지 않았다면 먼저 받아주세요.`)) return; S.list = []; S.log = []; S.lastBc = null; freshBc = null; saveSoon(); renderAll(); focusInput(); };
  $('btnUpload').onclick = () => $('mFile').click(); $('mFile').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) uploadMaster(f); };
  $('btnSeed').onclick = runSeed; $('btnResolve').onclick = runResolve; $('mq').oninput = masterSearch;
  $('mpanel').addEventListener('toggle', () => { if ($('mpanel').open) loadMasterStats(); });
  $('modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  document.addEventListener('click', (e) => { if (!e.target.closest('input,textarea,button,select,summary,.modal')) focusInput(); });
}
window.addEventListener('beforeunload', (e) => { if (S.list.length) { /* 목록은 자동 저장되므로 경고 없이 닫아도 됨 */ } });

restore();
if (renderShell()) {
  wire(); setNet(false); $('net').textContent = '';
  S.lastBc = S.log.length ? S.log[S.log.length-1].bc : null;
  renderAll(); lookupAllUnknown(); focusInput();
}
</script>

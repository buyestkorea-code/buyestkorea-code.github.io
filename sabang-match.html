<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사방넷-이카운트 매칭 관리</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#fafafa; --accent:#0f766e; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --blue:#1d4ed8; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; max-width:1280px; margin:0 auto; padding:18px 18px 80px; background:var(--bg); color:var(--ink); font-size:13.5px; }
  h1 { font-size:20px; margin:4px 0 4px; } h1 .tag { font-size:11px; background:#fef3c7; color:#92400e; padding:2px 8px; border-radius:999px; vertical-align:middle; margin-left:6px; }
  p.lead { color:var(--muted); margin:4px 0 14px; line-height:1.6; font-size:13px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dropzone { flex:1 1 320px; border:1.5px dashed var(--line); border-radius:8px; padding:16px 12px; text-align:center; color:var(--muted); cursor:pointer; font-size:13px; }
  .dropzone:hover,.dropzone.drag { border-color:var(--accent); background:#f0fdfa; color:var(--ink); }
  .dropzone.has-file { border-style:solid; border-color:var(--accent); color:var(--ink); }
  .dropzone input { display:none; }
  .btn { font-size:13.5px; padding:9px 16px; border:none; border-radius:8px; cursor:pointer; font-weight:600; background:var(--ink); color:#fff; }
  .btn:disabled { opacity:.35; cursor:default; } .btn.sec { background:#fff; color:var(--ink); border:1px solid var(--line); } .btn.green { background:var(--accent); } .btn.red { background:var(--bad); } .btn.sm { padding:5px 10px; font-size:12px; }
  .msg { font-size:12.5px; margin-top:8px; line-height:1.6; color:var(--muted); } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .asof { display:inline-block; font-size:12px; font-weight:700; color:var(--accent); background:#f0fdfa; padding:4px 10px; border-radius:999px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
  .stat { flex:1 1 118px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; text-align:center; font-size:12px; color:var(--muted); }
  .stat b { display:block; font-size:20px; color:var(--ink); } .stat.on { outline:2px solid var(--accent); } .stat.c-ok b { color:var(--ok); } .stat.c-warn b { color:var(--warn); } .stat.c-bad b { color:var(--bad); } .stat.c-blue b { color:var(--blue); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  input[type=text] { padding:7px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  th, td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { background:#f3f4f6; font-size:12px; color:var(--muted); position:sticky; top:0; z-index:1; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover { background:#f9fafb; }
  .chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .c-auto { background:#f0fdf4; color:#15803d; } .c-manual { background:#eff6ff; color:#1d4ed8; } .c-review { background:#fef3c7; color:#92400e; }
  .c-un { background:#fef2f2; color:#b91c1c; } .c-un0 { background:#f3f4f6; color:#6b7280; } .c-recheck { background:#fce7f3; color:#9d174d; } .c-none { background:#ede9fe; color:#5b21b6; }
  .delta-up { color:var(--ok); font-weight:700; } .delta-dn { color:var(--bad); font-weight:700; }
  small.dim { color:var(--muted); }
  .modal { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:flex-start; justify-content:center; padding:30px 12px; overflow:auto; z-index:50; }
  .modal.show { display:flex; }
  .panel { background:#fff; border-radius:12px; width:min(980px,100%); padding:16px 18px; }
  .panel h2 { font-size:16px; margin:0 0 6px; }
  .cand { display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border:1px solid var(--line); border-radius:8px; margin:5px 0; cursor:pointer; }
  .cand:hover { background:#f9fafb; } .cand.on { border-color:var(--accent); background:#f0fdfa; }
  .cand .nm { flex:1; line-height:1.5; } .cand .q { min-width:70px; text-align:right; font-weight:700; }
  .grp { font-size:12px; color:var(--muted); margin:10px 0 2px; font-weight:700; }
</style>
</head>
<body>
<h1>사방넷-이카운트 매칭 관리<span class="tag">TEST</span></h1>
<p class="lead">사방넷 단품대량수정 전체 파일과 이카운트 재고를 비교합니다. <b>코드(품번)·이름·규격이 확실한 줄은 자동 확정</b>하고, 중복·키즈/여성·스크래치처럼 애매한 줄은 직접 골라 <b>서버에 저장</b>합니다. 저장한 줄은 다음번부터 <b>"수동매칭"</b>으로 자동 적용돼요. (툴킷 로그인 필요)</p>

<div class="card">
  <div class="row">
    <label class="dropzone" id="drop"><input type="file" id="file" accept=".xlsx"><span id="dropText">① 사방넷 단품대량수정 전체 엑셀(.xlsx)을 끌어다 놓거나 눌러서 선택</span></label>
    <button class="btn green" id="run" disabled>② 이카운트 재고 불러와서 매칭 실행</button>
    <button class="btn sec" id="ecRefresh" title="서버가 이카운트에서 재고를 지금 다시 받아옵니다 (이카운트 제한상 15분에 한 번만)">🔄 이카운트 재고 지금 갱신</button>
    <button class="btn sec" id="ecNames" style="display:none">신규 품목 이름 받아오기</button>
    <span class="asof" id="asof" style="display:none"></span>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="dropzone" id="ecDrop" style="padding:10px 12px"><input type="file" id="ecFile" accept=".xlsx,.xls"><span id="ecDropText">(선택) 이카운트 재고현황/재고변동표 엑셀을 올리면 그 품목들의 재고만 서버 재고 위에 덮어씁니다 (일부 품목만 든 엑셀도 OK)</span></label>
    <button class="btn sec sm" id="ecClear" style="display:none">직접 올린 재고 해제(서버 재고로)</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="stats" id="stats"></div>
<div class="msg" id="why" style="margin:-4px 0 10px"></div>
<div class="tools" id="tools" style="display:none">
  <input type="text" id="q" placeholder="사방넷 코드·상품명·이카운트 코드 검색" style="min-width:280px">
  <button class="btn sec sm" id="bulkBtn" style="display:none">보이는 자동 후보 한꺼번에 확정(수동매칭 저장)</button>
  <button class="btn sec sm" id="dlListBtn">지금 보는 목록 엑셀 받기</button>
  <button class="btn sec sm" id="dlBtn">재고 변경분 엑셀 받기</button>
  <button class="btn sec sm" id="dlManualBtn">수동매칭 목록 엑셀</button>
  <span class="msg" id="tmsg" style="margin:0"></span>
</div>
<div id="tblWrap"></div>
<div class="tools" id="moreBar"></div>

<div class="modal" id="modal"><div class="panel" id="panel"></div></div>

<script src="assets/libs/jszip-3.10.1.min.js"></script>
<script src="assets/libs/xlsx.full-0.20.2.min.js"></script>
<script src="assets/ec-cache.js"></script>
<script>
const MATCH_API = 'https://buyest.co.kr/sabang_match_api.php';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function auth(){ try{ const a = JSON.parse(localStorage.getItem('buyest.dash.auth') || 'null'); return (a && a.id && a.pass) ? a : null; }catch(e){ return null; } }
function say(t, cls){ const m = $('msg'); m.className = 'msg ' + (cls || ''); m.textContent = t; }
const fmt = n => Number(n).toLocaleString('ko-KR');

/* ───────── 이름·규격 비교 (MD 품절 도구와 같은 규칙) ───────── */
function normSpec(v){ let s = (v == null ? '' : String(v)).trim().toUpperCase(); s = s.replace(/\(/g,' ').replace(/\)/g,' ').replace(/\s+/g,' ').trim(); return s.replace(/^(\d+)Y$/, '$1A'); }
function specCands(v){
  const out = [normSpec(v)];
  const n = typeof v === 'number' ? v : (/^\d+$/.test(String(v == null ? '' : v).trim()) ? Number(v) : NaN);
  if(isFinite(n) && n >= 20000 && n <= 60000){ const d = new Date(Date.UTC(1899,11,30) + Math.round(n)*86400000); const mo = d.getUTCMonth()+1, da = d.getUTCDate(); out.push(normSpec(mo+'-'+da), normSpec(da+'-'+mo)); }
  return out;
}
function specsMatch(ec, sb){
  const E = specCands(ec), Sx = specCands(sb);
  for(const e of E) for(const s of Sx){ if(e === s) return true; if(e === 'TU' && (s === '' || s === 'FREE')) return true; }
  return false;
}
function codeSuffix(name){
  const cleaned = String(name || '').replace(/\s*\([^)]*\)\s*$/, '');
  const toks = cleaned.trim().split(/\s+/).filter(Boolean);
  let i = toks.length;
  while(i > 0 && !/[가-힣]/.test(toks[i-1])) i--;
  return toks.slice(i).join(' ');
}
const LABELS = ['하자','스크래치'];
function labelParts(text){
  const t = String(text || '').trim().replace(/^\[|\]$/g,'');
  for(const w of LABELS){ if(t.indexOf(w) === 0){ const mm = /(\d+)\s*$/.exec(t.slice(w.length)); return {base:w, num: mm ? mm[1] : ''}; } }
  return null;
}
function ecLabel(name){ const m = /^\[([^\]]+)\]/.exec(String(name||'').trim()); return m ? labelParts(m[1]) : null; }
function sbLabel(name){ return labelParts((String(name||'').trim().split(/\s+/)[0]) || ''); }
function labelOk(ecName, sbName){
  const e = ecLabel(ecName), b = sbLabel(sbName);
  if((e ? e.base : null) !== (b ? b.base : null)) return false;
  if(e && b && e.num && b.num && e.num !== b.num) return false;
  return true;
}
function genderSet(name){ const t = String(name||'').replace(/\[[^\]]*\]/g,' ').split(/[\s\/&,()]+/), o = {}; ['키즈','여성','남성','남아','여아'].forEach(w => { if(t.indexOf(w) !== -1) o[w] = 1; }); return Object.keys(o).sort(); }
function genderOk(a, b){
  const A = genderSet(a), B = genderSet(b);
  if(!A.length || !B.length) return true;
  return A.every(x => B.indexOf(x) !== -1) || B.every(x => A.indexOf(x) !== -1);
}
function seasonTag(name){ const t = (String(name||'').trim().split(/\s+/)[0] || '').toUpperCase(); return /^(\d{2}(SS|FW|S\/S|F\/W)|\d+주년)$/.test(t) ? t.replace('/','') : ''; }
function tokset(n){ const o = {}; String(n||'').toUpperCase().replace(/[\/&,()\[\]]/g,' ').split(/\s+/).filter(Boolean).forEach(x => o[x] = 1); return o; }
function dice(a, b){
  const f = x => String(x||'').toUpperCase().replace(/[\s\/&,()\[\]]+/g,'');
  const A = f(a), B = f(b); if(A.length < 2 || B.length < 2) return A === B ? 1 : 0;
  const grams = x => { const m = new Map(); for(let i = 0; i < x.length - 1; i++){ const g = x.substr(i,2); m.set(g, (m.get(g)||0) + 1); } return m; };
  const ga = grams(A), gb = grams(B); let inter = 0; ga.forEach((n, g) => { if(gb.has(g)) inter += Math.min(n, gb.get(g)); });
  return 2*inter / (A.length - 1 + B.length - 1);
}
function nameScore(a, b){ const A = tokset(a), B = tokset(b); let i = 0, u = 0; for(const k in A){ u++; if(B[k]) i++; } for(const k in B){ if(!A[k]) u++; } return u ? i/u : 0; }

/* ───────── 사방넷 엑셀 읽기 (큰 파일용: 압축을 풀어 XML 에서 직접 읽는다) ───────── */
function unesc(s){ return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,'&'); }
async function readSabangFile(file){
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const ssFile = zip.file('xl/sharedStrings.xml');
  const ss = [];
  if(ssFile){
    const sx = await ssFile.async('string');
    const siRe = /<si>([\s\S]*?)<\/si>/g; let m;
    while((m = siRe.exec(sx))){ let t = ''; const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g; let tm; while((tm = tRe.exec(m[1]))) t += tm[1]; ss.push(unesc(t)); }
  }
  let sheetPath = 'xl/worksheets/sheet1.xml';
  if(!zip.file(sheetPath)){ const k = Object.keys(zip.files).find(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)); if(!k) throw new Error('시트를 찾지 못했어요.'); sheetPath = k; }
  const xml = await zip.file(sheetPath).async('string');
  const rowRe = /<row [^>]*?r="(\d+)"[^>]*?>([\s\S]*?)<\/row>/g, cellRe = /<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  const aoa = []; let rm;
  while((rm = rowRe.exec(xml))){
    const arr = []; let cm; cellRe.lastIndex = 0;
    while((cm = cellRe.exec(rm[2]))){
      let col = 0; for(let i = 0; i < cm[1].length; i++) col = col*26 + (cm[1].charCodeAt(i) - 64);
      const inner = cm[3] || ''; let val = null;
      const isM = /<is>[\s\S]*?<t[^>]*>([\s\S]*?)<\/t>/.exec(inner);
      if(isM) val = unesc(isM[1]);
      else { const vM = /<v>([\s\S]*?)<\/v>/.exec(inner); if(vM) val = /\bt="s"/.test(cm[2]) ? (ss[parseInt(vM[1],10)] || '') : unesc(vM[1]); }
      arr[col-1] = val;
    }
    aoa[parseInt(rm[1],10)-1] = arr;
  }
  for(let r = 0; r < aoa.length; r++) if(!aoa[r]) aoa[r] = [];
  return aoa;
}

/* ───────── 상태 ───────── */
const S = { file:null, aoa:null, hdrRow:-1, dataStart:-1, col:{}, sb:[], ec:null, ecByCode:{}, ecByKey:{}, manual:{}, rows:[], filter:'all', limit:300, q:'', asof:null };

function parseSabang(aoa){
  const h = aoa.findIndex(r => r && r[0] && String(r[0]).indexOf('사방넷상품코드') !== -1);
  if(h < 0) throw new Error('헤더 행("사방넷상품코드")을 찾지 못했어요. 사방넷 단품대량수정 엑셀이 맞는지 확인해 주세요.');
  const col = {}; (aoa[h] || []).forEach((v, i) => { if(v == null) return; const k = String(v).split('\n')[0].split(' [')[0].trim(); if(k && !(k in col)) col[k] = i; });
  for(const need of ['상품명','옵션상세명칭','현재고']) if(!(need in col)) throw new Error('"' + need + '" 열을 찾지 못했어요.');
  const sb = []; let start = -1;
  for(let r = h + 1; r < aoa.length; r++){
    const row = aoa[r]; const code = row && row[col['사방넷상품코드']] != null ? String(row[col['사방넷상품코드']]).trim() : '';
    if(!/^\d+-\d+$/.test(code)) continue;
    if(start < 0) start = r;
    const raw = row[col['현재고']];
    sb.push({ r, code, name: String(row[col['상품명']] == null ? '' : row[col['상품명']]).trim(), spec: row[col['옵션상세명칭']] == null ? '' : String(row[col['옵션상세명칭']]).trim(), cur: raw == null || raw === '' ? 0 : (Number(raw) || 0) });
  }
  if(!sb.length) throw new Error('사방넷 상품 행을 찾지 못했어요.');
  S.aoa = aoa; S.hdrRow = h; S.dataStart = start; S.col = col; S.sb = sb;
}

function buildEcIndex(items){
  S.ec = items; S.ecByCode = {}; S.ecByKey = {};
  for(const it of items){
    it.key = codeSuffix(it.name); it.label = ecLabel(it.name);
    S.ecByCode[it.code] = it;
    if(it.key) (S.ecByKey[it.key] = S.ecByKey[it.key] || []).push(it);
  }
}

/* ───────── 매칭 판정 ─────────
   status: auto(자동 확정) · manual(수동매칭) · none(대응 없음 확정) · review(확인 필요) · un(미매칭, 재고 있음) · un0(미매칭, 재고 0) · recheck(수동 코드 재확인) */
function classify(row){
  const mn = S.manual[row.code];
  const res = { status:'', items:[], newVal:null, reasons:[], cands:[], bestScore:0 };
  if(mn){
    if(mn.m === 'none'){ res.status = 'none'; return res; }
    const codes = String(mn.e || '').split(',').filter(Boolean), found = [], missing = [];
    codes.forEach(c => { const it = S.ecByCode[c]; if(it) found.push(it); else missing.push(c); });
    res.items = found; res.newVal = found.reduce((t, x) => t + x.qty, 0);
    if(missing.length){ res.status = 'recheck'; res.reasons.push('저장된 이카운트 코드 ' + missing.join(', ') + ' 가 지금 목록에 없어요(사용중단 등)'); }
    else res.status = 'manual';
    return res;
  }
  const key = codeSuffix(row.name);
  const all = key ? (S.ecByKey[key] || []) : [];
  const spec = all.filter(it => specsMatch(it.spec, row.spec) && labelOk(it.name, row.name) && genderOk(it.name, row.name));
  if(!spec.length){
    res.status = row.cur > 0 ? 'un' : 'un0';
    res.reasons.push(all.length ? '같은 품번은 있지만 이 규격/구분의 이카운트 코드가 없어요' : '같은 품번의 이카운트 품목이 없어요');
    return res;
  }
  const groups = {};
  spec.forEach(it => { (groups[it.name] = groups[it.name] || []).push(it); });
  const scored = Object.keys(groups).map(n => ({ n, sc: nameScore(row.name, n), items: groups[n] }));
  const best = scored.reduce((m, g) => g.sc > m ? g.sc : m, 0);
  let kept = scored.filter(g => g.sc >= best - 0.0001);
  res.bestScore = best;
  // 같은 시즌·주년의 이카운트 상품이 따로 있는데 그 사이즈 코드만 없는 경우(13주년↔15주년 등)는 다른 시즌 재고를 쓰지 않는다
  const sbTag = seasonTag(row.name);
  if(sbTag){
    let sameTagAlt = false, bestAny = 0;
    all.forEach(it => { const s2 = nameScore(row.name, it.name); if(s2 > bestAny) bestAny = s2; if(seasonTag(it.name) === sbTag) sameTagAlt = true; });
    const keptSame = kept.some(g => seasonTag(g.n) === sbTag);
    if(sameTagAlt && !keptSame && best < bestAny - 0.0001){
      res.status = row.cur > 0 ? 'un' : 'un0';
      res.reasons.push('같은 시즌/주년의 이카운트 상품은 이 규격이 없고, 다른 시즌 상품만 있어요');
      return res;
    }
  }
  const stocked = kept.reduce((t, g) => t + g.items.filter(x => x.qty > 0).length, 0);
  if(kept.length > 1){ res.status = 'review'; res.reasons.push('이름이 같은 정도로 비슷한 이카운트 상품이 ' + kept.length + '개'); }
  else {
    res.status = 'auto';
    if(stocked >= 2){ res.status = 'review'; res.reasons.push('재고 있는 코드 ' + stocked + '개가 합쳐집니다'); }
    const loose = Math.max(best, dice(row.name, kept[0].n));   // 띄어쓰기만 다른 이름은 낮게 보지 않는다
    if(loose < 0.6){ res.status = 'review'; res.reasons.push('상품명 유사도 낮음(' + loose.toFixed(2) + ')'); }
  }
  kept.forEach(g => g.items.forEach(it => res.items.push(it)));
  res.newVal = res.items.reduce((t, x) => t + x.qty, 0);
  return res;
}

function runAll(){
  S.rows = S.sb.map(row => ({ row, res: classify(row) }));
}
function counts(){
  const c = { all:S.rows.length, auto:0, manual:0, none:0, review:0, un:0, un0:0, recheck:0, change:0 };

  return c;
}

/* 이카운트 재고현황/재고변동표 엑셀 → [{code,name,spec,qty}] (헤더 행의 품목코드·품목명·규격·재고 열을 이름으로 찾음) */
function parseEcExcel(aoa){
  let h = -1;
  for(let i = 0; i < Math.min(aoa.length, 15); i++){ if((aoa[i] || []).some(c => String(c == null ? '' : c).replace(/\s/g,'') === '품목코드')){ h = i; break; } }
  const col = {};
  if(h >= 0){
    const hdr = [aoa[h] || [], aoa[h+1] || []];
    hdr.forEach(r => r.forEach((c, j) => { const k = String(c == null ? '' : c).replace(/\s/g,''); if(k && !(k in col)) col[k] = j; }));
  }
  const qk = ['잔량','재고수량','현재고','현재재고','재고','수량'].find(k => k in col);
  let cc, cn, cs, cq, start;
  if(h >= 0 && qk && '품목명' in col){ cc = col['품목코드']; cn = col['품목명']; cs = ('규격' in col) ? col['규격'] : -1; cq = col[qk]; start = h + 1; }
  else { cc = 0; cn = 1; cs = -1; cq = 2; start = 2; }   // 기본 재고현황 양식: A=품목코드, B=품목명[규격], C=재고
  const by = {}, items = [];
  for(let r = start; r < aoa.length; r++){
    const row = aoa[r]; if(!row) continue;
    const code = String(row[cc] == null ? '' : row[cc]).trim(), nm = String(row[cn] == null ? '' : row[cn]).trim();
    if(!code || !nm || !/^[0-9A-Za-z-]+$/.test(code)) continue;
    let name = nm, spec = cs >= 0 ? String(row[cs] == null ? '' : row[cs]).trim() : '';
    if(cs < 0){ const m = /^(.*?)\s*\[([^\[\]]*)\]\s*$/.exec(nm); if(m){ name = m[1].trim(); spec = m[2].trim(); } }
    const q = Number(String(row[cq] == null ? 0 : row[cq]).replace(/,/g,'')) || 0;
    if(by[code]){ by[code].qty += q; } else { by[code] = { code, name, spec, qty:q }; items.push(by[code]); }
  }
  return items;
}

    b2.style.display = d.missing_names > 0 ? '' : 'none';
    b2.textContent = `신규 품목 이름 받아오기 (${fmt(d.missing_names || 0)}개 이름 없음)`;
    say((names ? '신규 품목 이름을 받아왔어요.' : `이카운트 재고를 갱신했어요 (${fmt(d.rows || 0)}품목).`) + (d.missing_names > 0 ? ` 이름이 아직 없는 신규 품목 ${fmt(d.missing_names)}개는 코드로만 보여요 — 15분 뒤 "신규 품목 이름 받아오기"를 누르면 채워집니다.` : '') + (S.file ? ' 이어서 매칭합니다…' : ''), 'ok');
    if(S.file){ b1.disabled = b2.disabled = false; $('run').disabled = false; await $('run').onclick(); return; }
  }catch(e){ say(e.message, 'err'); }
  b1.disabled = b2.disabled = false;
}

$('run').onclick = async () => {
  $('run').disabled = true;
  try{
    if(!auth()) throw new Error('툴킷에 로그인한 뒤 사용할 수 있어요. 로그인 후 새로고침해 주세요.');
    say('사방넷 파일을 읽는 중… (큰 파일은 몇 초 걸려요)');
    const aoa = await readSabangFile(S.file); parseSabang(aoa);
    say(`사방넷 옵션 ${fmt(S.sb.length)}줄을 읽었어요. 이카운트 재고를 불러오는 중…`);
    if(S.manualEc){
      /* 올린 엑셀은 서버 품목 목록을 "대체"하지 않고 그 위에 재고만 덮어쓴다(일부 품목만 든 엑셀이어도 나머지 품목이 사라지지 않게).
         서버를 못 쓸 때만 엑셀만으로 진행한다. */
      let base = null;
      try{ base = await ECCache.load('master', { extra:{ include_unnamed:1 }, tag:'_u' }); }catch(e){ base = null; }
      if(base && base.rows && base.rows.length){
        const items = base.rows.map(r => ({ code:r[0], name:r[1], spec:r[2], qty:r[3] })), by = {};
        items.forEach(it => { by[it.code] = it; });
        let upd = 0, add = 0;
        S.manualEc.items.forEach(m => { const it = by[m.code]; if(it){ if(it.qty !== m.qty) upd++; it.qty = m.qty; } else { items.push({ code:m.code, name:m.name, spec:m.spec, qty:m.qty }); add++; } });
        buildEcIndex(items);
        $('asof').style.display = ''; $('asof').textContent = `서버 품목 + 수동 엑셀 ${fmt(S.manualEc.items.length)}품목 덮어씀 (재고 변경 ${fmt(upd)} · 신규 ${fmt(add)}) · ${S.manualEc.name}`;
      } else {
        buildEcIndex(S.manualEc.items);
        $('asof').style.display = ''; $('asof').textContent = `⚠ 서버 재고 없이 수동 엑셀만 사용 · ${S.manualEc.name} · ${fmt(S.manualEc.items.length)}품목`;
      }
    } else {
      const d = await ECCache.load('master', { extra:{ include_unnamed:1 }, tag:'_u' });
      buildEcIndex(d.rows.map(r => ({ code:r[0], name:r[1], spec:r[2], qty:r[3] })));
      const t = new Date(d.as_of * 1000), p = n => String(n).padStart(2,'0');
      $('asof').style.display = ''; $('asof').textContent = `이카운트 기준 ${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}` + (d.fromCache ? ' (저장본)' : '');
    }
    say('저장된 수동매칭을 불러오는 중…');
    const ml = await api({ action:'list' });
    S.manual = {}; ml.rows.forEach(r => { S.manual[r.c] = r; });
    runAll(); S.filter = 'review'; S.limit = 300; render();
    const c = counts();
    say(`완료 — 자동 ${fmt(c.auto)} · 수동매칭 ${fmt(c.manual)} · 확인 필요 ${fmt(c.review)} · 미매칭(재고 있음) ${fmt(c.un)} · 재고 변경 예정 ${fmt(c.change)}`, 'ok');
  }catch(e){ say(e.message, 'err'); }
  $('run').disabled = false;
};

/* ───────── 내려받기 ───────── */
$('dlBtn').onclick = () => {
  const ch = S.rows.filter(x => x.res.newVal != null && x.res.status !== 'none' && x.res.newVal !== x.row.cur);
  if(!ch.length){ $('tmsg').textContent = '재고가 바뀔 줄이 없어요.'; return; }
  const col = S.col['현재고'];
  const out = S.aoa.slice(0, S.dataStart).concat(ch.map(x => { const row = S.aoa[x.row.r].slice(); row[col] = x.res.newVal; return row; }));
  const ws = XLSX.utils.aoa_to_sheet(out), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '사방넷단품대량수정');
  const d = new Date(), p = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `사방넷_재고변경_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.xlsx`);
  $('tmsg').textContent = `${fmt(ch.length)}줄을 내려받았어요.`;
};
/* 지금 선택한 분류(통계 칸) + 검색어에 해당하는 줄 전체(화면에 일부만 그려도 엑셀은 전부)를 내려받는다 — 사방넷 코드 포함 */
$('dlListBtn').onclick = () => {
  const vis = visibleRows();
  if(!vis.length){ $('tmsg').textContent = '내려받을 줄이 없어요.'; return; }
  vis.sort((a, b) => (ORDER[a.res.status] - ORDER[b.res.status]));
  const FL = { all:'전체', change:'재고변경예정', auto:'자동확정', manual:'수동매칭', review:'확인필요', un:'미매칭_재고있음', un0:'이카운트미등록_재고0', recheck:'수동매칭재확인', none:'대응없음확정' };
  const aoa = [['사방넷 코드','사방넷 상품명','옵션','사방넷 현재고','상태','이카운트 코드','이카운트 상품명','이카운트 재고(반영값)','사유','메모','등록자','등록일시']];
  vis.forEach(x => {
    const r = x.row, res = x.res, mn = S.manual[r.code];
    aoa.push([r.code, r.name, r.spec, r.cur, STATUS[res.status][0], res.items.map(i => i.code).join(', '), res.items.map(i => i.name + ' [' + i.spec + ']').join(' / '),
      res.newVal == null ? '' : res.newVal, res.reasons.join(' · '), mn ? mn.memo : '', mn ? mn.u : '', mn ? new Date(mn.t*1000).toLocaleString('ko-KR') : '']);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:14},{wch:46},{wch:10},{wch:10},{wch:16},{wch:22},{wch:50},{wch:12},{wch:40},{wch:30},{wch:12},{wch:20}];
  // 사방넷 코드·이카운트 코드는 앞자리 0/하이픈이 유지되도록 텍스트로 저장
  for(let i = 1; i < aoa.length; i++){ [0, 5].forEach(c => { const ref = XLSX.utils.encode_cell({ r:i, c }); if(ws[ref]){ ws[ref].t = 's'; ws[ref].z = '@'; } }); }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, (FL[S.filter] || '목록').slice(0, 30));
  const d = new Date(), p = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `사방넷매칭_${FL[S.filter] || '목록'}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.xlsx`);
  $('tmsg').textContent = `${fmt(vis.length)}건을 내려받았어요.`;
};
$('dlManualBtn').onclick = () => {
  const list = Object.values(S.manual); if(!list.length){ $('tmsg').textContent = '저장된 수동매칭이 없어요.'; return; }
  const aoa = [['사방넷 코드','구분','이카운트 코드','메모','등록자','등록시각']].concat(list.map(m => [m.c, m.m === 'none' ? '대응 없음' : '매칭', m.e, m.memo, m.u, new Date(m.t*1000).toLocaleString('ko-KR')]));
  const ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '수동매칭');
  XLSX.writeFile(wb, '사방넷_수동매칭_목록.xlsx');
};
if(!auth()) say('툴킷에 로그인한 뒤 사용할 수 있어요. 로그인 후 새로고침해 주세요.', 'err');
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>바코드 재고조회</title>
<style>
  :root {
    --ink: #111827; --ink-muted: #6b7280; --line: #e5e7eb; --bg: #fafafa;
    --ok-bg: #f0fdf4; --ok-fg: #15803d; --bad-bg: #fef2f2; --bad-fg: #b91c1c;
    --warn-bg: #fef3c7; --warn-fg: #92400e; --accent: #0f766e;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 640px; margin: 0 auto; padding: 18px 16px 60px; background: var(--bg); color: var(--ink); }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  p.lead { color: var(--ink-muted); margin: 4px 0 16px; font-size: 13px; line-height: 1.55; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card-label { font-size: 12px; font-weight: 700; color: var(--ink-muted); margin-bottom: 8px; display: block; }
  .list-status { font-size: 12.5px; color: var(--ink-muted); margin-top: 6px; }
  .list-status.ok { color: var(--ok-fg); }
  .updated-badge { font-size: 11px; font-weight: 700; color: var(--accent); background: #f0fdfa; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .updated-badge:empty { display: none; }

  /* 카메라를 붙이기 전에도 고정 높이를 미리 잡아둔다 — html5-qrcode가 시작 시점에 이 박스의
     크기를 측정해서 비디오 크기를 정하는데, 비어있다고 접혀있으면(0x0) 스트림은 켜져도
     화면엔 아무것도 안 그려지는 문제(사용자 눈엔 "권한만 허용되고 녹화만 되는" 것처럼 보임)가 생긴다. */
  #reader { width: 100%; min-height: 260px; border-radius: 10px; overflow: hidden; background: #000; display: none; }
  #reader.active { display: block; }

  .btn { font-size: 15px; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary.on { background: var(--bad-fg); }
  .btn-primary:active { opacity: .85; }

  .field { margin-top: 12px; }
  .field label { font-size: 12px; color: var(--ink-muted); font-weight: 600; display: block; margin-bottom: 5px; }
  input[type=text] { width: 100%; font-size: 17px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font-weight: 700; letter-spacing: .3px; }
  input[type=text]:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  input[type=file] { font-size: 13px; width: 100%; }
  .dropzone { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px 12px; text-align: center; color: var(--ink-muted); cursor: pointer; transition: border-color .12s, background .12s; font-size: 12.5px; }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: #f0fdfa; color: var(--ink); }
  .dropzone.has-file { border-style: solid; border-color: var(--accent); }
  .dropzone input[type=file] { display: none; }

  .result { border-radius: 12px; padding: 16px; display: none; }
  .result.show { display: block; }
  .result-head { text-align: center; margin-bottom: 10px; }
  .result-name { font-size: 14px; color: var(--ink-muted); margin-bottom: 2px; min-height: 18px; }
  .result-code { font-size: 20px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .3px; }
  .result-note { font-size: 13px; font-weight: 600; text-align: center; margin-top: 4px; }
  .result.loading { background: #f3f4f6; }
  .result.warn { background: var(--warn-bg); } .result.warn .result-note { color: var(--warn-fg); }
  .result.ready { background: #fff; border: 1px solid var(--line); }

  table.size-tbl { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; border-radius: 8px; overflow: hidden; margin-top: 4px; }
  table.size-tbl th, table.size-tbl td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); }
  table.size-tbl th { background: #f3f4f6; font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }
  table.size-tbl tr:last-child td { border-bottom: none; }
  table.size-tbl .sz { font-weight: 600; text-align: left; }
  table.size-tbl .qty { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  table.size-tbl tr.ok .qty { color: var(--ok-fg); }
  table.size-tbl tr.zero .qty { color: var(--bad-fg); }
  table.size-tbl tr.unknown .qty { color: var(--ink-muted); }
  .truncate-note { font-size: 11.5px; color: var(--warn-fg); text-align: center; margin-top: 8px; }

  .history-head { font-size: 12px; font-weight: 700; color: var(--ink-muted); margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .history-head button { font-size: 12px; background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 2px; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 12.5px; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  table.hist th, table.hist td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  table.hist th { background: #f3f4f6; font-weight: 600; color: var(--ink-muted); }
  table.hist tr:last-child td { border-bottom: none; }
  .qty-chip { font-weight: 700; }
  .qty-chip.ok { color: var(--ok-fg); } .qty-chip.zero { color: var(--bad-fg); } .qty-chip.warn { color: var(--warn-fg); }
  .empty-row td { text-align: center; color: var(--ink-muted); padding: 16px 8px; }
</style>
</head>
<body>
  <h1>바코드 재고조회</h1>
  <p class="lead">매장 바코드를 스캔하면 스타일코드를 뽑아서 이카운트 실시간 재고를 <b>사이즈별로</b> 보여줍니다. 카메라로 찍거나, 전용 스캐너·키보드로 직접 입력해도 됩니다.</p>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <label class="card-label" style="margin-bottom:0;">키즈매장재고 리스트 (한 번 올리면 다음부터 모든 휴대폰에서 자동으로 불러옵니다)</label>
      <span id="listUpdatedBadge" class="updated-badge"></span>
    </div>
    <div class="dropzone" id="listDrop" tabindex="0" role="button" aria-label="재고 리스트 파일 선택">
      <div id="listDropText">클릭 또는 파일을 끌어다 놓으세요</div>
      <input type="file" id="listFile" accept=".xlsx,.xls,.csv">
    </div>
    <div class="list-status" id="listStatus">불러오는 중…</div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <button class="btn btn-primary" id="scanToggle">카메라로 스캔 시작</button>
    <div class="field">
      <label>또는 직접 입력 / 전용 스캐너로 스캔</label>
      <input type="text" id="manualInput" placeholder="코드 입력 후 Enter" autocomplete="off" inputmode="numeric">
    </div>
  </div>

  <div class="result" id="result"></div>

  <div class="history-head">
    <span>최근 스캔 기록</span>
    <button id="clearHistBtn" type="button">지우기</button>
  </div>
  <table class="hist" id="histTable">
    <thead><tr><th>시간</th><th>스타일코드</th><th>품목명</th><th>결과</th></tr></thead>
    <tbody id="histBody"><tr class="empty-row"><td colspan="4">아직 스캔한 기록이 없습니다.</td></tr></tbody>
  </table>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script>
const API_URL = 'https://buyest.co.kr/barcode_stock_lookup_api.php';
const LIST_API_URL = 'https://buyest.co.kr/barcode_list_api.php';

function wireDropzone(zoneId, inputId){
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  input.addEventListener('change', () => {
    if (input.files[0]) { zone.classList.add('has-file'); document.getElementById(zoneId + 'Text').textContent = '✓ ' + input.files[0].name; }
  });
  ['dragenter','dragover'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e => {
    if (e.dataTransfer.files[0]) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change', { bubbles: true })); }
  });
  zone.addEventListener('paste', e => {
    const f = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0];
    if (f) { const dt = new DataTransfer(); dt.items.add(f); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true })); }
  });
}
wireDropzone('listDrop', 'listFile');
const S = v => (v === null || v === undefined) ? '' : String(v).trim();
const escHtml = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

// ---- 키즈매장재고 리스트: 바코드 -> 품목명("스타일코드_사이즈") 대조표 ----
// 한 번 업로드하면 서버에 저장해두고(barcode_list_api.php), 다음부터는 페이지 열 때마다
// 자동으로 불러온다 — 직원마다 휴대폰에서 매번 다시 올릴 필요 없게.
let codeMap = new Map(); // 바코드 원문 -> { name: "품목명" }

function fmtUpdatedAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function setUpdatedBadge(iso) {
  const el = document.getElementById('listUpdatedBadge');
  el.textContent = iso ? `업데이트 ${fmtUpdatedAt(iso)}` : '';
}

async function loadSavedList() {
  const statusEl = document.getElementById('listStatus');
  try {
    const res = await fetch(LIST_API_URL);
    const data = await res.json();
    if (!data.ok || !data.rows || !data.rows.length) {
      statusEl.textContent = '아직 저장된 리스트가 없습니다. 파일을 한 번 올려주세요.';
      statusEl.className = 'list-status';
      return;
    }
    codeMap = new Map();
    for (const r of data.rows) codeMap.set(r.barcode, { name: r.name });
    setUpdatedBadge(data.updated_at);
    statusEl.textContent = `${data.count}건 자동으로 불러왔습니다. 목록을 바꾸려면 새 파일을 올려주세요.`;
    statusEl.className = 'list-status ok';
  } catch (err) {
    statusEl.textContent = '저장된 리스트를 불러오지 못했습니다: ' + err.message;
    statusEl.className = 'list-status';
  }
}
loadSavedList();

document.getElementById('listFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  const statusEl = document.getElementById('listStatus');
  if (!f) return;
  try {
    const buf = await f.arrayBuffer();
    const head = new TextDecoder('utf-8').decode(buf.slice(0, 300));
    let rows;
    if (/<html|<table|<meta/i.test(head)) {
      const encMatch = /charset=([\w-]+)/i.exec(head);
      let enc = (encMatch ? encMatch[1] : 'utf-8').toLowerCase();
      if (enc === 'ks_c_5601-1987' || enc === 'euc-kr') enc = 'euc-kr';
      const text = new TextDecoder(enc).decode(buf);
      const doc = new DOMParser().parseFromString(text, 'text/html');
      rows = Array.from(doc.querySelectorAll('table tr')).map(tr =>
        Array.from(tr.children).map(td => td.textContent.trim())
      );
    } else {
      const wb = XLSX.read(buf, { type: 'array' });
      rows = [];
      for (const name of wb.SheetNames) {
        rows.push(...XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false }));
      }
    }

    codeMap = new Map();
    const parsedRows = [];
    let cBar = -1, cName = -1, started = false, count = 0;
    for (const row of rows) {
      if (!row) continue;
      if (!started) {
        for (let i = 0; i < row.length; i++) {
          const t = S(row[i]).replace(/\s/g, '');
          if (/바코드|barcode/i.test(t)) cBar = i;
          if (/품목명|품명|상품명|PROD_?DES/i.test(t)) cName = i;
        }
        if (cBar >= 0 && cName >= 0) { started = true; continue; }
        continue;
      }
      const bar = cBar >= 0 ? S(row[cBar]) : '';
      const nm = cName >= 0 ? S(row[cName]) : '';
      if (!bar || !nm) continue;
      codeMap.set(bar, { name: nm });
      parsedRows.push({ barcode: bar, name: nm });
      count++;
    }

    if (!count) {
      statusEl.textContent = '리스트에서 "바코드"·"품목명" 열을 못 찾았어요. 파일 형식을 확인해주세요.';
      statusEl.className = 'list-status';
      return;
    }

    statusEl.textContent = `${count}건 불러왔습니다. 서버에 저장하는 중…`;
    statusEl.className = 'list-status ok';
    try {
      const saveRes = await fetch(LIST_API_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows: parsedRows })
      });
      const saveData = await saveRes.json();
      if (saveData.ok) {
        setUpdatedBadge(new Date().toISOString());
        statusEl.textContent = `${count}건 저장 완료 — 이제 다른 직원 휴대폰에서도 자동으로 불러옵니다.`;
      } else {
        statusEl.textContent = `${count}건 불러왔지만 서버 저장에 실패했습니다(이 화면에서만 사용 가능): ${saveData.error || ''}`;
      }
    } catch (saveErr) {
      statusEl.textContent = `${count}건 불러왔지만 서버 저장에 실패했습니다(이 화면에서만 사용 가능): ${saveErr.message}`;
    }
  } catch (err) {
    statusEl.textContent = '리스트를 읽지 못했습니다: ' + err.message;
    statusEl.className = 'list-status';
  }
});

// "4078604_27" -> "4078604" (마지막 언더스코어 뒷부분 = 사이즈, 그 앞은 전부 스타일코드).
// "행_2619971021 001_L"처럼 스타일코드 자체에 언더스코어가 섞여 있는 경우가 있어(예: "행_" 접두사),
// 첫 언더스코어로 자르면 스타일코드가 잘려서 엉뚱한 품목과 매칭된다 — 반드시 마지막 언더스코어 기준으로 잘라야 한다.
// (같은 리스트 포맷을 쓰는 pos.html의 parseInventoryExcel과 동일한 규칙.)
// 그 다음, 맨 앞의 "행_"/"부_"/"백_" 같은 매장 진열구역 표시(한글+언더스코어)는 실제 스타일코드가 아니라
// 이 리스트에서만 쓰는 분류 태그라 사이트 상품검색과 전혀 안 맞는다 — 이것도 떼어내야 검색이 된다
// (실측: "행_2619971021 001"로 검색하면 0건, "2619971021 001"로 검색하면 정상 매칭 — 2026-09-28 확인).
//
// ⚠️ 순서가 중요하다 (2026-09-30 사고): 반드시 "구역태그 제거 → 그 다음 남은 언더스코어를 사이즈로 판단" 순서여야 한다.
// 리스트 파일에 따라 품목명에 사이즈가 아예 없는 경우가 있다(예: "행_1A107 00 53029 776").
// 이때 마지막 언더스코어부터 자르면 태그 뒤 스타일코드 전체가 "사이즈"로 오인돼 잘려나가고 "행" 한 글자만 남는다.
// 그러면 서버에 "행"이 전송돼 모든 바코드가 같은 엉뚱한 검색을 하고 이카운트 호출만 낭비한다(→ 412 차단의 한 원인).
//   "행_1A107 00 53029 776" → "1A107 00 53029 776"   (사이즈 없음)
//   "행_2619971021 001_L"   → "2619971021 001"        (사이즈 있음)
//   "4078604_27"            → "4078604"
function extractStyleCode(name) {
  let s = S(name).trim().replace(/^[가-힣]+_/, '');   // ① 구역태그 먼저 제거
  const us = s.lastIndexOf('_');                       // ② 남은 밑줄이 있을 때만 그 뒤를 사이즈로 취급
  return (us >= 0 ? s.slice(0, us) : s).trim();
}

// 서버(이카운트)로 보내도 되는 스타일코드인지 사전 검사. 잘못된 값이 이카운트 호출까지 가지 않도록 한다.
// (영문/숫자가 하나도 없거나 너무 짧으면 — 예: "행" — 조회하지 않는다.)
function isValidStyleCode(code) {
  const c = S(code);
  return c.length >= 4 && /[0-9A-Za-z]/.test(c);
}

// ---- 카메라 스캔 (html5-qrcode) ----
let html5Qr = null, scanning = false;
let lastCode = '', lastTime = 0;

document.getElementById('scanToggle').addEventListener('click', () => {
  if (scanning) stopScan(); else startScan();
});

async function startScan() {
  const btn = document.getElementById('scanToggle');
  const readerEl = document.getElementById('reader');
  // 카메라를 붙이기 전에 먼저 박스를 보이게 해서(고정 min-height 있음) 크기가 잡힌 상태로 시작한다.
  readerEl.classList.add('active');
  try {
    html5Qr = new Html5Qrcode('reader');
    await html5Qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 160 } },
      decodedText => handleCode(decodedText),
      () => {} // 프레임마다 못 읽으면 호출됨 — 무시
    );
    // 일부 브라우저(특히 iOS 사파리)는 playsinline이 없으면 전체화면 재생으로 튀어서
    // 페이지 안에서 안 보이고 카메라만 켜진 것처럼 보인다 — 방어적으로 한 번 더 명시.
    const videoEl = readerEl.querySelector('video');
    if (videoEl) { videoEl.setAttribute('playsinline', 'true'); videoEl.muted = true; }
    scanning = true;
    btn.textContent = '카메라 끄기';
    btn.classList.add('on');
  } catch (err) {
    readerEl.classList.remove('active');
    alert('카메라를 열 수 없습니다. 브라우저 카메라 권한을 확인해주세요.\n(' + err + ')');
  }
}

async function stopScan() {
  const btn = document.getElementById('scanToggle');
  if (html5Qr && scanning) {
    try { await html5Qr.stop(); html5Qr.clear(); } catch (e) {}
  }
  scanning = false;
  document.getElementById('reader').classList.remove('active');
  btn.textContent = '카메라로 스캔 시작';
  btn.classList.remove('on');
}

// ---- 수동/전용 스캐너 입력 ----
document.getElementById('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = e.target.value;
    e.target.value = '';
    handleCode(v);
  }
});

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + 0.08);
  } catch (e) {}
}

function handleCode(raw) {
  const val = S(raw);
  if (!val) return;
  const now = Date.now();
  if (val === lastCode && now - lastTime < 2500) return; // 같은 바코드 연속 인식 방지
  lastCode = val; lastTime = now;
  beep();
  lookup(val);
}

async function lookup(raw) {
  const entry = codeMap.get(raw);
  // 목록에 있으면 품목명에서 스타일코드를 뽑고, 없으면 스캔값 자체를 스타일코드로 시도
  // (직접 스타일코드를 입력/스캔하는 경우 대응).
  const name = entry ? entry.name : '';
  const styleCode = entry ? extractStyleCode(entry.name) : raw;

  showLoading(styleCode, name);
  try {
    // 스타일코드를 못 뽑았으면 서버(이카운트)로 보내지 않는다 — 불필요한 호출이 쌓이면 이카운트가 412로 차단한다.
    if (!isValidStyleCode(styleCode)) {
      throw new Error('스타일코드를 읽지 못했어요. 리스트의 품목명 형식을 확인해주세요.');
    }
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ style_code: styleCode })
    });
    // res.json() 을 바로 쓰면 서버가 빈 응답을 줄 때 "Unexpected end of JSON input" 이라는 알아보기 힘든 오류가 난다.
    const txt = await res.text();
    let data = null;
    try { data = JSON.parse(txt); } catch (e) {}
    if (!data) throw new Error(txt.trim() ? '서버 응답을 해석하지 못했어요.' : '서버가 빈 응답을 보냈어요. 잠시 후 다시 시도해주세요.');
    if (!data.ok) throw new Error(data.error || '서버 오류');
    renderItems(styleCode, name, data.items || [], data.truncated);
    addHistory(styleCode, name, data.items || [], null);
  } catch (err) {
    showError(styleCode, name, err.message);
    addHistory(styleCode, name, null, err.message);
  }
}

function showLoading(styleCode, name) {
  const box = document.getElementById('result');
  box.className = 'result show loading';
  box.innerHTML = `<div class="result-head"><div class="result-name">${escHtml(name)}</div><div class="result-code">${escHtml(styleCode)}</div></div><div class="result-note">조회 중…</div>`;
}

function showError(styleCode, name, msg) {
  const box = document.getElementById('result');
  box.className = 'result show warn';
  box.innerHTML = `<div class="result-head"><div class="result-name">${escHtml(name)}</div><div class="result-code">${escHtml(styleCode)}</div></div><div class="result-note">조회 실패: ${escHtml(msg)}</div>`;
}

// 사이즈 정렬: 문자사이즈(XXS~XXXL 등)는 옷 사이즈 순서로, 숫자사이즈(신발 등)는 오름차순으로.
// localeCompare만 쓰면 알파벳순(L,M,S,XL,XS,XXS)이 되어버려 옷 사이즈 표기와 안 맞았다(2026-09-28).
function sizeRank(sizeRaw) {
  const s = S(sizeRaw).toUpperCase();
  if (/^\d+(\.\d+)?$/.test(s)) return { grp: 1, key: parseFloat(s) };
  const m = s.match(/^(\d+)?(X*)(S|M|L)$/);
  if (m) {
    const core = m[3];
    const n = m[1] ? parseInt(m[1], 10) : m[2].length;
    if (core === 'M') return { grp: 0, key: 0 };
    return { grp: 0, key: core === 'S' ? -(n + 1) : (n + 1) };
  }
  return { grp: 2, key: s };
}
function compareSizes(a, b) {
  const ra = sizeRank(a), rb = sizeRank(b);
  if (ra.grp !== rb.grp) return ra.grp - rb.grp;
  return ra.grp === 2 ? String(ra.key).localeCompare(String(rb.key), 'ko', { numeric: true }) : ra.key - rb.key;
}

function renderItems(styleCode, name, items, truncated) {
  const box = document.getElementById('result');
  box.className = 'result show ready';
  let body;
  if (!items.length) {
    body = `<div class="result-note" style="color:var(--warn-fg);">이카운트에서 이 스타일코드와 일치하는 품목을 찾지 못했어요.</div>`;
  } else {
    const sorted = items.slice().sort((a, b) => compareSizes(a.size, b.size));
    const rows = sorted.map(it => {
      const cls = it.qty === null || it.qty === undefined ? 'unknown' : it.qty > 0 ? 'ok' : 'zero';
      const qtyLabel = (it.qty === null || it.qty === undefined) ? '조회안됨' : it.qty;
      return `<tr class="${cls}"><td class="sz">${escHtml(it.size || '-')}</td><td class="qty">${escHtml(qtyLabel)}</td></tr>`;
    }).join('');
    body = `<table class="size-tbl"><thead><tr><th>사이즈</th><th>재고</th></tr></thead><tbody>${rows}</tbody></table>`
      + (truncated ? `<div class="truncate-note">일치 품목이 많아 상위 60개만 표시했어요.</div>` : '');
  }
  box.innerHTML = `<div class="result-head"><div class="result-name">${escHtml(name)}</div><div class="result-code">${escHtml(styleCode)}</div></div>${body}`;
}

const histEntries = [];
function addHistory(styleCode, name, items, errMsg) {
  let summary, cls;
  if (errMsg) { summary = '오류'; cls = 'warn'; }
  else if (!items || !items.length) { summary = '일치없음'; cls = 'warn'; }
  else {
    const total = items.reduce((s, it) => s + (typeof it.qty === 'number' ? it.qty : 0), 0);
    summary = `${items.length}사이즈 · 합계 ${total}`;
    cls = total > 0 ? 'ok' : 'zero';
  }
  histEntries.unshift({ time: new Date().toLocaleTimeString('ko-KR', { hour12: false }), styleCode, name, summary, cls });
  if (histEntries.length > 50) histEntries.length = 50;
  renderHistory();
}
function renderHistory() {
  const body = document.getElementById('histBody');
  if (!histEntries.length) {
    body.innerHTML = '<tr class="empty-row"><td colspan="4">아직 스캔한 기록이 없습니다.</td></tr>';
    return;
  }
  body.innerHTML = histEntries.map(h => `<tr>
    <td>${h.time}</td>
    <td style="font-family:ui-monospace,SFMono-Regular,Consolas,monospace;">${escHtml(h.styleCode)}</td>
    <td>${escHtml(h.name)}</td>
    <td class="qty-chip ${h.cls}">${escHtml(h.summary)}</td>
  </tr>`).join('');
}
document.getElementById('clearHistBtn').addEventListener('click', () => {
  histEntries.length = 0; renderHistory();
});

window.addEventListener('beforeunload', () => { if (scanning) stopScan(); });
</script>

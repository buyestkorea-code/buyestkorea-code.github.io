<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BUYEST Kids — Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap');

  :root{
    --ink:#242620;
    --paper:#F2F0EB;
    --panel:#FFFFFF;
    --cognac:#6B4226;
    --botanica:#2F4B3C;
    --gold:#B08D57;
    --line: rgba(36,38,32,0.12);
    --muted:#6b6a63;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:28px 40px 20px;
    border-bottom:1px solid var(--line);
  }
  .brand-mark{
    font-family:'Fraunces', serif;
    font-size:22px;
    letter-spacing:0.02em;
  }
  .brand-mark em{ font-style:italic; color:var(--cognac); }
  .brand-sub{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:calc(100vh - 90px);
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns:1fr; }
  }

  /* ---- Atelier rail (studio picker) ---- */
  .rail{
    padding:32px 24px;
    border-right:1px solid var(--line);
  }
  .rail-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
  }
  .plate{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:1px solid var(--line);
    border-radius:2px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
    font-family:inherit;
  }
  .plate:hover{ border-color:var(--gold); }
  .plate.active{
    background:var(--ink);
    border-color:var(--ink);
  }
  .plate.active .plate-it, .plate.active .plate-kr{ color:var(--paper); }
  .plate-it{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:19px;
    color:var(--ink);
    display:block;
  }
  .plate-kr{
    font-size:12px;
    color:var(--muted);
    display:block;
    margin-top:2px;
  }

  /* ---- Main panel ---- */
  .stage{ padding:40px 48px; max-width:820px; }
  .stage-head h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:32px;
    margin:0 0 6px;
  }
  .stage-head p{
    color:var(--muted);
    margin:0 0 32px;
    font-size:14px;
    line-height:1.6;
  }

  .dropzone{
    border:1px dashed var(--line);
    border-radius:2px;
    padding:36px;
    text-align:center;
    cursor:pointer;
    background:var(--panel);
    transition:border-color .2s ease;
    position:relative;
    overflow:hidden;
  }
  .dropzone.has-image{ padding:0; border-style:solid; }
  .dropzone:hover{ border-color:var(--gold); }
  .dropzone input{ display:none; }
  .dropzone-hint{ font-size:13px; color:var(--muted); }
  .dropzone img{ width:100%; display:block; max-height:340px; object-fit:contain; background:#000; }

  .field-row{ margin-top:20px; }
  .field-row label{
    display:block;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .field-row textarea, .field-row select{
    width:100%;
    border:1px solid var(--line);
    border-radius:2px;
    padding:12px 14px;
    font-family:inherit;
    font-size:14px;
    background:var(--panel);
    color:var(--ink);
    resize:vertical;
  }
  .grid-two{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  .btn-generate{
    margin-top:24px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:14px 26px;
    font-family:'Manrope', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;
    transition:background .2s ease;
  }
  .btn-generate:hover{ background:var(--botanica); }
  .btn-generate:disabled{ background:#b9b6ac; cursor:not-allowed; }

  .status-line{
    margin-top:16px;
    font-size:13px;
    color:var(--muted);
    display:none;
  }
  .status-line.show{ display:block; }
  .status-line.error{ color:#a13d3d; }

  .result{
    margin-top:32px;
    padding-top:28px;
    border-top:1px solid var(--line);
    display:none;
  }
  .result.show{ display:block; }
  .result-label{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
  }
  .result img, .result video{
    width:100%;
    max-width:480px;
    border-radius:2px;
    display:block;
  }
  .result-download{
    display:inline-block;
    margin-top:14px;
    font-size:13px;
    color:var(--cognac);
    text-decoration:none;
    border-bottom:1px solid var(--cognac);
    padding-bottom:2px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand-mark">BUYEST <em>Kids</em> Studio</div>
    <div class="brand-sub">Atelier di Immagine</div>
  </div>
  <div class="brand-sub" id="apiStatus">Worker 미연결</div>
</div>

<div class="layout">
  <nav class="rail">
    <div class="rail-label">Ateliers</div>

    <button class="plate active" data-studio="retouch">
      <span class="plate-it">Ritocco</span>
      <span class="plate-kr">이미지 보정</span>
    </button>

    <button class="plate" data-studio="background">
      <span class="plate-it">Sfondo</span>
      <span class="plate-kr">배경 합성</span>
    </button>

    <button class="plate" data-studio="reel">
      <span class="plate-it">Reel</span>
      <span class="plate-kr">릴스용 영상</span>
    </button>

    <button class="plate" data-studio="cinema">
      <span class="plate-it">Cinema</span>
      <span class="plate-kr">프리미엄 무빙샷</span>
    </button>
  </nav>

  <main class="stage">

    <div class="stage-head">
      <h1 id="stageTitle">Ritocco</h1>
      <p id="stageDesc">제품 사진의 밝기와 디테일을 자연스럽게 보정합니다. 화이트 배경 촬영본에 가장 잘 맞습니다.</p>
    </div>

    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" />
      <span class="dropzone-hint" id="dropzoneHint">클릭하거나 사진을 끌어다 놓으세요<br/>(JPG · PNG)</span>
    </label>

    <!-- 배경 합성 전용 옵션 -->
    <div class="field-row" id="bgModeRow" style="display:none;">
      <label>배경 처리 방식</label>
      <select id="bgMode">
        <option value="remove">배경 제거 (투명)</option>
        <option value="replace">배경 교체</option>
      </select>
    </div>

    <div class="field-row" id="promptRow">
      <label id="promptLabel">디렉션 (선택)</label>
      <textarea id="promptInput" rows="2" placeholder="예: 따뜻한 오후 햇살, 은은한 그림자"></textarea>
    </div>

    <!-- Cinema 전용 카메라 값 -->
    <div class="field-row grid-two" id="cinemaRow" style="display:none;">
      <div>
        <label>초점 거리</label>
        <select id="focalLength">
          <option value="24mm">24mm — 넓게</option>
          <option value="35mm" selected>35mm — 인물/제품 표준</option>
          <option value="50mm">50mm — 자연스러운 시선</option>
          <option value="85mm">85mm — 클로즈업</option>
        </select>
      </div>
      <div>
        <label>조리개</label>
        <select id="aperture">
          <option value="f/1.4" selected>f/1.4 — 배경 흐림</option>
          <option value="f/4">f/4 — 무난한 심도</option>
          <option value="f/11">f/11 — 전체 선명</option>
        </select>
      </div>
    </div>

    <button class="btn-generate" id="generateBtn">생성하기</button>
    <div class="status-line" id="statusLine"></div>

    <div class="result" id="resultBox">
      <div class="result-label">결과</div>
      <div id="resultMedia"></div>
      <a class="result-download" id="downloadLink" href="#" download>원본 화질 내려받기 ↓</a>
    </div>

  </main>
</div>

<script>
  // ⚠️ 배포한 Cloudflare Worker 주소로 교체하세요
  const WORKER_URL = "https://buyest-studio.buyest.workers.dev";

  const STUDIOS = {
    retouch: {
      title: "Ritocco",
      desc: "제품 사진의 밝기와 디테일을 자연스럽게 보정합니다. 화이트 배경 촬영본에 가장 잘 맞습니다.",
      endpoint: "/api/retouch",
      promptLabel: "디렉션 (선택)",
      promptPlaceholder: "예: 화이트 밸런스 살짝 따뜻하게",
      showBgMode: false,
      showCinema: false,
      resultType: "image",
    },
    background: {
      title: "Sfondo",
      desc: "제품컷의 배경을 제거하거나 원하는 무드로 교체합니다.",
      endpoint: "/api/background",
      promptLabel: "교체할 배경 묘사",
      promptPlaceholder: "예: 크림톤 스튜디오 배경, 은은한 그림자",
      showBgMode: true,
      showCinema: false,
      resultType: "image",
    },
    reel: {
      title: "Reel",
      desc: "정지된 제품 사진에 자연스러운 움직임을 더해 릴스용 짧은 영상으로 만듭니다.",
      endpoint: "/api/reel",
      promptLabel: "움직임 디렉션",
      promptPlaceholder: "예: 카메라 살짝 줌인, 옷자락 흔들림",
      showBgMode: false,
      showCinema: false,
      resultType: "video",
    },
    cinema: {
      title: "Cinema",
      desc: "카메라 값을 직접 지정해 프리미엄 무드의 무빙샷을 만듭니다.",
      endpoint: "/api/cinema",
      promptLabel: "장면 디렉션",
      promptPlaceholder: "예: 아이가 천천히 돌아보는 룩북 컷",
      showBgMode: false,
      showCinema: true,
      resultType: "video",
    },
  };

  let currentStudio = "retouch";
  let uploadedImageUrl = null; // Worker에 base64로 보낼 것이므로 실제로는 data URL 사용

  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const dropzoneHint = document.getElementById("dropzoneHint");
  const generateBtn = document.getElementById("generateBtn");
  const statusLine = document.getElementById("statusLine");
  const resultBox = document.getElementById("resultBox");
  const resultMedia = document.getElementById("resultMedia");
  const downloadLink = document.getElementById("downloadLink");

  // ---- 탭 전환 ----
  document.querySelectorAll(".plate").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".plate").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentStudio = btn.dataset.studio;
      applyStudio(currentStudio);
    });
  });

  function applyStudio(key) {
    const s = STUDIOS[key];
    document.getElementById("stageTitle").textContent = s.title;
    document.getElementById("stageDesc").textContent = s.desc;
    document.getElementById("promptLabel").textContent = s.promptLabel;
    document.getElementById("promptInput").placeholder = s.promptPlaceholder;
    document.getElementById("bgModeRow").style.display = s.showBgMode ? "block" : "none";
    document.getElementById("cinemaRow").style.display = s.showCinema ? "grid" : "none";
    resetStatus();
    resultBox.classList.remove("show");
  }

  // ---- 이미지 업로드 ----
  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("dragover", (e) => e.preventDefault());
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", (e) => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      uploadedImageUrl = reader.result; // data:image/...;base64,...
      dropzone.classList.add("has-image");
      dropzoneHint.style.display = "none";
      dropzone.innerHTML = `<img src="${uploadedImageUrl}" alt="업로드한 이미지" />`;
      // hidden input을 다시 붙여야 재클릭 시 파일 선택 가능
      const newInput = document.createElement("input");
      newInput.type = "file";
      newInput.id = "fileInput";
      newInput.accept = "image/*";
      newInput.style.display = "none";
      newInput.addEventListener("change", (ev) => {
        if (ev.target.files[0]) handleFile(ev.target.files[0]);
      });
      dropzone.appendChild(newInput);
    };
    reader.readAsDataURL(file);
  }

  // ---- 생성 ----
  generateBtn.addEventListener("click", async () => {
    if (!uploadedImageUrl) {
      showStatus("먼저 이미지를 올려주세요.", true);
      return;
    }
    const s = STUDIOS[currentStudio];
    generateBtn.disabled = true;
    resultBox.classList.remove("show");
    showStatus("생성 요청 중입니다…");

    const body = {
      imageUrl: uploadedImageUrl,
      prompt: document.getElementById("promptInput").value,
    };
    if (s.showBgMode) body.mode = document.getElementById("bgMode").value;
    if (s.showCinema) {
      body.focalLength = document.getElementById("focalLength").value;
      body.aperture = document.getElementById("aperture").value;
    }

    try {
      const res = await fetch(WORKER_URL + s.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "생성 실패");

      // muapi.ai는 모든 요청이 request_id를 반환하는 비동기 방식이므로 항상 폴링합니다.
      showStatus("생성 중입니다… (최대 1~2분 소요)");
      await pollResult(data.request_id || data.id, s);
    } catch (err) {
      showStatus(err.message, true);
    } finally {
      generateBtn.disabled = false;
    }
  });

  async function pollResult(requestId, studio) {
    if (!requestId) throw new Error("작업 ID를 받지 못했습니다.");
    for (let i = 0; i < 40; i++) {
      await new Promise((r) => setTimeout(r, 3000));
      const res = await fetch(`${WORKER_URL}/api/result?id=${requestId}`);
      const data = await res.json();
      if (data.status === "completed" || data.status === "succeeded") {
        const outputUrl = (data.outputs && data.outputs[0]) || data.output_url || data.url;
        showResult(outputUrl, studio.resultType);
        showStatus("완료되었습니다.");
        return;
      }
      if (data.status === "failed") {
        throw new Error(data.error || "생성에 실패했습니다.");
      }
      showStatus(`생성 중입니다… (${i + 1}회 확인)`);
    }
    throw new Error("시간이 초과되었습니다. 잠시 후 다시 시도해주세요.");
  }

  function showResult(url, type) {
    if (!url) return;
    resultMedia.innerHTML =
      type === "video"
        ? `<video src="${url}" controls autoplay loop muted></video>`
        : `<img src="${url}" alt="생성 결과" />`;
    downloadLink.href = url;
    resultBox.classList.add("show");
  }

  function showStatus(msg, isError = false) {
    statusLine.textContent = msg;
    statusLine.classList.add("show");
    statusLine.classList.toggle("error", isError);
  }
  function resetStatus() {
    statusLine.classList.remove("show", "error");
    statusLine.textContent = "";
  }

  // Worker 연결 상태 표시 (선택)
  document.getElementById("apiStatus").textContent = WORKER_URL.includes("YOUR-SUBDOMAIN")
    ? "Worker 주소 설정 필요"
    : "Worker 연결됨";
</script>

</body>
</html>

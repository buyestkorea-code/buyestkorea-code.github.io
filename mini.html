<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>개발예정</title>
<style>
  :root{ --bg:#0b141a; --panel:#111b21; --bubble-me:#005c4b; --bubble-other:#1f2c34; --text:#e9edef; --muted:#8696a0; --accent:#00a884; --danger:#f15c6d; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .screen{ height:100vh; height:100dvh; width:100%; display:flex; }
  .screen[hidden]{ display:none; }
  #cover{ position:fixed; inset:0; z-index:9999; background:var(--bg); }
  #cover[hidden]{ display:none; }

  #login-screen{ align-items:center; justify-content:center; padding:16px; }
  .login-card{ width:100%; max-width:360px; background:var(--panel); border-radius:16px; padding:28px 24px; display:flex; flex-direction:column; gap:12px; }
  .login-card h1{ margin:0 0 4px; font-size:22px; text-align:center; }
  .login-card .hint{ margin:0 0 8px; font-size:13px; color:var(--muted); text-align:center; line-height:1.6; }
  .login-card input{ padding:12px 14px; border-radius:10px; border:1px solid #2a3942; background:#202c33; color:var(--text); font-size:16px; }
  .login-card input[readonly]{ opacity:.6; }
  .login-card button{ padding:12px; border-radius:10px; border:none; background:var(--accent); color:#04211b; font-weight:600; font-size:15px; cursor:pointer; }
  .login-card button:disabled{ opacity:.6; }
  .error{ color:var(--danger); font-size:13px; margin:0; text-align:center; }

  #chat-screen{ flex-direction:column; }
  .chat-header{ flex:none; padding:14px 16px; padding-top:max(14px, env(safe-area-inset-top)); background:var(--panel); font-weight:600; }
  .message-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg{ max-width:78%; padding:8px 12px; border-radius:14px; background:var(--bubble-other); align-self:flex-start; word-wrap:break-word; overflow-wrap:anywhere; white-space:pre-wrap; }
  .msg.mine{ background:var(--bubble-me); align-self:flex-end; }
  .msg .nickname{ display:block; font-size:11px; color:var(--accent); margin-bottom:2px; }
  .msg .time{ display:block; font-size:10px; color:var(--muted); margin-top:4px; text-align:right; }
  .msg img{ max-width:100%; border-radius:10px; display:block; }
  .message-form{ flex:none; display:flex; align-items:center; gap:8px; padding:10px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:var(--panel); }
  .icon-btn{ flex:none; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#202c33; border:none; font-size:18px; cursor:pointer; }
  #text-input{ flex:1; padding:10px 14px; border-radius:20px; border:none; background:#202c33; color:var(--text); font-size:16px; min-width:0; }
  .send-btn{ flex:none; padding:10px 16px; border-radius:20px; border:none; background:var(--accent); color:#04211b; font-weight:600; cursor:pointer; }
  @media (min-width:640px){ #chat-screen{ max-width:480px; margin:0 auto; border-left:1px solid #202c33; border-right:1px solid #202c33; } }
</style>
</head>
<body>
<div id="cover" hidden></div>

<div id="login-screen" class="screen">
  <form id="login-form" class="login-card" autocomplete="off">
    <h1>개발예정</h1>
    <p class="hint">비밀번호를 입력하여 입장하는 방식으로 현재 개발중입니다.<br>현재는 접속이 불가능합니다.</p>
    <input id="blank-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="">
    <input id="pass-input" type="password" placeholder="개발비밀번호" autocomplete="off" required>
    <button type="submit" id="login-btn">입장하기</button>
    <p id="login-error" class="error" hidden></p>
  </form>
</div>

<div id="chat-screen" class="screen" hidden>
  <header class="chat-header">개발예정</header>
  <main id="message-list" class="message-list"></main>
  <form id="message-form" class="message-form">
    <button type="button" id="image-btn" class="icon-btn" title="사진 보내기">📷</button>
    <input id="image-input" type="file" accept="image/*" hidden>
    <input id="text-input" type="text" placeholder="메시지 입력..." maxlength="2000" autocomplete="off">
    <button type="submit" class="send-btn">전송</button>
  </form>
</div>

<script>
(function(){
  'use strict';
  // 비밀 채팅방 화면. 서버(buyest.co.kr/toolkit_chat_api.php)가 buyest/buyest1 계정만 받아주고,
  // 3분 넘게 이 화면에서 신호가 없으면 서버가 입장 상태를 끊는다. 끊기면 툴킷 메인으로 돌려보낸다.
  var API = 'https://buyest.co.kr/toolkit_chat_api.php';
  var POLL_MS = 2500;
  var IDLE_LIMIT_MS = 3 * 60 * 1000;
  var TTL_MS = 24 * 60 * 60 * 1000;
  var ALLOWED = ['buyest', 'buyest1'];
  var STRICT_USER = 'buyest';

  var $ = function(id){ return document.getElementById(id); };
  var loginScreen = $('login-screen'), chatScreen = $('chat-screen'), cover = $('cover');
  var loginForm = $('login-form'), loginError = $('login-error'), loginBtn = $('login-btn');
  var passInput = $('pass-input');
  var list = $('message-list'), form = $('message-form'), textInput = $('text-input');
  var imageInput = $('image-input'), imageBtn = $('image-btn');

  var me = '', lastId = 0, pollTimer = null, hiddenAt = 0, polling = false, peerRead = 0;

  // 내가 보낸 메시지 중 상대가 화면에서 본 것에 "읽음" 표시
  function refreshReceipts(){
    [].slice.call(list.querySelectorAll('.msg.mine')).forEach(function(el){
      var t = el.querySelector('.time');
      var isRead = Number(el.dataset.id) <= peerRead;
      var label = (isRead ? '읽음 · ' : '') + fmt(Number(el.dataset.ts));
      if(t && t.textContent !== label) t.textContent = label;
    });
  }

  function getToken(){ try{ return sessionStorage.getItem('chat.token') || ''; }catch(e){ return ''; } }
  function setToken(v){ try{ if(v) sessionStorage.setItem('chat.token', v); else sessionStorage.removeItem('chat.token'); }catch(e){} }
  function toolkitId(){
    try{ var a = JSON.parse(localStorage.getItem('buyest.dash.auth')); return a && a.id ? {id:String(a.id), pass:String(a.pass || '')} : null; }catch(e){ return null; }
  }

  // 툴킷에 알려서 메인 화면으로 보낸다 (이 화면은 아무것도 남기지 않는다)
  function leaveToToolkit(){
    try{ if(window.parent !== window) window.parent.postMessage({type:'chat-logout'}, location.origin); }catch(e){}
  }

  function forceLogout(message){
    var had = !!getToken();
    setToken('');
    if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
    list.textContent = ''; lastId = 0; me = '';
    chatScreen.hidden = true; loginScreen.hidden = false; cover.hidden = true;
    passInput.value = '';
    if(message){ loginError.textContent = message; loginError.hidden = false; }
    if(had) leaveToToolkit();
  }
  var IDLE_MESSAGE = '3분 이상 자리를 비워 로그아웃되었습니다. 비밀번호를 다시 입력하세요.';

  function call(payload){
    return fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, error:'서버 응답 오류'}; }); });
  }

  function fmt(ts){
    var d = new Date(ts);
    return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  }
  function addMessage(m){
    if($('m'+m.id)) return;
    var el = document.createElement('div');
    el.id = 'm' + m.id; el.dataset.id = m.id; el.dataset.ts = m.ts;
    el.className = 'msg' + (m.user === me ? ' mine' : '');
    var n = document.createElement('span'); n.className = 'nickname'; n.textContent = m.nick; el.appendChild(n);
    if(m.type === 'image'){
      var img = document.createElement('img'); img.alt = '사진';
      img.src = API + '?action=image&id=' + m.id + '&token=' + encodeURIComponent(getToken());
      img.onload = function(){ list.scrollTop = list.scrollHeight; };
      el.appendChild(img);
    } else {
      var t = document.createElement('span'); t.textContent = m.text; el.appendChild(t);
    }
    var tm = document.createElement('span'); tm.className = 'time'; tm.textContent = fmt(m.ts); el.appendChild(tm);
    list.appendChild(el);
  }
  function pruneOld(first){
    var cutoff = Date.now() - TTL_MS;
    [].slice.call(list.children).forEach(function(el){
      if((first && Number(el.dataset.id) < first) || Number(el.dataset.ts) < cutoff) el.remove();
    });
  }

  function poll(){
    if(polling || !getToken() || document.hidden) return schedule();
    polling = true;
    var viewing = !document.hidden && cover.hidden && !chatScreen.hidden;
    call({action:'poll', token:getToken(), after:lastId, seen: viewing ? lastId : 0}).then(function(r){
      polling = false;
      if(r && r.expired){ return forceLogout(IDLE_MESSAGE); }
      if(r && r.ok){
        peerRead = r.peerRead || 0;
        var stick = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
        r.msgs.forEach(function(m){ addMessage(m); lastId = Math.max(lastId, m.id); });
        pruneOld(r.first);
        refreshReceipts();
        if(r.msgs.length && (stick || lastId === r.msgs[r.msgs.length-1].id && list.children.length === r.msgs.length)) list.scrollTop = list.scrollHeight;
      }
      schedule();
    }).catch(function(){ polling = false; schedule(); });
  }
  function schedule(){
    if(pollTimer) clearTimeout(pollTimer);
    if(getToken()) pollTimer = setTimeout(poll, POLL_MS);
  }

  function enter(user){
    me = user;
    loginScreen.hidden = true; chatScreen.hidden = false;
    lastId = 0; list.textContent = '';
    poll();
  }

  // 입장

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    loginError.hidden = true; loginBtn.disabled = true;
    // 툴킷에 buyest/buyest1로 로그인되어 있어야 하고(서버가 다시 확인), 방 비밀번호를 직접 입력해야 한다
    var tk = toolkitId();
    if(!tk || ALLOWED.indexOf(tk.id) === -1){ loginBtn.disabled = false; loginError.textContent = '입장할 수 없습니다.'; loginError.hidden = false; return; }
    call({action:'login', user:tk.id, pass:tk.pass, room:passInput.value, nick:$('blank-input').value}).then(function(r){
      loginBtn.disabled = false;
      if(!r || !r.ok){ loginError.textContent = (r && r.error) || '입장에 실패했습니다.'; loginError.hidden = false; passInput.value = ''; return; }
      setToken(r.token); passInput.value = '';
      enter(r.user);
    }).catch(function(){ loginBtn.disabled = false; loginError.textContent = '서버에 연결할 수 없습니다.'; loginError.hidden = false; });
  });

  // 이전에 입장한 기록이 남아 있는데 서버가 이미 끊었다면 → 로그인 화면을 보여주지 않고 메인으로
  if(getToken()){
    cover.hidden = false;
    call({action:'poll', token:getToken(), after:0}).then(function(r){
      if(r && r.ok){ cover.hidden = true; enter(r.me); } else { forceLogout(IDLE_MESSAGE); }
    }).catch(function(){ forceLogout(IDLE_MESSAGE); });
  }

  // 메시지/사진 보내기
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var t = textInput.value.trim();
    if(!t) return;
    textInput.value = '';
    call({action:'send', token:getToken(), text:t}).then(function(r){
      if(r && r.expired) return forceLogout(IDLE_MESSAGE);
      if(r && !r.ok) alert(r.error || '전송에 실패했습니다.');
      poll();
    }).catch(function(){ alert('전송 중 오류가 발생했습니다.'); });
  });
  imageBtn.addEventListener('click', function(){ imageInput.click(); });
  imageInput.addEventListener('change', function(){
    var f = imageInput.files[0];
    if(!f) return;
    var fd = new FormData();
    fd.append('action', 'upload'); fd.append('token', getToken()); fd.append('image', f);
    fetch(API, {method:'POST', body:fd}).then(function(r){ return r.json().catch(function(){ return {ok:false, error:'서버 응답 오류'}; }); })
      .then(function(r){
        if(r && r.expired) return forceLogout(IDLE_MESSAGE);
        if(!r || !r.ok) alert((r && r.error) || '업로드에 실패했습니다.');
        poll();
      }).catch(function(err){ alert('업로드 중 오류가 발생했습니다: ' + err.message); })
      .then(function(){ imageInput.value = ''; });
  });

  // 폰 잠금/앱 전환 시 즉시 가리고, 3분 넘게 지나 돌아오면 로그아웃(→ 툴킷 메인)
  // buyest 계정만: 이 화면을 벗어나는 순간 무조건 로그아웃(유예 없음) → 툴킷 메인으로. 서버도 20초 넘게 신호가 없으면 끊는다.
  function strictLogout(){
    var tok = getToken();
    if(tok){ try{ fetch(API, {method:'POST', keepalive:true, headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'logout', token:tok})}); }catch(e){} }
    forceLogout('');
  }
  function hideNow(){
    if(chatScreen.hidden) return;
    if(me === STRICT_USER) return strictLogout();
    if(!hiddenAt) hiddenAt = Date.now(); cover.hidden = false;
  }
  function backNow(){
    if(chatScreen.hidden){ cover.hidden = true; hiddenAt = 0; return; }
    if(me === STRICT_USER) return strictLogout();
    var away = hiddenAt ? Date.now() - hiddenAt : 0; hiddenAt = 0;
    if(away >= IDLE_LIMIT_MS){ return forceLogout(IDLE_MESSAGE); }
    call({action:'poll', token:getToken(), after:lastId}).then(function(r){
      if(!r || !r.ok) return forceLogout(IDLE_MESSAGE);
      cover.hidden = true; poll();
    }).catch(function(){ forceLogout(IDLE_MESSAGE); });
  }
  document.addEventListener('visibilitychange', function(){ if(document.hidden) hideNow(); else backNow(); });
  window.addEventListener('pagehide', hideNow);
  window.addEventListener('pageshow', function(e){ if(e.persisted) backNow(); });
})();
</script>
</body>
</html>

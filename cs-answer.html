<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>문의 답변 도우미</title>
<style>
  @import url("assets/fonts/pretendard/pretendard.css");
  :root{--bg:#f6f6f4;--card:#fff;--ink:#15171a;--sub:#6a6f76;--line:#e4e4e0;--pri:#15171a;--ok:#0f766e;--okbg:#ecf8f5;--warn:#a15c07;--warnbg:#fdf3e0;--bad:#b42318;--badbg:#fdeceb;--blue:#1d4ed8;--bluebg:#eef3ff;--font:"Pretendard Variable","Pretendard",-apple-system,"Malgun Gothic",sans-serif;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);margin:0;font-size:14px;overflow:hidden;}
  button{font-family:inherit;}
  [hidden]{display:none !important;}
  .btn{font:600 13px var(--font);padding:9px 14px;border:1px solid transparent;border-radius:8px;cursor:pointer;}
  .btn-pri{background:var(--pri);color:#fff;} .btn-out{background:#fff;color:var(--ink);border-color:var(--line);} .btn-out:hover{border-color:#bfc3c8;}
  .btn-ai{background:var(--bluebg);border-color:#c9d6fb;color:var(--blue);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.sm{font-size:12px;padding:6px 10px;}
  .btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  input[type=text],input[type=search],textarea,select{font:14px var(--font);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  textarea{width:100%;min-height:96px;resize:vertical;line-height:1.6;}
  .hint{font-size:12px;color:var(--sub);line-height:1.55;}

  /* 전체 틀: 위 줄 + 3칸(목록 | 대화 | 정보) */
  .app{height:100vh;display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);}
  .top h1{font-size:16px;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  .top h1 .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--warnbg);color:var(--warn);}
  .modes{display:flex;gap:2px;background:#eeeeea;border-radius:10px;padding:3px;}
  .mode{font:700 13px var(--font);padding:7px 14px;border:0;border-radius:8px;background:none;color:var(--sub);cursor:pointer;display:inline-flex;gap:7px;align-items:center;}
  .mode.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--badbg);color:var(--bad);} .pill:empty{display:none;}
  .status{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-left:auto;font-size:12px;color:var(--sub);}
  .status .warn,.asof.warn,.learn.off{color:var(--warn);font-weight:600;}
  .status .okc{color:var(--ok);font-weight:600;}
  .cols{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr) 320px;}
  .col{min-height:0;overflow:auto;}
  .list{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .center{background:var(--bg);display:flex;flex-direction:column;}
  .info{background:#fff;border-left:1px solid var(--line);padding:6px 0;}

  /* 목록 */
  .lhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
  .chip{flex:none;font:600 12.5px var(--font);padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;}
  .chip b{font-weight:700;color:var(--sub);} .chip.on{background:var(--pri);border-color:var(--pri);color:#fff;} .chip.on b{color:#cfd3d8;}
  .lrow2{display:flex;gap:6px;align-items:center;margin-top:6px;} .lrow2 input[type=search]{flex:1;min-width:0;padding:7px 10px;font-size:13px;} .lrow2 select{max-width:120px;padding:7px 8px;font-size:12.5px;}
  .lrow3{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--sub);}
  .lrow3 label{display:inline-flex;gap:5px;align-items:center;cursor:pointer;}
  .prog{height:3px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden;} .prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s;}
  .row{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #efefeb;border-left:4px solid transparent;padding:11px 12px 11px 10px;cursor:pointer;color:var(--ink);}
  .row:hover{background:#fafaf8;} .row.on{background:var(--bluebg);}
  .row.k-auto,.row.s-replied{border-left-color:var(--ok);} .row.k-check{border-left-color:#d49a22;} .row.k-manual{border-left-color:var(--blue);} .row.k-platform,.row.s-done{border-left-color:#c8cbd0;} .row.s-wait{border-left-color:var(--bad);}
  .row.done{opacity:.5;}
  .r1{display:flex;gap:8px;align-items:baseline;justify-content:space-between;} .r1 b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .r1 time{flex:none;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .r2{font-size:13px;line-height:1.5;margin-top:3px;color:#3a3d42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
  .r3{font-size:11.5px;color:var(--sub);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty{text-align:center;color:var(--sub);padding:34px 18px;line-height:1.7;}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .t-auto{background:var(--okbg);color:var(--ok);} .t-check{background:var(--warnbg);color:var(--warn);} .t-manual{background:var(--bluebg);color:var(--blue);} .t-platform{background:#eceeef;color:#555b61;}

  /* 대화 */
  .chead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);}
  .chead .ttl{flex:1;min-width:180px;line-height:1.45;word-break:break-all;} .chead .ttl b{font-size:14px;} .chead .ttl div{font-size:12px;color:var(--sub);margin-top:1px;} .chead a{color:var(--blue);}
  .back{display:none;}
  .no{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#fff;color:var(--ink);font:600 12px var(--font);font-variant-numeric:tabular-nums;}
  .msgs{flex:1;min-height:120px;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
  .bub{max-width:78%;padding:9px 13px;border-radius:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;font-size:14px;}
  .bub small{display:block;font-size:11px;margin-top:3px;opacity:.65;}
  .bub.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
  .bub.out{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px;} .bub.out.partner{background:#4b5563;}
  .comp{background:#fff;border-top:1px solid var(--line);padding:12px 18px 14px;}
  .also,.nq{background:var(--warnbg);color:var(--warn);font-size:12.5px;font-weight:600;border-radius:8px;padding:6px 10px;margin-bottom:8px;}
  .note{font-size:12.5px;color:var(--sub);margin:0 0 8px;line-height:1.55;} .ainote{color:var(--blue);font-weight:600;} .ainote:empty{display:none;} .ainote.warn{color:var(--warn);}
  .slot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;} .slot label{font-size:12.5px;font-weight:600;} .slot input[type=text]{flex:1;min-width:200px;}
  .snip{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;}
  .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .act .sp{margin-left:auto;}
  .cnt{font-size:12px;color:var(--sub);} .cnt.over{color:var(--bad);font-weight:700;}
  .kbd{font-size:11px;color:var(--sub);}

  /* 정보 패널 */
  .sec{border-bottom:1px solid #efefeb;padding:4px 16px;} .sec summary{cursor:pointer;font-weight:700;font-size:12.5px;padding:9px 0;list-style:none;display:flex;justify-content:space-between;color:var(--ink);} .sec summary::-webkit-details-marker{display:none;} .sec summary::after{content:"▾";color:var(--sub);} .sec:not([open]) summary::after{content:"▸";}
  .sec .body{padding:0 0 12px;font-size:13px;line-height:1.6;word-break:break-word;}
  .kv{display:flex;gap:8px;justify-content:space-between;padding:2px 0;} .kv span:first-child{color:var(--sub);flex:none;} .kv span:last-child{text-align:right;}
  .stk{display:flex;gap:6px;flex-wrap:wrap;}
  .sz{border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:#fff;font-variant-numeric:tabular-nums;font-size:12.5px;}
  .sz.z{color:#9aa0a6;background:#f4f4f1;text-decoration:line-through;} .sz.hit{border-color:var(--blue);background:var(--bluebg);color:var(--blue);font-weight:700;text-decoration:none;}
  .sz.pick{cursor:pointer;} .sz.pick:hover{border-color:var(--ink);}
  .it{background:#f4f4f1;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.6;} .it b{color:var(--sub);font-weight:600;} .it .btn{margin-top:4px;}
  .meas{background:#f4f4f1;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.6;}
  .dz{border:2px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center;background:#fff;transition:.15s;max-width:560px;margin:34px auto 0;} .dz.over{border-color:#111;background:#f3f3f3;}
  .msg{font-size:13px;margin-top:8px;line-height:1.6;} .msg.err{color:var(--bad);font-weight:600;} .msg.ok{color:var(--ok);font-weight:600;}
  .fmsg{font-size:12px;margin-top:6px;} .fmsg.err{color:var(--bad);font-weight:600;} .fmsg.ok{color:var(--ok);font-weight:600;}

  /* 진행 중 상담 탭줄 (톡easy 화면 ①) */
  .strip{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:#eef0fb;border-bottom:1px solid var(--line);scrollbar-width:thin;}
  .stab{flex:none;min-width:150px;max-width:210px;text-align:left;background:#fff;border:1px solid #d9dcef;border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--ink);}
  .stab.hot{border-color:#e08a82;background:#fff6f5;} .stab.on{box-shadow:0 0 0 2px var(--blue);}
  .stab b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .stab span{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .own{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bluebg);color:var(--blue);} .own.other{background:var(--warnbg);color:var(--warn);}
  .st-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eceeef;color:#555b61;} .st-badge.wait{background:var(--badbg);color:var(--bad);} .st-badge.hold{background:var(--warnbg);color:var(--warn);} .st-badge.replied{background:var(--okbg);color:var(--ok);}
  .lock{background:var(--warnbg);color:var(--warn);font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .actr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;} .actr .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .memo{min-height:70px;font-size:13px;} .pastq{border-bottom:1px solid #efefeb;padding:6px 0;font-size:12.5px;line-height:1.5;} .pastq time{display:block;font-size:11.5px;color:var(--sub);}
  .faqrow{display:flex;gap:6px;margin-bottom:6px;} .faqrow select,.faqrow input{flex:1;min-width:0;padding:7px 9px;font-size:12.5px;}
  /* 이미지 템플릿 */
  .bub img{display:block;max-width:240px;max-height:280px;border-radius:8px;background:#fff;}
  .imgpanel{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#fafaf8;}
  .imgpanel .ph{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;font-weight:700;} .imgpanel .ph .sp{margin-left:auto;}
  .tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-height:260px;overflow:auto;}
  .tpl{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;position:relative;}
  .tpl img{width:100%;height:84px;object-fit:contain;background:#f4f4f1;border-radius:6px;}
  .tpl b{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tpl .x{position:absolute;top:3px;right:3px;width:22px;height:22px;padding:0;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-size:12px;line-height:1;}
  /* 좁은 화면: 목록 → 대화(+정보) 한 칸씩 */
  @media (max-width:1180px){
    .cols{display:block;position:relative;}
    .cols > .col{height:100%;}
    .cols[data-view="list"] .center,.cols[data-view="list"] .info{display:none;}
    .cols[data-view="detail"] .list{display:none;}
    .cols[data-view="detail"]{overflow:auto;}
    .cols[data-view="detail"] .center{height:auto;min-height:70%;overflow:visible;} .cols[data-view="detail"] .msgs{max-height:42vh;}
    .cols[data-view="detail"] .info{border-left:0;border-top:1px solid var(--line);height:auto;overflow:visible;}
    .back{display:inline-flex;} .list{border-right:0;} .bub{max-width:92%;}
    .status{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>문의 답변 도우미 <span class="badge">TEST</span></h1>
    <div class="modes" role="tablist">
      <button class="mode" type="button" id="modeBtnTt" role="tab" data-mode="tt">네이버 톡톡 실시간 <span class="pill" id="ttPill"></span></button>
      <button class="mode" type="button" id="modeBtnXls" role="tab" data-mode="xls">사방넷 문의 엑셀 <span class="pill" id="xlsPill"></span></button>
    </div>
    <div class="status"><span id="connMsg"></span><span class="asof" id="stockMsg"></span><span class="learn" id="learnMsg"></span></div>
  </header>
  <div class="strip" id="strip" hidden></div>
  <div class="cols" id="cols" data-view="list">
    <aside class="col list" id="colList">
      <div class="lhead">
        <div class="chips" id="chips"></div>
        <div class="lrow2"><input type="search" id="search" placeholder="문의·상품 검색" aria-label="문의 검색"><select id="shopSel" aria-label="쇼핑몰"><option value="">쇼핑몰 전체</option></select></div>
        <div class="lrow3" id="xlsTools">
          <span id="fileBox"><button class="btn btn-out sm" type="button" id="pick">엑셀 올리기</button><input type="file" id="file" accept=".xlsx,.xls" hidden></span>
          <button class="btn btn-ai sm" id="aiAll" type="button">✨ 이 목록 AI 초안</button><button class="btn btn-out sm" id="aiStop" type="button" hidden>멈추기</button>
          <label><input type="checkbox" id="showAns"> 답변된 문의도</label>
          <span id="aiProg"></span>
        </div>
        <div class="prog"><i id="progBar"></i></div>
        <div class="hint" id="progTxt" style="margin-top:5px"></div>
        <div class="fmsg" id="fileMsg"></div>
      </div>
      <div id="list"></div>
    </aside>
    <main class="col center" id="center"></main>
    <aside class="col info" id="info"></aside>
  </div>
</div>

<script src="assets/libs/xlsx.full-0.20.2.min.js"></script>
<script src="assets/ec-cache.js"></script>
<script src="cs-knowledge.js"></script>
<script src="cs-answer-logic.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LS = { get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const DONE = LS.get('cs.done', {});            // 문의순번 → 1 (복사 완료)
const USERMEAS = LS.get('cs.meas', {});        // 상품코드 → 실측값 (이 PC)
let SERVERMEAS = {};
const measOf = k => USERMEAS[k] || SERVERMEAS[k] || (window.CS_MEAS || {})[k] || '';
const KIND = { auto: '자동 초안', check: '확인 후 복사', manual: '직접 작성', platform: '플랫폼 알림' };
const cssq = s => String(s).replace(/"/g, '\\"');
const fit = ta => { if(!ta) return; ta.style.height = 'auto'; ta.style.height = Math.max(96, ta.scrollHeight + 2) + 'px'; };
const tm = s => (s || '').slice(5, 16).replace('-', '/');
const NARROW = () => window.matchMedia('(max-width:1180px)').matches;

let CARDS = [], FILTER = 'todo', SHOWN = 80, STOCKFN = null, FILENAME = '';
let MODE = LS.get('cs.mode', 'xls'); if(MODE !== 'tt' && MODE !== 'xls') MODE = 'xls';
const SEL = { xls: null, tt: null };
const TT = { state: 'wait', threads: [], strip: [], me: '', lock: '', counts: { wait: 0, hold: 0, mine: 0, replied: 0, done: 0 }, data: null, x: {}, timer: null, cfg: null, sending: false, ready: false, err: '' };
let SHOWN_KEY = '';   // 가운데 칸에 지금 그려진 대화 (MODE:key)

/* ---------- 인증 · 개인정보 가리기 · 학습 저장소 ---------- */
function authInfo(){ try{ const a = JSON.parse(localStorage.getItem('buyest.dash.auth') || 'null'); return (a && a.id && a.pass) ? a : null; }catch(e){ return null; } }
function maskPii(s){
  return String(s || '').replace(/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/g, '{전화}').replace(/(?:ORD)?\d{12,}/gi, '{번호}')
    .replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g, '{이메일}').replace(/(회원명|성함|이름|고객명)\s*[:：]?\s*[가-힣A-Za-z]{2,6}/g, '$1: {이름}');
}
const LEARN = 'https://buyest.co.kr/cs_learn_api.php';
let LEARN_ON = false;
async function lapi(action, payload, timeout){
  const a = authInfo(); if(!a) throw new Error('로그인이 필요해요');
  const r = await fetch(LEARN, { method: 'POST', signal: AbortSignal.timeout(timeout || 8000), headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action, user: a.id, pass: a.pass }, payload || {})) });
  const d = await r.json();
  if(!d.ok) throw new Error(d.error || '저장소 오류');
  return d;
}
function learnMsg(t, off){ const el = $('learnMsg'); el.className = 'learn' + (off ? ' off' : ''); el.textContent = t; }
async function initLearn(){
  LEARN_ON = false;
  if(!authInfo()){ learnMsg('학습 저장소 꺼짐 — 툴킷에 로그인하세요', true); return; }
  try{
    const res = await Promise.all([lapi('meas_all', {}, 6000), lapi('stats', {}, 6000)]);
    const m = res[0], st = res[1];
    SERVERMEAS = m.meas || {}; LEARN_ON = true;
    learnMsg('학습 저장소 연결됨 · 확정 답변 ' + st.copy + '건 · 사방넷 답변 ' + st.sabang + '건 · 실측 ' + st.meas + '개');
    $('learnMsg').title = 'AI 초안 ' + st.ai + ' · 직접 고침 ' + st.edited;
    flushPending();
  }catch(e){ learnMsg('학습 저장소에 연결하지 못했어요 (' + e.message + ')', true); }
}
function pendingGet(){ return LS.get('cs.pending', []); }
function pendingAdd(items){ LS.set('cs.pending', pendingGet().concat(items).slice(-300)); }
async function flushPending(){
  const p = pendingGet(); if(!p.length || !LEARN_ON) return;
  try{ for(let i = 0; i < p.length; i += 50) await lapi('save', { items: p.slice(i, i + 50) }); LS.set('cs.pending', []); }catch(_){}
}
function questionOf(x){ return (x.r.q && x.r.q !== 'null') ? x.r.q : CSAnswer.cleanTitle(x.r.title); }
function itemOf(x, finalText, src){

/* ---------- 문의 엑셀 ---------- */
function fmsg(t, c){ const m = $('fileMsg'); m.className = 'fmsg ' + (c || ''); m.textContent = t; }
$('pick').onclick = () => $('file').click();
$('file').onchange = e => { if(e.target.files[0]) loadXlsx(e.target.files[0]); e.target.value = ''; };
async function loadXlsx(f){
  FILENAME = f.name; fmsg('파일을 읽는 중…');
  try{
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
    const rows = CSAnswer.rowsFromAoa(aoa);
    if(!rows) return fmsg('"문의내용" 열을 찾지 못했어요. 스케줄러가 받은 문의사항답변 엑셀이 맞는지 확인해 주세요.', 'err');
    if(!rows.length) return fmsg('문의가 한 건도 없어요.', 'err');
    await loadStock();
    await initLearn();
    buildCards(rows);
    offerSabang();
    fmsg(`문의 ${rows.length.toLocaleString()}건을 읽었어요.`, 'ok');
  }catch(e){ fmsg('엑셀을 읽지 못했어요: ' + e.message, 'err'); }
}
function buildCards(rows){
  CARDS = rows.map(r => {
    const c = CSAnswer.classify(r, { stock: STOCKFN, meas: measOf });
    const slotVal = c.slot ? (c.slot.value || '') : '';
    const k = r.no || ('r' + r.idx);
    const t0 = CSAnswer.applySlot(c, slotVal);
    return { r, c, key: k, slotVal, text: t0, machine: t0, aiUsed: false, edited: false, answered: !!(r.a && r.a.trim()) };
  });
  const shops = [...new Set(CARDS.map(x => x.r.shop).filter(Boolean))].sort();
  $('shopSel').innerHTML = '<option value="">쇼핑몰 전체</option>' + shops.map(s => `<option>${esc(s)}</option>`).join('');
  FILTER = 'todo'; SHOWN = 80; SEL.xls = null;
  $('showAns').checked = CARDS.filter(x => !x.answered).length === 0;   // 이미 답변된 것만 있는 파일이면 연습 모드
  setMode('xls');
}
function byKey(k){ return MODE === 'xls' ? CARDS.find(x => x.key === k) : TT.x[k]; }
function curX(){ return SEL[MODE] ? byKey(SEL[MODE]) : null; }
function xlsVisible(){
  const q = $('search').value.trim().toLowerCase(), shop = $('shopSel').value, showAns = $('showAns').checked;
  return CARDS.filter(x => {
    if(!showAns && x.answered) return false;
    if(shop && x.r.shop !== shop) return false;
    if(q && !(x.r.q + ' ' + x.r.prod + ' ' + x.r.shop + ' ' + x.r.title).toLowerCase().includes(q)) return false;
    return true;
  });
}
function xlsFiltered(base){ return base.filter(x => FILTER === 'done' ? DONE[x.key] : (!DONE[x.key] && (FILTER === 'todo' || x.c.kind === FILTER))); }
function offerSabang(){
  const list = CARDS.filter(x => x.answered && x.r.no && x.c.kind !== 'platform' && (x.r.a || '').trim().length >= 3);
  if(!list.length || !LEARN_ON) return;
  $('learnMsg').insertAdjacentHTML('beforeend', ' <button class="btn btn-out sm" id="sbSave" type="button">사방넷 답변 ' + list.length + '건 학습 저장</button><span id="sbProg"></span>');
  $('sbSave').onclick = async () => {
    const items = list.map(x => itemOf(x, x.r.a, 'sabang'));
    $('sbSave').disabled = true; let ok = 0;
    try{
      for(let i = 0; i < items.length; i += 50){ const d = await lapi('save', { items: items.slice(i, i + 50) }, 20000); ok += d.saved; $('sbProg').textContent = ' ' + Math.min(i + 50, items.length) + ' / ' + items.length; }
      $('sbProg').textContent = ' 저장 완료 (' + ok + '건)';
    }catch(e){ $('sbProg').textContent = ' 멈췄어요: ' + e.message; $('sbSave').disabled = false; }
  };
}

/* ---------- 톡톡 ---------- */
const TTAPI = 'https://buyest.co.kr/tt_api.php';
async function tapi(action, payload, timeout){
  const a = authInfo(); if(!a) throw new Error('툴킷에 로그인한 뒤 쓸 수 있어요. 로그인 후 새로고침해 주세요.');
  const r = await fetch(TTAPI, { method: 'POST', signal: AbortSignal.timeout(timeout || 10000), headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action, user: a.id, pass: a.pass }, payload || {})) });
  const d = await r.json().catch(() => ({}));
  if(!d.ok){ const er = new Error(d.error || ('서버 응답 ' + r.status)); er.data = d; throw er; }
  return d;
}
const ttWho = k => '고객 …' + String(k).slice(-4);
const TT_STATE = { wait: '답변 필요', hold: '보류', replied: '답변함', done: '완료' };
const FAQ_TYPES = [['', '전체 유형'], ['auth', '정품 문의'], ['restock', '재입고'], ['pack', '선물포장·쇼핑백'], ['as', 'A/S·수선'], ['price', '가격·할인'], ['ret', '반품·교환·취소'], ['stock', '재고 확인'], ['sameday', '당일 발송'], ['ship', '배송·출고'], ['meas', '실측 치수'], ['sizerec', '사이즈 추천'], ['mat', '소재·디테일']];
function ttTail(msgs){ const ins = []; for(let i = msgs.length - 1; i >= 0; i--){ if(msgs[i].dir === 'in') ins.unshift(msgs[i]); else break; } return ins; }
function ttMakeX(key, d){
  const tail = ttTail(d.messages), q = tail.filter(m => m.kind === 'text').map(m => m.text).join('\n');
  const r = { no: 'tt' + (tail.length ? tail[tail.length - 1].id : 0), idx: 0, shop: '네이버톡톡', prod: (d.product && d.product.name) || '', q, title: '', a: '', ans: '', date: '' };
  let c;
  try{ c = CSAnswer.classify(r, { stock: STOCKFN, meas: measOf }); }
  catch(_){ c = { kind: 'manual', intent: 'etc', label: '기타', slot: null, buttons: [], stock: null, note: '', build: function(){ return ''; } }; }
  const slotVal = c.slot ? (c.slot.value || '') : '';
  const t0 = q && c.kind !== 'platform' ? CSAnswer.applySlot(c, slotVal) : '';
  return { r, c, key, slotVal, text: t0, machine: t0, aiUsed: false, edited: false, tailLen: tail.length, hasQ: !!q };
}
async function ttRefresh(){
  try{
    const st = await tapi('status');
    TT.cfg = st; TT.counts = st.counts; TT.err = ''; TT.me = st.me || TT.me;
    $('ttPill').textContent = st.counts.wait ? String(st.counts.wait) : '';
    if(st.configured){
      const d = await tapi('threads', { state: TT.state, limit: 60 });
      TT.threads = d.items; TT.ready = true;
      TT.strip = TT.state === 'wait' ? d.items : (await tapi('threads', { state: 'wait', limit: 20 })).items;
      $('connMsg').className = 'okc'; $('connMsg').textContent = '톡톡 연결됨 · 마지막 수신 ' + (st.last_event ? tm(st.last_event) : '아직 없음') + (st.handover ? '' : ' · 파트너센터 대기목록 연동 꺼짐');
    } else { TT.ready = false; $('connMsg').className = 'warn'; $('connMsg').textContent = '톡톡 연결 전'; }
  }catch(e){ TT.err = e.message; $('connMsg').className = 'warn'; $('connMsg').textContent = '톡톡 문의를 불러오지 못했어요: ' + e.message; }
  if(MODE !== 'tt') return;
  renderList(); renderStrip();
  if(SEL.tt && TT.ready) await ttOpen(SEL.tt, true); else if(!SEL.tt) renderCenter();
}
async function ttOpen(key, quiet){
  let d;
  try{ d = await tapi('thread', { user_key: key, limit: 80 }); }
  catch(e){ if(!quiet){ $('center').innerHTML = `<div class="empty"><b>대화를 불러오지 못했어요</b><br>${esc(e.message)}</div>`; } return; }
  if(SEL.tt !== key && quiet) return;   // 그 사이 다른 대화로 옮겼다면 버린다
  SEL.tt = key; TT.data = d;
  if(d.owner && d.owner !== TT.me){ TT.lock = d.owner; }
  else { try{ await tapi('claim', { user_key: key }); TT.lock = ''; d.owner = TT.me; }catch(e){ TT.lock = (e.data && e.data.owner) || '다른 직원'; } }
  let x = TT.x[key];
  const nx = ttMakeX(key, d);
  if(!x || (!x.edited && x.tailLen !== nx.tailLen && !x.aiUsed)){ TT.x[key] = x = nx; }
  else if(x.tailLen !== nx.tailLen){ x.tailLen = nx.tailLen; x.r = nx.r; x.c = nx.c; x.hasQ = nx.hasQ; x.newQ = true; }
  if(SHOWN_KEY === 'tt:' + key && $('msgs')){
    const box = $('msgs'), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.innerHTML = msgsHtml(); if(atBottom) box.scrollTop = box.scrollHeight;
    const ta = $('draft'); if(ta && !x.edited && !x.aiUsed && ta.value !== x.text){ ta.value = x.text; fit(ta); }
    const nq = $('nq'); if(nq) nq.hidden = !x.newQ;
    ttApplyLock();
  } else { renderCenter(); renderInfo(); }
  renderList(); renderStrip();
}
function ttApplyLock(){
  const bar = $('lockbar'), sh = document.querySelector('[data-act="send"]');
  if(bar){ bar.hidden = !TT.lock; const sp = bar.querySelector('span'); if(sp) sp.textContent = TT.lock ? TT.lock + '님이 맡아 답하는 중이에요 (10분 안에 갱신됨). 같이 답하면 고객에게 두 번 나가요.' : ''; }
  if(sh) sh.disabled = !!TT.lock || TT.sending;
  const ip = $('imgPanel'); if(ip && !ip.hidden && TT.tpls) tplRender();
}
function renderStrip(){
  const el = $('strip');
  if(MODE !== 'tt' || !TT.ready || !TT.strip.length){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = TT.strip.map(t => `<button class="stab hot${t.user_key === SEL.tt ? ' on' : ''}" type="button" data-open="${esc(t.user_key)}"><b>${esc(t.product || ttWho(t.user_key))}</b><span>${t.owner ? esc(t.owner) + ' 담당 · ' : ''}${esc(t.last_q)}</span></button>`).join('');
}

function setMode(m){

  $('modeBtnTt').classList.toggle('on', m === 'tt'); $('modeBtnXls').classList.toggle('on', m === 'xls');
  $('modeBtnTt').setAttribute('aria-selected', String(m === 'tt')); $('modeBtnXls').setAttribute('aria-selected', String(m === 'xls'));
  $('xlsTools').hidden = m !== 'xls'; $('shopSel').hidden = m !== 'xls'; $('fileMsg').hidden = m !== 'xls';
  $('cols').dataset.view = 'list'; SHOWN_KEY = '';

  if(m === 'tt'){
    (async () => {
      if(!STOCKFN) await loadStock();
      if(!LEARN_ON) await initLearn();
      await ttRefresh();

    TT.timer = setInterval(() => { if(document.visibilityState === 'visible' && MODE === 'tt') ttRefresh(); }, 20000);

async function tplUpload(file){

const WK = 'https://buyest-namegen.buyest.workers.dev';
function factsOf(x){
  const f = [], c = x.c;
  if(c.stock && c.stock.found){
    f.push('이카운트 재고(사이즈 수량): ' + c.stock.sizes.map(s => s.spec + ' ' + s.qty).join(', '));
    const hit = CSAnswer.specsMentioned(x.r.q + ' ' + CSAnswer.cleanTitle(x.r.title), c.stock.sizes);
    if(hit.length) f.push('문의에 나온 사이즈: ' + hit.map(s => s.spec).join(', '));
  } else if(c.intent === 'stock'){ f.push('이 상품의 재고를 찾지 못함'); }
  const sv = (x.slotVal || '').trim();
  if(sv && c.slot){ if(c.slot.tpl === 'meas' || c.slot.tpl === 'kids') f.push('실측값: ' + sv); else if(c.slot.tpl === 'rec') f.push('직원이 고른 추천 사이즈: ' + sv); }
  return f.join('\n');
}
function aiUi(x){

async function askAI(x, tt){
  if(x.aiBusy || x.c.kind === 'platform') return;
  const a = authInfo();
  if(!a){ x.aiNote = '툴킷에 로그인한 뒤 쓸 수 있어요. 로그인 후 새로고침해 주세요.'; x.aiWarn = true; return aiUi(x); }
  x.aiBusy = true; aiUi(x);
  try{
    let q = questionOf(x);
    if(tt && TT.data){
      // 워커가 문의를 900자에서 자르므로, 오래된 말부터 버리고 최신 대화가 남게 채운다
      const head = '(네이버 톡톡 실시간 채팅 — 짧고 친절하게)\n', lines = [];
      let used = head.length;
      const all = TT.data.messages.filter(m => m.kind === 'text').map(m => (m.dir === 'in' ? '고객: ' : '직원: ') + maskPii(m.text).slice(0, 300));
      for(let i = all.length - 1; i >= 0 && lines.length < 10; i--){ if(used + all[i].length + 1 > 860 && lines.length) break; lines.unshift(all[i]); used += all[i].length + 1; }
      q = head + lines.join('\n');
    }
    let examples = [];
    if(LEARN_ON){ try{ const sm = await lapi('similar', { q: maskPii(questionOf(x)), intent: x.c.intent, prod_key: x.c.measKey || CSAnswer.measKey(x.r.prod), k: 4 }, 5000); examples = (sm.items || []).map(e => ({ q: e.q, a: e.a })); }catch(_){} }
    const r = await fetch(WK + '/api/cs', { method: 'POST', signal: AbortSignal.timeout(60000),
      headers: { 'Content-Type': 'application/json', 'X-Studio-User': encodeURIComponent(a.id), 'X-Studio-Pass': encodeURIComponent(a.pass), 'X-Studio-Enc': '1' },
      body: JSON.stringify({ q: maskPii(q), prod: maskPii(x.r.prod), shop: x.r.shop, label: x.c.label, facts: factsOf(x), draft: maskPii(x.text), examples }) });
    const d = await r.json().catch(() => ({}));
    if(!d.ok) throw new Error(d.error || ('서버 응답 ' + r.status));
    if(d.answer){ x.text = d.answer; x.machine = d.answer; x.aiUsed = true; x.edited = false; }
    x.aiWarn = !!d.needs_staff;
    x.aiNote = d.needs_staff ? '✨ AI가 확신하지 못했어요 — ' + (d.reason || '직접 확인해 주세요') : '✨ AI 초안이에요. 재고·실측 같은 사실이 맞는지 확인하고 ' + (tt ? '보내세요.' : '복사하세요.');
  }catch(e){
    x.aiWarn = true; x.aiNote = 'AI 초안을 만들지 못했어요: ' + (e.name === 'TimeoutError' ? '시간이 너무 오래 걸렸어요. 다시 눌러 주세요.' : e.message);
  }
  x.aiBusy = false;
  if(curX() === x && $('draft')){ $('draft').value = x.text; fit($('draft')); count(); }
  aiUi(x);
}

  SEL[MODE] = key;
  if(MODE === 'tt'){ SHOWN_KEY = ''; await ttOpen(key); } else { renderCenter(); renderInfo(); renderList(); }
  if(NARROW()) $('cols').dataset.view = 'detail';
}
function moveSel(dir){
  const rows = [...document.querySelectorAll('#list [data-open]')]; if(!rows.length) return;
  const i = rows.findIndex(r => r.dataset.open === SEL[MODE]), n = rows[Math.min(rows.length - 1, Math.max(0, (i < 0 ? (dir > 0 ? 0 : rows.length - 1) : i + dir)))];
  openItem(n.dataset.open); n.scrollIntoView({ block: 'nearest' });
}

async function doCopy(x){
  const ta = $('draft'), text = (ta ? ta.value : x.text).trim();
  if(!text) return st('답변이 비어 있어요. 내용을 쓰거나 문구를 눌러 넣어 주세요.', true);
  if(/\{[^}]+\}/.test(text)) return st('{ } 로 된 빈칸이 남아 있어요. 채워 주세요.', true);
  try{ await copyText(text); }catch(_){ return st('복사에 실패했어요. 글상자에서 직접 복사해 주세요.', true); }
  const sv = $('saveMeas');
  if(sv && sv.checked && x.slotVal.trim() && x.c.measKey){ USERMEAS[x.c.measKey] = x.slotVal.trim(); LS.set('cs.meas', USERMEAS); saveMeas(x.c.measKey, x.slotVal.trim()); }
  saveAnswer(x, text); setDone(x, true);
  $('primary').textContent = '복사됨 ✓'; st('사방넷에 붙여넣으세요.', false);
  renderList();
}
async function doSend(x){
  if(TT.sending) return;
  const ta = $('draft'), text = ta.value.trim();
  if(!text) return st('답변이 비어 있어요. 내용을 쓰거나 ✨ AI 초안을 눌러 주세요.', true);
  if(/\{[^}]+\}/.test(text)) return st('{ } 로 된 빈칸이 남아 있어요. 채워 주세요.', true);
  if(text.length > 1500) return st('1,500자 이내로 줄여 주세요.', true);
  if(!confirm('이 내용이 고객에게 바로 전송돼요. 보낼까요?\n\n' + text.slice(0, 300) + (text.length > 300 ? '…' : ''))) return;
  TT.sending = true; $('primary').disabled = true; st('보내는 중…', false);
  try{
    const lastQ = TT.data.messages.filter(m => m.dir === 'in' && m.kind === 'text').slice(-1)[0];
    const res = await tapi('send', { user_key: x.key, text, ai: x.aiUsed ? 1 : 0 }, 20000);
    if(lastQ){ const it = itemOf(x, text, 'copy'); it.no = 'tt' + lastQ.id; try{ if(!LEARN_ON) throw 0; await lapi('save', { items: [it] }); }catch(_){ pendingAdd([it]); } }
    const sv = $('slot'); if(sv && sv.value.trim() && x.c.measKey && x.c.slot && x.c.slot.saveable && $('saveMeas') && $('saveMeas').checked){ USERMEAS[x.c.measKey] = sv.value.trim(); LS.set('cs.meas', USERMEAS); saveMeas(x.c.measKey, sv.value.trim()); }
    delete TT.x[x.key];
    await ttRefresh();
    st(res.push ? '보냈어요 (고객이 채팅창을 나가 있어 알림도 보냈어요)' : '보냈어요', false);
  }catch(e){ st('보내지 못했어요: ' + e.message, true); }
  TT.sending = false; const b = $('primary'); if(b) b.disabled = false;
}

document.addEventListener('click', async e => {
  const chipEl = e.target.closest('[data-chip]');
  if(chipEl){ const x = curX(); if(x){ x.slotVal = chipEl.dataset.chip; const s = $('slot'); if(s) s.value = x.slotVal; if(!x.edited){ x.text = CSAnswer.applySlot(x.c, x.slotVal); x.machine = x.text; setDraft(x, x.text, false); } } return; }
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.mode) return setMode(t.dataset.mode);
  if(t.dataset.filter){ if(MODE === 'tt'){ TT.state = t.dataset.filter; SEL.tt = null; TT.data = null; await ttRefresh(); renderCenter(); renderInfo(); } else { FILTER = t.dataset.filter; SHOWN = 80; renderList(); } return; }
  if(t.dataset.open) return openItem(t.dataset.open);
  const x = curX(), act = t.dataset.act;
  if(t.dataset.ins !== undefined && x){ const b = x.c.buttons[+t.dataset.ins]; setDraft(x, appendBody($('draft').value, b.text), true); return; }
  if(t.dataset.simuse !== undefined && x){ const it = x.sim && x.sim[+t.dataset.simuse]; if(it){ x.aiUsed = false; setDraft(x, it.a, true); } return; }
  if(!act) return;
  if(act === 'more'){ SHOWN += 80; return renderList(); }
  if(act === 'pickfile') return $('file').click();
  if(act === 'back'){ $('cols').dataset.view = 'list'; return; }
  if(act === 'copyno'){ try{ await copyText(t.dataset.no); t.textContent = '복사됨'; setTimeout(() => { t.textContent = '#' + t.dataset.no; }, 800); }catch(_){} return; }
  if(!x) return;
  if(act === 'ai') return askAI(x, MODE === 'tt');
  if(act === 'redo') return redraft(x);
  if(act === 'copy') return doCopy(x);
  if(act === 'send') return doSend(x);
  if(act === 'ok'){ setDone(x, !DONE[x.key]); renderCenter(); renderList(); return; }
  if(act === 'imgpanel'){ const p = $('imgPanel'); if(p){ p.hidden = !p.hidden; if(!p.hidden) tplLoad(); } return; }
  if(act === 'tpladd'){ const f = $('tplFile'); if(f) f.click(); return; }
  if(act === 'tplsend') return tplSend(+t.dataset.id);
  if(act === 'tpldel'){
    if(!confirm('이 이미지를 목록에서 지울까요? (이미 보낸 대화에는 영향 없어요)')) return;
    try{ await tapi('tpl_del', { id: +t.dataset.id }); await tplLoad(true); }catch(err){ st(err.message, true); }
    return;
  }
  if(act === 'takeover'){ try{ await tapi('claim', { user_key: x.key, force: true }); TT.lock = ''; if(TT.data) TT.data.owner = TT.me; renderCenter(); }catch(err){ st(err.message, true); } return; }
  if(act === 'memosave'){ try{ await tapi('note', { user_key: x.key, text: $('memo').value }); TT.data.note = $('memo').value; $('memoSt').textContent = '저장했어요'; setTimeout(() => { const m = $('memoSt'); if(m) m.textContent = ''; }, 1500); }catch(err){ $('memoSt').textContent = err.message; } return; }
  if(act === 'faqgo') return faqSearch();
  if(act === 'hold' || act === 'done' || act === 'reopen'){
    try{ await tapi(act, { user_key: x.key }); SEL.tt = null; TT.data = null; delete TT.x[x.key]; await ttRefresh(); renderCenter(); renderInfo(); if(NARROW()) $('cols').dataset.view = 'list'; }
    catch(err){ st(err.message, true); }
  }
});
document.addEventListener('input', e => {
  const t = e.target, x = curX();
  if(t.id === 'draft' && x){ x.text = t.value; x.edited = true; x.newQ = false; const nq = $('nq'); if(nq) nq.hidden = true; fit(t); count(); }
  else if(t.id === 'slot' && x){ x.slotVal = t.value; if(!x.edited){ x.text = CSAnswer.applySlot(x.c, x.slotVal); x.machine = x.text; setDraft(x, x.text, false); } }
  else if(t.id === 'search'){ SHOWN = 80; renderList(); }
});
document.addEventListener('change', e => { if(e.target.id === 'tplFile'){ const f = e.target.files[0]; e.target.value = ''; tplUpload(f); } });
$('shopSel').onchange = () => { SHOWN = 80; renderList(); };
$('showAns').onchange = () => { SHOWN = 80; renderList(); };
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'faqQ'){ e.preventDefault(); faqSearch(); return; }
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('primary') && !$('primary').disabled){ e.preventDefault(); $('primary').click(); }
  else if(e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); }
});

/* ---------- 시작 ---------- */
(async () => {
  if(authInfo()){ initLearn(); }
  else learnMsg('학습 저장소 꺼짐 — 툴킷에 로그인하세요', true);
  setMode(MODE);
})();
</script>
<script src="paste-upload.js"></script>
</body>

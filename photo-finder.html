<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>사진 자동 찾기</title>
<style>
  @import url("assets/fonts/pretendard/pretendard.css");
  :root{
    --bg:#f6f6f4; --card:#fff; --ink:#15171a; --sub:#6a6f76; --line:#e4e4e0;
    --pri:#15171a; --ok:#0f766e; --okbg:#ecf8f5; --warn:#a15c07; --warnbg:#fdf3e0; --bad:#b42318; --badbg:#fdeceb; --blue:#1d4ed8; --bluebg:#eef3ff;
    --font:"Pretendard Variable","Pretendard",-apple-system,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);margin:0;padding:16px;font-size:14px;}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  h1 .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warnbg);color:var(--warn);}
  .lead{color:var(--sub);font-size:13px;margin:0 0 14px;line-height:1.6;}
  .btn{font:600 14px var(--font);padding:9px 15px;border:1px solid transparent;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .btn-pri{background:var(--pri);color:#fff;} .btn-out{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  textarea,input[type=text]{font:14px var(--font);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
  textarea{min-height:80px;resize:vertical;line-height:1.5;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .row .grow{flex:1;min-width:160px;}
  .row label{font-size:12.5px;color:var(--sub);}
  .row input.mini{width:56px;text-align:center;}
  .hint{font-size:12px;color:var(--sub);line-height:1.55;}
  .prog{display:none;margin-top:10px;} .prog.on{display:block;}
  .prog .bar{height:6px;background:#eee;border-radius:99px;overflow:hidden;} .prog .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s;}
  .prog .msg{font-size:12.5px;color:var(--sub);margin-top:6px;}
  .sum{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px;}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .chip.ok{background:var(--okbg);color:var(--ok);} .chip.warn{background:var(--warnbg);color:var(--warn);} .chip.bad{background:var(--badbg);color:var(--bad);} .chip.gray{background:#eee;color:#666;} .chip.blue{background:var(--bluebg);color:var(--blue);}
  .res{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .res-h{padding:10px 14px;display:flex;gap:10px;align-items:center;}
  .res-h .main{flex:1;min-width:0;}
  .res-h .code{font-size:15px;font-weight:800;word-break:break-all;}
  .res-h .src{font-size:12px;color:var(--sub);margin-top:2px;overflow-wrap:anywhere;}
  .res-h .src a{color:var(--blue);}
  .imgs{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px;}
  .img{width:104px;font-size:11px;color:var(--sub);text-align:center;}
  .img label{display:block;cursor:pointer;}
  .img img{width:104px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee;display:block;}
  .img .px.low{color:var(--bad);font-weight:700;}
  .img input{margin:4px 0 0;}
  .none{padding:0 14px 10px;font-size:12.5px;color:var(--sub);}
</style>
</head>
<body>
<h1>사진 자동 찾기 <span class="badge">시험판</span></h1>
<p class="lead">재고추가 엑셀의 품번(D열)으로 해외 사이트에서 <b>품번이 정확히 같은 상품</b> 사진을 찾아 zip으로 받습니다.
못 찾으면 '수동 필요'로 남깁니다. 서버 부담 없이 천천히(품번당 약 2.5초) 돌리고, 40개씩 끊어서 이어합니다.</p>

<div class="box">
  <div class="row" style="margin-top:0;">
    <label>Worker 주소</label>
    <input type="text" id="worker" class="grow" placeholder="https://buyest-photo.xxxx.workers.dev (배포 후 입력)">
    <button class="btn btn-out btn-sm" id="btnSaveWorker">저장</button>
  </div>
  <div class="row">
    <input type="file" id="file" accept=".xlsx,.xls,.csv">
    <label>품번 열</label><input type="text" id="colCode" class="mini" value="D">
    <label>컬러 열(선택)</label><input type="text" id="colColor" class="mini" value="" placeholder="없음">
    <label>시작 행</label><input type="text" id="rowStart" class="mini" value="2">
  </div>
  <div class="row">
    <textarea id="paste" class="grow" placeholder="엑셀 대신 품번을 한 줄에 하나씩 붙여넣어도 됩니다 (컬러가 있으면 '품번[탭]컬러')"></textarea>
  </div>
  <div class="row">
    <button class="btn btn-pri" id="btnLoad">품번 불러오기</button>
    <button class="btn btn-out" id="btnRun" disabled>다음 40개 조회</button>
    <button class="btn btn-out" id="btnStop" disabled>멈춤</button>
    <button class="btn btn-out" id="btnReset">결과 지우기</button>
  </div>
  <div class="prog" id="prog"><div class="bar"><i id="bar"></i></div><div class="msg" id="msg"></div></div>
  <div class="hint" style="margin-top:8px;">5자 미만 품번은 조회하지 않습니다. 숫자만 있는 짧은 품번은 '직접 확인'(기본 체크 해제)입니다. 사진 아래 숫자는 가로 픽셀이며 800px 미만은 빨강입니다.</div>
</div>

<div class="box" id="resultBox" style="display:none;">
  <div class="sum" id="sum"></div>
  <div class="row" style="margin-top:0;margin-bottom:10px;">
    <button class="btn btn-pri" id="btnZip">체크한 사진 zip 받기</button>
    <button class="btn btn-out" id="btnManual">수동 필요 목록 복사</button>
  </div>
  <div id="list"></div>
</div>

<script src="assets/libs/xlsx.full-0.20.2.min.js"></script>
<script src="assets/libs/jszip-3.10.1.min.js"></script>
<script>
(function(){
  const LS_W='buyest.photofinder.worker', LS_R='buyest.photofinder.results', LS_Q='buyest.photofinder.queue';
  const BATCH=40, GAP=2500;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

  let queue=lsGet(LS_Q,[]);        // [{code,color}]
  let results=lsGet(LS_R,{});      // key -> result
  let running=false, stopFlag=false;
  const key=q=>q.code+'|'+(q.color||'');

  $('worker').value=lsGet(LS_W,'')||'';
  $('btnSaveWorker').onclick=()=>{lsSet(LS_W,$('worker').value.trim().replace(/\/+$/,''));alert('저장했습니다.');};
  const W=()=>($('worker').value.trim()||'').replace(/\/+$/,'');

  const colIdx=s=>{s=String(s||'').trim().toUpperCase();if(!/^[A-Z]{1,2}$/.test(s))return -1;let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n-1;};

  $('btnLoad').onclick=async()=>{
    const list=[];
    const f=$('file').files[0];
    if(f){
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const ci=colIdx($('colCode').value), co=colIdx($('colColor').value);
      const rs=Math.max(1,parseInt($('rowStart').value)||2)-1;
      if(ci<0){alert('품번 열을 알파벳으로 입력하세요 (예: D)');return;}
      for(let r=rs;r<rows.length;r++){
        const code=String(rows[r][ci]==null?'':rows[r][ci]).trim();
        if(code) list.push({code,color:co>=0?String(rows[r][co]||'').trim():''});
      }
    }
    $('paste').value.split(/\r?\n/).forEach(l=>{
      const p=l.split('\t');const code=(p[0]||'').trim();
      if(code) list.push({code,color:(p[1]||'').trim()});
    });
    if(!list.length){alert('불러올 품번이 없습니다.');return;}
    const seen=new Set();queue=[];
    list.forEach(q=>{const k=key(q);if(!seen.has(k)){seen.add(k);queue.push(q);}});
    // 조회 불필요(5자 미만) 미리 처리
    queue.forEach(q=>{if(norm(q.code).length<5&&!results[key(q)])results[key(q)]={status:'skip',reason:'5자 미만'};});
    lsSet(LS_Q,queue);lsSet(LS_R,results);
    render();updateButtons();
  };

  function pending(){return queue.filter(q=>!results[key(q)]);}
  function updateButtons(){
    const n=pending().length;
    $('btnRun').disabled=running||n===0;
    $('btnRun').textContent=n? '다음 '+Math.min(BATCH,n)+'개 조회 (남은 '+n+')':'조회 끝';
    $('btnStop').disabled=!running;
  }

  $('btnRun').onclick=async()=>{
    if(!W()){alert('먼저 Worker 주소를 입력하고 저장하세요.');return;}
    running=true;stopFlag=false;updateButtons();
    $('prog').classList.add('on');
    const todo=pending().slice(0,BATCH);
    for(let i=0;i<todo.length;i++){
      if(stopFlag)break;
      const q=todo[i];
      $('bar').style.width=Math.round(i/todo.length*100)+'%';
      $('msg').textContent=(i+1)+' / '+todo.length+' 조회 중: '+q.code;
      try{
        const r=await fetch(W()+'/find?code='+encodeURIComponent(q.code)+'&color='+encodeURIComponent(q.color||''));
        const d=await r.json();
        if(d.status==='error'||d.error){ $('msg').textContent='오류: '+(d.reason||d.error)+' — 멈춥니다.'; break; }
        results[key(q)]=d;
      }catch(e){ $('msg').textContent='연결 오류: '+e.message+' — 멈춥니다.'; break; }
      lsSet(LS_R,results);render();
      await new Promise(r=>setTimeout(r,GAP));
    }
    running=false;$('bar').style.width='100%';
    if(!/오류/.test($('msg').textContent))$('msg').textContent='이번 묶음 끝. 남은 것은 버튼을 다시 누르면 이어서 합니다.';
    updateButtons();
  };
  $('btnStop').onclick=()=>{stopFlag=true;};
  $('btnReset').onclick=()=>{if(!confirm('조회 결과와 품번 목록을 모두 지울까요?'))return;queue=[];results={};lsSet(LS_Q,[]);lsSet(LS_R,{});render();updateButtons();};

  const LABEL={exact:['정확','ok'],color:['컬러명 일치(확인 권장)','warn'],verify:['직접 확인','blue'],none:['수동 필요','bad'],skip:['조회 안 함','gray']};

  function render(){
    $('resultBox').style.display=queue.length?'':'none';
    const cnt={exact:0,color:0,verify:0,none:0,skip:0,wait:0};
    const out=[];
    queue.forEach((q,idx)=>{
      const r=results[key(q)];
      if(!r){cnt.wait++;return;}
      cnt[r.status]=(cnt[r.status]||0)+1;
      const lab=LABEL[r.status]||['?','gray'];
      let h='<div class="res"><div class="res-h"><div class="main"><div class="code">'+esc(q.code)+(q.color?' <span style="font-weight:500;color:var(--sub)">'+esc(q.color)+'</span>':'')+'</div>';
      if(r.best) h+='<div class="src">'+esc(r.best.source)+' · <a href="'+esc(r.best.page)+'" target="_blank" rel="noopener">상품페이지</a> · '+esc(r.best.name||'')+'</div>';
      else if(r.reason) h+='<div class="src">'+esc(r.reason)+'</div>';
      h+='</div><span class="chip '+lab[1]+'">'+lab[0]+'</span></div>';
      if(r.best){
        const on=(r.status==='exact'||r.status==='color');
        h+='<div class="imgs">';
        const all=[{...r.best,tag:''}].concat((r.others||[]).map(o=>({...o,tag:'보조'})));
        all.forEach((src,si)=>{
          (src.images||[]).forEach((u,ii)=>{
            const id='c_'+idx+'_'+si+'_'+ii;
            h+='<div class="img"><label for="'+id+'"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'" onload="window.__pf(this)"></label>'+
               '<span class="px">…</span>'+(src.tag?' <span class="chip gray">'+src.tag+'</span>':'')+
               '<br><input type="checkbox" id="'+id+'" data-code="'+esc(q.code)+'" data-url="'+esc(u)+'" data-n="'+(si*100+ii+1)+'"'+((on&&si===0)?' checked':'')+'></div>';
          });
        });
        h+='</div>';
      } else h+='<div class="none">'+(r.status==='none'?'품번이 같은 상품 페이지를 찾지 못했습니다. 직접 찾아야 합니다.':'')+'</div>';
      h+='</div>';
      out.push(h);
    });
    $('list').innerHTML=out.join('');
    $('sum').innerHTML=
      '<span class="chip ok">정확 '+cnt.exact+'</span><span class="chip warn">컬러명 일치 '+cnt.color+'</span><span class="chip blue">직접 확인 '+cnt.verify+'</span>'+
      '<span class="chip bad">수동 필요 '+cnt.none+'</span><span class="chip gray">조회 안 함 '+cnt.skip+'</span><span class="chip gray">대기 '+cnt.wait+'</span>';
  }
  window.__pf=img=>{
    const px=img.parentNode.parentNode.querySelector('.px');
    const w=img.naturalWidth;px.textContent=w+'px';
    if(w<800)px.classList.add('low');
  };

  $('btnManual').onclick=()=>{
    const m=queue.filter(q=>{const r=results[key(q)];return r&&(r.status==='none'||r.status==='skip');}).map(q=>q.code);
    if(!m.length){alert('수동 필요 품번이 없습니다.');return;}
    navigator.clipboard.writeText(m.join('\n')).then(()=>alert(m.length+'개 복사했습니다.'),()=>prompt('복사하세요',m.join('\n')));
  };

  $('btnZip').onclick=async()=>{
    const boxes=[...document.querySelectorAll('#list input[type=checkbox]:checked')];
    if(!boxes.length){alert('체크된 사진이 없습니다.');return;}
    if(!W()){alert('Worker 주소가 필요합니다.');return;}
    const zip=new JSZip();let ok=0,fail=0;
    $('prog').classList.add('on');
    for(let i=0;i<boxes.length;i++){
      const b=boxes[i];
      $('bar').style.width=Math.round(i/boxes.length*100)+'%';
      $('msg').textContent='사진 받는 중 '+(i+1)+' / '+boxes.length;
      try{
        const r=await fetch(W()+'/img?u='+encodeURIComponent(b.dataset.url));
        if(!r.ok)throw new Error(r.status);
        const blob=await r.blob();
        const ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'');
        const folder=b.dataset.code.replace(/[\\/:*?"<>|]/g,'_').trim();
        zip.file(folder+'/'+folder+'_'+String(b.dataset.n).padStart(2,'0')+'.'+ext,blob);ok++;
      }catch(e){fail++;}
    }
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='사진_'+new Date().toISOString().slice(0,10)+'.zip';a.click();
    $('bar').style.width='100%';$('msg').textContent='zip 완료: 성공 '+ok+'장'+(fail?', 실패 '+fail+'장':'');
  };

  render();updateButtons();
})();
</script>
</body>
</html>

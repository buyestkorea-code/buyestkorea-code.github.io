<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>크림 품절 정리</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 1150px; margin: 32px auto; padding: 0 20px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.lead { color: #555; margin-top: 6px; font-size: 13.5px; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; margin: 16px 0; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #666; font-weight: 600; }
  input[type=file] { font-size: 13px; }
  .btn { font-size: 15px; padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; }
  .btn-primary { background: #111827; color: #fff; }
  .btn-green { background: #0f766e; color: #fff; }
  .btn:disabled { background: #d1d5db; color: #6b7280; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; background: #fff; }
  th, td { border-bottom: 1px solid #e5e7eb; padding: 7px 8px; text-align: left; }
  th { background: #f3f4f6; position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl-wrap { max-height: 58vh; overflow: auto; border: 1px solid #e5e7eb; border-radius: 6px; margin-top: 12px; }
  #status { color: #6b7280; margin: 10px 0; font-size: 13px; }
  #result { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; }
  #result.ok { background: #f0fdf4; color: #15803d; }
  #result.err { background: #fef2f2; color: #b91c1c; white-space: pre-wrap; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .c-soldout { background: #fef2f2; color: #b91c1c; }
  .c-restock { background: #eff6ff; color: #1d4ed8; }
  .c-qty { background: #fef3c7; color: #92400e; }
  .dropzone { border: 1.5px dashed #d1d5db; border-radius: 8px; padding: 20px 16px; text-align: center; color: #6b7280; cursor: pointer; transition: border-color .12s, background .12s; min-width: 260px; }
  .dropzone:hover, .dropzone.drag { border-color: #111827; background: #f3f4f6; color: #222; }
  .dropzone.has-file { border-style: solid; border-color: #0f766e; }
  .dropzone input[type=file] { display: none; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 12px; font-size: 12.5px; color: #444; }
  .stat b { color: #111; font-size: 14px; }
</style>
</head>
<body>
  <h1>크림 품절 정리</h1>
  <p class="lead">
    크림등록상품 엑셀(매일 업데이트되는 마스터 파일) + 이카운트 재고변동표를 올리면 → 품번·사이즈 기준으로 자동 매칭해 <b>재고 컬럼을 이카운트 잔량으로 갱신</b>합니다.<br>
    매칭 기준: 크림 상품명(예: <code>A09FW733-BLACK</code>)의 <code>-</code>를 공백으로 바꾼 값이 이카운트 품목명 끝부분과 일치 + 사이즈(규격) 일치. 오늘 실제로 값이 바뀐 행만 변동내역에 담깁니다.
  </p>

  <div class="row">
    <div class="field">
      <label>1. 크림등록상품 엑셀 (.xlsx)</label>
      <div class="dropzone" id="kreamDrop" tabindex="0" role="button" aria-label="크림등록상품 엑셀 선택">
        <div id="kreamDropText">클릭 또는 끌어다 놓기 (Ctrl+V 가능)</div>
        <input type="file" id="kreamFile" accept=".xlsx,.xls">
      </div>
    </div>
    <div class="field">
      <label>2. 이카운트 재고변동표 (.xlsx)</label>
      <div class="dropzone" id="ecDrop" tabindex="0" role="button" aria-label="이카운트 재고변동표 선택">
        <div id="ecDropText">클릭 또는 끌어다 놓기 (Ctrl+V 가능)</div>
        <input type="file" id="ecFile" accept=".xlsx,.xls">
      </div>
    </div>
  </div>

  <button class="btn btn-primary" id="runBtn" onclick="run()" disabled>매칭 실행</button>
  <button class="btn btn-green" id="dlDeltaBtn" onclick="downloadDelta()" style="display:none;">변동내역 다운로드</button>
  <button class="btn btn-green" id="dlFullBtn" onclick="downloadFull()" style="display:none;">오늘자 크림등록상품 전체 다운로드</button>

  <div id="status"></div>
  <div id="result"></div>
  <div class="stat-row" id="statRow"></div>
  <div class="tbl-wrap" id="tblWrap" style="display:none;"><table id="tbl"></table></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
let kreamWB = null, kreamBuf = null, kreamFileName = '', kreamSheetName = '', ecWB = null;
let deltaRows = [], patchList = [];

document.getElementById('kreamFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  kreamFileName = f.name.replace(/\.[^.]+$/, '');
  kreamBuf = await f.arrayBuffer();
  kreamWB = XLSX.read(kreamBuf, { type: 'array', cellText: false });
  document.getElementById('kreamDrop').classList.add('has-file');
  document.getElementById('kreamDropText').textContent = '✓ ' + f.name;
  refreshRunBtn();
});
document.getElementById('ecFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  ecWB = XLSX.read(await f.arrayBuffer(), { type: 'array', raw: true });
  document.getElementById('ecDrop').classList.add('has-file');
  document.getElementById('ecDropText').textContent = '✓ ' + f.name;
  refreshRunBtn();
});

function wireDropzone(zoneId, inputId){
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  ['dragenter','dragover'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e => {
    if (e.dataTransfer.files[0]) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change', { bubbles: true })); }
  });
  zone.addEventListener('paste', e => {
    const f = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0];
    if (f) { const dt = new DataTransfer(); dt.items.add(f); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true })); }
  });
}
wireDropzone('kreamDrop', 'kreamFile');
wireDropzone('ecDrop', 'ecFile');

function refreshRunBtn() {
  document.getElementById('runBtn').disabled = !kreamWB || !ecWB;
}

const S = v => (v === null || v === undefined) ? '' : String(v).trim();

// 상품명 끝에서부터 한글이 아닌 토큰이 이어지는 구간을 "품번"으로 본다 (MD 품절 도구와 동일 규칙).
function codeSuffix(name) {
  const cleaned = String(name || '').replace(/\s*\([^)]*\)\s*$/, '');
  const toks = cleaned.trim().split(/\s+/).filter(Boolean);
  let i = toks.length;
  while (i > 0 && !/[가-힣]/.test(toks[i - 1])) i--;
  return toks.slice(i).join(' ');
}
function normKey(s) {
  return String(s || '').replace(/-/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
}
function normSpec(v) {
  let s = S(v).toUpperCase();
  s = s.replace(/\(/g, ' ').replace(/\)/g, ' ').replace(/\s+/g, ' ').trim();
  if (/^\d+\.0$/.test(s)) s = s.slice(0, -2);
  return s;
}
function specsMatch(a, b) {
  const x = normSpec(a), y = normSpec(b);
  if (x === y) return true;
  const free = v => v === '' || v === 'TU' || v === 'FREE' || v === 'ONE SIZE' || v === 'OS';
  if (free(x) && free(y)) return true;
  return false;
}

function headerColMap(headerRow) {
  const col = {};
  (headerRow || []).forEach((v, i) => {
    if (v === null || v === undefined) return;
    const key = String(v).split('\n')[0].trim();
    if (key && !(key in col)) col[key] = i;
  });
  return col;
}
function findHeaderRowIdx(aoa, matchFn) {
  for (let i = 0; i < aoa.length; i++) if (aoa[i] && matchFn(aoa[i])) return i;
  return -1;
}
// 헤더 문구가 파일마다 조금씩 바뀌는 열("상품번호 및 특이사항" vs "특이사항", "이카 재고" vs "재고")을
// 위해 완전일치 대신 포함 여부로 찾는다. exclude가 있으면 그 문구가 같이 들어간 열(가격 열 등)은 제외.
function findColContains(headerRow, substr, exclude) {
  for (let i = 0; i < (headerRow || []).length; i++) {
    const v = headerRow[i];
    if (v === null || v === undefined) continue;
    const t = String(v).split('\n')[0].trim();
    if (t.indexOf(substr) === -1) continue;
    if (exclude && t.indexOf(exclude) !== -1) continue;
    return i;
  }
  return -1;
}

/* 이카운트 재고변동표 → [{code,name,spec,remain}] */
function parseEcountDelta(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  const hIdx = findHeaderRowIdx(aoa, r => r[0] === '품목코드');
  if (hIdx === -1) throw new Error('이카운트 재고변동표에서 헤더 행("품목코드")을 찾을 수 없습니다.');
  const col = headerColMap(aoa[hIdx]);
  ['품목코드', '품목명', '규격', '잔량'].forEach(need => {
    if (!(need in col)) throw new Error(`이카운트 재고변동표에 "${need}" 열이 없습니다.`);
  });
  const items = [];
  for (let r = hIdx + 1; r < aoa.length; r++) {
    const row = aoa[r];
    const code = row && row[col['품목코드']];
    if (!code || !/^\d+$/.test(String(code).trim())) continue;
    items.push({
      code: String(code).trim(),
      name: S(row[col['품목명']]),
      spec: row[col['규격']] == null ? '' : String(row[col['규격']]),
      remain: row[col['잔량']] == null ? 0 : (Number(row[col['잔량']]) || 0)
    });
  }
  if (!items.length) throw new Error('이카운트 재고변동표에서 인식된 품목이 없습니다.');
  return items;
}

/* 크림등록상품 시트에서 헤더 위치와 컬럼 인덱스를 찾는다. */
function findKreamSheet(wb) {
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, range: 0 });
    const hIdx = findHeaderRowIdx(aoa.slice(0, 5), r => r.indexOf('크림 상품명') !== -1);
    if (hIdx !== -1) {
      const headerRow = aoa[hIdx];
      const exact = headerColMap(headerRow);
      // 열 이름이 파일마다 조금씩 바뀌어서("특이사항"→"상품번호 및 특이사항", "재고"→"이카 재고")
      // 완전일치가 실패하면 포함검색으로 한번 더 찾는다.
      const col = {
        '특이사항': ('특이사항' in exact) ? exact['특이사항'] : findColContains(headerRow, '특이사항'),
        '크림 상품명': exact['크림 상품명'],
        '상품명': exact['상품명'],
        '사이즈': exact['사이즈'],
        '재고': ('재고' in exact) ? exact['재고'] : findColContains(headerRow, '재고', '가격')
      };
      Object.keys(col).forEach(need => {
        if (col[need] === undefined || col[need] === -1) {
          throw new Error(`크림등록상품 엑셀에 "${need}" 열을 찾을 수 없습니다. (헤더: ${headerRow.filter(Boolean).join(', ')})`);
        }
      });
      return { sheetName: name, ws, headerIdx: hIdx, col };
    }
  }
  throw new Error('크림등록상품 엑셀에서 "크림 상품명" 헤더를 찾을 수 없습니다.');
}

async function run() {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  status.textContent = ''; result.textContent = ''; result.className = '';
  document.getElementById('dlDeltaBtn').style.display = 'none';
  document.getElementById('dlFullBtn').style.display = 'none';
  document.getElementById('tblWrap').style.display = 'none';
  document.getElementById('statRow').innerHTML = '';
  status.textContent = '엑셀 파싱 중...';

  try {
    const ecItems = parseEcountDelta(ecWB);
    const codeMap = {};
    ecItems.forEach(it => {
      const key = normKey(codeSuffix(it.name));
      if (!key) return;
      if (!codeMap[key]) codeMap[key] = [];
      codeMap[key].push(it);
    });

    const { sheetName, ws, headerIdx, col } = findKreamSheet(kreamWB);
    kreamSheetName = sheetName;
    const range = XLSX.utils.decode_range(ws['!ref']);

    let lastBrand = '', lastKreamName = '', lastName = '';
    deltaRows = [];
    patchList = [];
    let matchedCount = 0, ambiguousCount = 0;

    for (let r = headerIdx + 1; r <= range.e.r; r++) {
      const get = c => {
        const ref = XLSX.utils.encode_cell({ r, c });
        const cell = ws[ref];
        return cell ? cell.v : null;
      };
      const rawBrand = get(col['특이사항']);
      const rawKreamName = get(col['크림 상품명']);
      const rawName = get(col['상품명']);
      const size = get(col['사이즈']);

      if (S(rawBrand)) lastBrand = S(rawBrand);
      if (S(rawKreamName)) lastKreamName = S(rawKreamName);
      if (S(rawName)) lastName = S(rawName);

      if (!lastKreamName || !S(size)) continue; // 완전히 빈 행

      const key = normKey(lastKreamName);
      const candidates = (codeMap[key] || []).filter(it => specsMatch(it.spec, size));
      if (!candidates.length) continue; // 오늘 변동표에 없는 상품 - 건드리지 않음

      let picked = candidates[0];
      if (candidates.length > 1) {
        const vals = new Set(candidates.map(c => c.remain));
        if (vals.size > 1) ambiguousCount++;
      }

      const oldRef = XLSX.utils.encode_cell({ r, c: col['재고'] });
      const oldCell = ws[oldRef];
      const oldVal = (oldCell && oldCell.v != null) ? Number(oldCell.v) || 0 : null;
      const newVal = picked.remain;

      if (oldVal === newVal) continue; // 값 그대로 - 변동 없음

      // 재고 셀 갱신 (숫자로) - 화면 표/통계용. 실제 다운로드 파일은 원본 바이너리를 직접 패치한다(아래 buildPatchedKreamBlob).
      ws[oldRef] = { t: 'n', v: newVal };
      if (range.e.c < col['재고']) range.e.c = col['재고'];
      patchList.push({ r: r + 1, c: col['재고'], v: newVal });

      let statusLabel = '수량변경';
      if (newVal === 0 && oldVal !== 0) statusLabel = '품절';
      else if ((oldVal === null || oldVal === 0) && newVal > 0) statusLabel = '재입고';

      matchedCount++;
      deltaRows.push({
        brand: lastBrand, kreamName: lastKreamName, name: lastName, size: S(size),
        oldVal, newVal, statusLabel, ecCode: picked.code, ecName: picked.name
      });
    }

    ws['!ref'] = XLSX.utils.encode_range(range);

    status.textContent = `크림 등록상품 ${range.e.r - headerIdx}행 · 이카운트 변동표 ${ecItems.length}건 중 ${matchedCount}건 변동`;
    result.className = 'ok';
    result.textContent = `✅ 매칭 완료. 재고 컬럼에 이카운트 잔량을 반영했습니다.${ambiguousCount ? ` (⚠️ 후보 중복 ${ambiguousCount}건 - 첫 후보로 처리됨, 표에서 확인해주세요.)` : ''}`;

    renderTable(deltaRows);
    renderStats(deltaRows);
    document.getElementById('dlDeltaBtn').style.display = deltaRows.length ? 'inline-block' : 'none';
    document.getElementById('dlFullBtn').style.display = 'inline-block';
  } catch (e) {
    status.textContent = '';
    result.className = 'err';
    result.textContent = '오류: ' + e.message;
  }
}

function renderStats(rows) {
  const cnt = s => rows.filter(r => r.statusLabel === s).length;
  document.getElementById('statRow').innerHTML = `
    <div class="stat">총 변동 <b>${rows.length}</b></div>
    <div class="stat">품절 <b>${cnt('품절')}</b></div>
    <div class="stat">재입고 <b>${cnt('재입고')}</b></div>
    <div class="stat">수량변경 <b>${cnt('수량변경')}</b></div>`;
}

function renderTable(rows) {
  const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const chip = s => ({ '품절': 'c-soldout', '재입고': 'c-restock', '수량변경': 'c-qty' }[s] || 'c-qty');
  const body = rows.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td>${esc(r.brand)}</td>
    <td>${esc(r.kreamName)}</td>
    <td>${esc(r.size)}</td>
    <td class="num">${r.oldVal === null ? '—' : r.oldVal}</td>
    <td class="num">${r.newVal}</td>
    <td><span class="chip ${chip(r.statusLabel)}">${esc(r.statusLabel)}</span></td>
    <td>${esc(r.ecName)}</td>
  </tr>`).join('');
  document.getElementById('tbl').innerHTML =
    `<thead><tr><th>#</th><th>특이사항</th><th>크림 상품명</th><th>사이즈</th><th>이전재고</th><th>신규재고</th><th>상태</th><th>이카운트 품목명</th></tr></thead><tbody>${body}</tbody>`;
  document.getElementById('tblWrap').style.display = 'block';
}

function todayStamp() {
  return new Date().toISOString().slice(0, 10).replace(/-/g, '');
}

function downloadDelta() {
  const aoa = [['특이사항', '크림 상품명', '상품명', '사이즈', '이전재고', '신규재고', '상태', '이카운트품목코드', '이카운트품목명']];
  deltaRows.forEach(r => aoa.push([r.brand, r.kreamName, r.name, r.size, r.oldVal, r.newVal, r.statusLabel, r.ecCode, r.ecName]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '변동내역');
  XLSX.writeFile(wb, `크림품절_변동내역_${todayStamp()}.xlsx`);
}

/* ===== 원본 파일을 그대로 두고 재고 셀만 패치하는 로직 =====
   XLSX.writeFile로 새로 만들면 서식/스타일이 일부 유실될 수 있어서, 업로드한 원본
   xlsx의 zip을 직접 열어 해당 시트 XML의 <c> 셀 값만 바꾸고 나머지 파일은 손대지 않는다. */
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

async function resolveSheetXmlPath(zip, sheetName) {
  const wbXml = await zip.file('xl/workbook.xml').async('string');
  const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const sheetTagRe = /<sheet\b[^>]*\/>/g;
  let m, rId = null;
  while ((m = sheetTagRe.exec(wbXml))) {
    const tag = m[0];
    const nameM = /name="([^"]*)"/.exec(tag);
    const ridM = /r:id="([^"]*)"/.exec(tag);
    if (nameM && nameM[1] === sheetName && ridM) { rId = ridM[1]; break; }
  }
  if (!rId) throw new Error('원본 파일의 workbook.xml에서 시트("' + sheetName + '")를 찾지 못했습니다.');
  const relRe = new RegExp('<Relationship\\b[^>]*Id="' + escapeRegex(rId) + '"[^>]*\\/>');
  const relM = relRe.exec(relsXml);
  if (!relM) throw new Error('시트 경로(rels)를 찾지 못했습니다.');
  const targetM = /Target="([^"]*)"/.exec(relM[0]);
  if (!targetM) throw new Error('시트 경로(Target)를 찾지 못했습니다.');
  let target = targetM[1];
  return target.startsWith('/') ? target.slice(1) : 'xl/' + target;
}

function stripTypeAttr(attrs) {
  return (attrs || '').replace(/\s+t="[^"]*"/, '');
}

// 행(inner) XML 문자열 안에서 ref 셀을 찾아 숫자값으로 바꾸고, 없으면 열 순서에 맞는 위치에 새로 삽입한다.
function patchCellInRow(inner, ref, col, val) {
  const escRef = escapeRegex(ref);
  let re = new RegExp('<c r="' + escRef + '"([^>]*)\\/>');
  let m = re.exec(inner);
  if (m) {
    const attrs = stripTypeAttr(m[1]);
    return inner.slice(0, m.index) + '<c r="' + ref + '"' + attrs + '><v>' + val + '</v></c>' + inner.slice(m.index + m[0].length);
  }
  re = new RegExp('<c r="' + escRef + '"([^>]*)>([\\s\\S]*?)<\\/c>');
  m = re.exec(inner);
  if (m) {
    const attrs = stripTypeAttr(m[1]);
    return inner.slice(0, m.index) + '<c r="' + ref + '"' + attrs + '><v>' + val + '</v></c>' + inner.slice(m.index + m[0].length);
  }
  // 셀 자체가 없는 행(빈 셀은 생략됨) - 열 순서에 맞는 위치에 새로 삽입
  const cellRe = /<c r="([A-Z]+)\d+"/g;
  let insAt = inner.length, mm;
  while ((mm = cellRe.exec(inner))) {
    if (XLSX.utils.decode_col(mm[1]) > col) { insAt = mm.index; break; }
  }
  return inner.slice(0, insAt) + '<c r="' + ref + '"><v>' + val + '</v></c>' + inner.slice(insAt);
}

function patchSheetXml(xml, patches) {
  const byRow = {};
  patches.forEach(p => { (byRow[p.r] = byRow[p.r] || []).push(p); });

  Object.keys(byRow).forEach(rowNumStr => {
    const rowNum = Number(rowNumStr);
    const openRe = new RegExp('(<row r="' + rowNum + '"[^>]*>)([\\s\\S]*?)(<\\/row>)');
    const selfCloseRe = new RegExp('(<row r="' + rowNum + '"[^>]*)\\/>');

    let m = openRe.exec(xml);
    if (m) {
      let inner = m[2];
      byRow[rowNumStr].forEach(p => { inner = patchCellInRow(inner, XLSX.utils.encode_col(p.c) + p.r, p.c, p.v); });
      xml = xml.slice(0, m.index) + m[1] + inner + m[3] + xml.slice(m.index + m[0].length);
      return;
    }
    m = selfCloseRe.exec(xml);
    if (m) {
      let inner = '';
      byRow[rowNumStr].forEach(p => { inner = patchCellInRow(inner, XLSX.utils.encode_col(p.c) + p.r, p.c, p.v); });
      const newRow = m[1] + '>' + inner + '</row>';
      xml = xml.slice(0, m.index) + newRow + xml.slice(m.index + m[0].length);
      return;
    }
    throw new Error('원본 엑셀에서 ' + rowNum + '행을 찾지 못해 그 행은 반영하지 못했습니다. (파일이 바뀌었을 수 있어요 - 다시 업로드 후 시도해주세요)');
  });
  return xml;
}

async function buildPatchedKreamBlob() {
  const zip = await JSZip.loadAsync(kreamBuf);
  const sheetPath = await resolveSheetXmlPath(zip, kreamSheetName);
  const sheetFile = zip.file(sheetPath);
  if (!sheetFile) throw new Error('원본 파일 안에서 시트 XML(' + sheetPath + ')을 찾지 못했습니다.');
  let xml = await sheetFile.async('string');
  xml = patchSheetXml(xml, patchList);
  zip.file(sheetPath, xml);
  return zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    compression: 'DEFLATE',
    compressionOptions: { level: 6 }
  });
}

async function downloadFull() {
  const dlBtn = document.getElementById('dlFullBtn');
  const orig = dlBtn.textContent;
  dlBtn.disabled = true; dlBtn.textContent = '원본 파일 반영 중...';
  try {
    const blob = await buildPatchedKreamBlob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${kreamFileName}_${todayStamp()}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) {
    const result = document.getElementById('result');
    result.className = 'err';
    result.textContent = '원본 파일 반영 중 오류: ' + e.message;
  } finally {
    dlBtn.disabled = false; dlBtn.textContent = orig;
  }
}
</script>

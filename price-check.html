<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>최저가 조회</title>
<style>
  @import url("assets/fonts/pretendard/pretendard.css");
  :root{
    --bg:#f6f6f4; --card:#fff; --ink:#15171a; --sub:#6a6f76; --line:#e4e4e0;
    --pri:#15171a; --ok:#0f766e; --okbg:#ecf8f5; --warn:#a15c07; --warnbg:#fdf3e0; --bad:#b42318; --badbg:#fdeceb; --blue:#1d4ed8; --bluebg:#eef3ff;
    --font:"Pretendard Variable","Pretendard",-apple-system,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);margin:0;padding:16px;font-size:14px;}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  h1 .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warnbg);color:var(--warn);}
  .lead{color:var(--sub);font-size:13px;margin:0 0 14px;line-height:1.6;}
  .btn{font:600 14px var(--font);padding:9px 15px;border:1px solid transparent;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .btn:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,tr[data-key]:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .btn-pri{background:var(--pri);color:#fff;} .btn-out{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  textarea,input[type=text],input[type=search],select{font:14px var(--font);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
  select{width:auto;padding:8px 10px;}
  textarea{min-height:92px;resize:vertical;line-height:1.5;}

  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}

  .hint{font-size:12px;color:var(--sub);line-height:1.55;}
  .or{font-size:12px;color:var(--sub);margin:0 2px;}
  .filebtn{position:relative;overflow:hidden;display:inline-block;}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;}

  /* 올린 파일 미리보기 */
  .pv{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;}
  .pv .samples{font-size:12.5px;color:var(--sub);margin:6px 0 0;line-height:1.6;word-break:break-all;}

  /* 대기열 */
  .qbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .qtop{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;}
  .qnum .lab{font-size:12px;color:var(--sub);} .qnum .n{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;}
  .qnum .n small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px;}

  .bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0 6px;}
  .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s;}
  .qmsg{font-size:12.5px;color:var(--sub);min-height:18px;}

  /* 목록 */
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px;}
  .tools input[type=search]{max-width:220px;padding:8px 11px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex-wrap:wrap;}
  .seg button{font:600 12.5px var(--font);padding:7px 11px;border:0;background:#fff;cursor:pointer;color:var(--sub);white-space:nowrap;}
  .seg button.on{background:var(--pri);color:#fff;}
  .seg button b{font-weight:700;margin-left:3px;opacity:.75;}
  .lst{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table.l{width:100%;border-collapse:collapse;font-size:13px;}
  table.l th{font-size:11.5px;color:var(--sub);font-weight:700;text-align:left;padding:8px 10px;background:#fafaf8;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.l td{padding:9px 10px;border-bottom:1px solid #f0f0ec;vertical-align:middle;}
  table.l tr[data-key]{cursor:pointer;} table.l tr[data-key]:hover td{background:#fafaf8;}
  table.l tr[data-key].open td{background:#f4f6ff;}
  table.l td.r,table.l th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.l td.c{font-weight:700;} table.l td.dim{color:#9aa0a7;}
  table.l .cd{font-weight:700;word-break:break-all;} table.l .og{font-size:11.5px;color:var(--sub);overflow-wrap:anywhere;margin-top:1px;}
  table.l tr.exp > td{padding:0;background:#fff;border-bottom:2px solid var(--line);}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;font-size:12.5px;color:var(--sub);}
  .empty{padding:34px 16px;text-align:center;color:var(--sub);line-height:1.7;}

  /* 상세 카드 (펼침) */
  .res{background:var(--card);overflow:hidden;}
  .res-h{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);}
  .res-h .code{font-size:16px;font-weight:800;letter-spacing:-.01em;word-break:break-all;}
  .res-h .orig{font-size:12px;color:var(--sub);margin-top:2px;overflow-wrap:anywhere;}
  .res-h .main{flex:1;min-width:0;}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .chip.ok{background:var(--okbg);color:var(--ok);} .chip.warn{background:var(--warnbg);color:var(--warn);} .chip.bad{background:var(--badbg);color:var(--bad);} .chip.gray{background:#eee;color:#666;} .chip.blue{background:var(--bluebg);color:var(--blue);}
  .res-b{padding:14px;}
  .figs{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;}
  .fig .lab{font-size:12px;color:var(--sub);margin-bottom:2px;}
  .fig .num{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;}
  .fig .num small{font-size:15px;font-weight:700;margin-left:1px;}
  .fig.sm .num{font-size:19px;} .fig.sm .num.dim{color:#9aa0a7;}
  .fig .sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .note{font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:8px;margin:8px 0 0;}
  .note.warn{background:var(--warnbg);color:#7a4505;} .note.bad{background:var(--badbg);color:var(--bad);} .note.info{background:var(--bluebg);color:#1e3a8a;}

  /* 가격 사다리 */
  .ladder{position:relative;height:74px;margin:14px 6px 8px;}
  .ladder .axis{position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line);}
  .ladder .dot{position:absolute;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;border:2px solid var(--pri);background:var(--pri);}
  .ladder .dot.par{border-color:var(--blue);background:var(--blue);}
  .ladder .dot.part{border-color:#b9bcc2;background:#fff;}
  .ladder .dot.min{box-shadow:0 0 0 4px rgba(15,118,110,.22);}
  .ladder .tick{position:absolute;top:16px;height:36px;border-left:2px dashed #c9ccd1;}
  .ladder .tl{position:absolute;font-size:11px;color:var(--sub);white-space:nowrap;transform:translateX(-50%);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin:0 6px 4px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--pri);background:var(--pri);}
  .legend i.par{border-color:var(--blue);background:var(--blue);} .legend i.part{border-color:#b9bcc2;background:#fff;}

  /* 상세 표 */
  table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  table.t th{font-size:11.5px;color:var(--sub);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.t td{padding:7px 8px;border-bottom:1px solid #f0f0ec;vertical-align:top;}
  table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.t td.ti{word-break:keep-all;overflow-wrap:anywhere;min-width:160px;}
  table.t a{color:var(--ink);text-decoration:none;} table.t a:hover{text-decoration:underline;}
  table.t tr.min td{background:#f2faf8;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:5px;vertical-align:1px;}
  .tag.par{background:var(--bluebg);color:var(--blue);} .tag.ad{background:#eee;color:#666;} .tag.cat{background:var(--warnbg);color:var(--warn);}
  details.fold{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  details.fold summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--sub);padding:4px 0;}
  .res-f{padding:10px 14px;background:#fafaf8;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .res-f input{flex:1;min-width:150px;padding:7px 10px;font-size:13px;}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:var(--ok);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:5px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none;}.bar i{transition:none;}}
  .gate{background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center;padding:48px 20px;}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#15171a;color:#fff;padding:10px 18px;border-radius:9px;font-size:14px;z-index:100;display:none;max-width:90vw;}
  #toast.err{background:var(--bad);}
  @media (max-width:640px){.fig .num{font-size:25px;} table.t td.ti{min-width:120px;} table.l th.hm,table.l td.hm{display:none;}}
</style>

<body>
<div id="toast" role="status"></div>
<div id="app"></div>

<script src="assets/libs/xlsx.full-0.20.2.min.js"></script>
<script>
'use strict';
/* ============================================================
   최저가 조회 (TEST) — 품번으로 다나와 검색 결과를 가져와 같은 상품만 골라 최저가를 보여준다. 참고용.
   - 몇 개든 한꺼번에 올려두면(붙여넣기·엑셀) 대기열에 쌓고 10초 간격으로 알아서 차례로 조회한다. 같은 품번은 한 번만 조회.
   - 대기열·결과는 이 브라우저(IndexedDB)에 저장 — 창을 닫아도 다음에 열면 남은 것부터 이어서 한다. (조회가 도는 동안엔 이 화면이 열려 있어야 한다)
   - 서버(price_check_api.php)는 다나와 HTML 을 대신 받아주기만 한다(10초 간격·24시간 캐시). 파싱·필터·계산은 전부 이 파일.
   - 같은 상품 판정은 "공백·하이픈을 뺀 품번이 상품명에 들어있는가"로 한다. 색상까지 일치(full) / 색상 다르거나 불명(part)을 나눈다.
   ============================================================ */
const API = 'https://buyest.co.kr/price_check_api.php';
const MAX_LINES = 20000;      // 한 번에 올릴 수 있는 줄 수
const PAGE = 100;             // 목록 한 쪽에 보여줄 품번 수
const GAP_SEC = 10;           // 다나와 요청 간격(서버가 강제하는 값과 같음) — 남은 시간 계산용

/*PARSER_START*/
const decodeEnt = s => String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
const stripTags = s => decodeEnt(String(s).replace(/<[^>]+>/g,'')).replace(/\s+/g,' ').trim();
const normCode = s => String(s||'').toUpperCase().replace(/[^0-9A-Z가-힣]/g,'');
const hasHangul = s => /[가-힣]/.test(s);

const BUNDLE = /(\d+\s*종|모음|세트|택\s?\d|\bSET\b|\d+\s*컬러|컬러\s*택|\d{2,3}\/\d{2,3}\/\d{2,3})/i;   // 마지막 = DD1391-100/101/102 처럼 여러 색상 품번을 한 상품에 나열한 것
const USED = /중고|리퍼|빈티지|\bUSED\b|B급|미사용급/i;
const PARALLEL = /\[해외\]|\(해외\)|해외직구|해외배송|해외구매|병행|직구/;
const SIZE_TAIL = /^(.+)_(TU|FREE|F|XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|\d{1,3}(\.\d)?[YAM]?)$/i;

/** 입력(품번 또는 상품명) -> 품번 구간 토큰과 검색어 후보. */
function extractCode(input){
  let s = String(input||'').trim().replace(/\[[^\]]*\]\s*$/,'').trim();
  s = s.replace(/^[가-힣]{1,3}_/,'');
  let toks = s.split(/\s+/).filter(Boolean);
  const out = [];
  for (let i = toks.length - 1; i >= 0; i--) {
    let t = toks[i];
    if (i === toks.length - 1) { const m = t.match(SIZE_TAIL); if (m && !hasHangul(t)) t = m[1]; }
    if (hasHangul(t)) break;
    out.unshift(t);
  }
  let tokens = out.slice(-4);
  if (!tokens.length) tokens = toks.filter(t => !hasHangul(t)).slice(-4);
  if (!tokens.length) tokens = [s];
  let base;
  if (tokens.length === 1) base = tokens[0].indexOf('-') > 0 ? [tokens[0].split('-')[0]] : [tokens[0]];
  else base = tokens.slice(0, -1);
  const queries = [];
  const add = q => { q = q.trim(); if (q && !queries.includes(q)) queries.push(q); };
  if (tokens.length === 1) add(tokens[0]);
  else {
    add(base.join(' '));
    if (tokens.length >= 3 && tokens[1].length <= 3) add(tokens[0] + tokens[1] + ' ' + tokens.slice(2, -1).join(' '));
    add(tokens[0]);
  }
  return { input: String(input||'').trim(), tokens, base, fullN: normCode(tokens.join('')), baseN: normCode(base.join('')), firstN: normCode(tokens[0]), queries };
}

/** 다나와 검색결과(서버가 추린 HTML 조각 또는 전체 HTML) -> 상품 배열 */
function parseItems(html){
  html = String(html || '').replace(/\s+/g, ' ');   // 다나와 원본은 태그 속성이 줄바꿈으로 쪼개져 있다
  const items = [];
  const re = /<li\s+id="productItem([^"]+)"\s+class="prod_item([^"]*)"[^>]*>/g;
  const starts = []; let m;
  while ((m = re.exec(html))) starts.push({ id: m[1], cls: m[2], at: m.index });
  for (let i = 0; i < starts.length; i++) {
    const block = html.slice(starts[i].at, i + 1 < starts.length ? starts[i + 1].at : starts[i].at + 14000);
    const nameM = block.match(/<p class="prod_name">\s*<a[^>]*?href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/);
    if (!nameM) continue;
    const catalog = /^\d+$/.test(starts[i].id);
    let price = null;
    if (catalog) { const p = block.match(/id="min_price_\d+" value="(\d+)"/); if (p) price = +p[1]; }
    if (price == null) { const p = block.match(/<p class="price_sect"[^>]*>[\s\S]*?<strong>([\d,]+)<\/strong>/); if (p) price = +p[1].replace(/,/g,''); }
    let mall = '';
    const mm = block.match(/<p class="mall_icon">[\s\S]*?alt="([^"]*)"/);
    if (mm) mall = decodeEnt(mm[1]);
    let mallCount = null;
    if (catalog) { const c = block.match(/(\d+)\s*몰/); if (c) mallCount = +c[1]; mall = '다나와 묶음' + (mallCount ? ' ' + mallCount + '몰' : ''); }
    let ship = null;
    const sh = block.match(/<span class="ship_sect"[^>]*>([\s\S]*?)<\/span>/);   // "무료배송" 또는 "배송비 <strong>4,000원</strong>"
    if (sh) { const t = stripTags(sh[1]); if (/무료/.test(t)) ship = 0; else { const n = t.match(/([\d,]+)\s*원/); if (n) ship = +n[1].replace(/,/g,''); } }
    const date = (block.match(/<span class="meta_item mt_date">([^<]*)</) || [,''])[1].trim();
    items.push({
      title: stripTags(nameM[2]), href: decodeEnt(nameM[1]), mall, price, ship, catalog, mallCount, date,
      ad: /loadingBridgePowerShopping|adKeyword=/.test(block),
    });
  }
  return items;
}

/** 다나와 새 화면 구조: 서버가 뽑아준 압축 목록 [{t,seq,name,price,ship,link,mall,date,shop}] -> 상품 배열 (t=1 몰 묶음, t=3 개별 판매처) */
function fromCompact(list){
  return (list || []).filter(x => x && x.name).map(x => ({
    title: stripTags(x.name), href: x.link || '', price: x.price == null ? null : +x.price, ship: x.ship == null ? null : +x.ship,
    catalog: +x.t === 1, mallCount: x.shop ? +x.shop : null, date: x.date || '', ad: false,
    mall: +x.t === 1 ? '다나와 묶음' + (x.shop ? ' ' + x.shop + '몰' : '') : (x.mall || ''),
  }));
}

const median = a => { if (!a.length) return null; const s = a.slice().sort((x,y)=>x-y); const k = s.length >> 1; return s.length % 2 ? s[k] : Math.round((s[k-1]+s[k])/2); };

/** 상품 배열 -> 같은 상품 판정. tier: full(색상까지 일치) / part(색상 다르거나 불명) / loose(품번 앞부분만) / none */
function classify(items, code){
  const kept = [], excluded = [];
  for (const it of items) {
    const tn = normCode(it.title);
    it.eff = it.price != null ? it.price + (it.ship || 0) : null;
    it.shipUnknown = it.ship == null && !it.catalog;
    it.parallel = PARALLEL.test(it.title);
    it.tier = (code.fullN && tn.includes(code.fullN)) ? 'full' : (code.baseN && tn.includes(code.baseN)) ? 'part' : (code.firstN && code.firstN.length >= 5 && tn.includes(code.firstN)) ? 'loose' : 'none';
    let why = '';
    if (it.price == null || it.price < 1000) why = '가격 정보 없음';
    else if (USED.test(it.title)) why = '중고·리퍼';
    else if (BUNDLE.test(it.title)) why = '묶음·세트 상품';
    else if (it.tier === 'none') why = '품번 불일치';
    else if (it.tier === 'loose') why = '품번 앞부분만 일치';
    (why ? excluded : kept).push(why ? { it, why } : it);
  }
  // 가격 이상치 (4건 이상일 때만): 중앙값의 0.4배 미만 / 3배 초과
  let list = kept;
  if (list.length >= 4) {
    const med = median(list.map(x => x.eff));
    list = [];
    for (const x of kept) { if (x.eff < med * 0.4) excluded.push({ it: x, why: '가격 이상치(중앙값의 40% 미만)' }); else if (x.eff > med * 3) excluded.push({ it: x, why: '가격 이상치(중앙값의 3배 초과)' }); else list.push(x); }
  }
  // 중복 합치기: 같은 상품명·같은 가격 (SSG·신세계몰·이마트처럼 한 상품이 여러 몰에 올라온 것)
  const seen = new Map(), uniq = [];
  for (const x of list) {
    const k = normCode(x.title) + '|' + x.price;
    if (seen.has(k)) { const f = seen.get(k); if (!f.malls.includes(x.mall)) f.malls.push(x.mall); continue; }
    x.malls = [x.mall]; seen.set(k, x); uniq.push(x);
  }
  uniq.sort((a, b) => a.eff - b.eff);

/* ---------- 저장소 (IndexedDB) — 대기열·결과를 이 브라우저에 보관 ---------- */
const DB = { db: null, ok: false };
function idbOpen(){
  return new Promise(res => {
    try {
      const r = indexedDB.open('pc_v2', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('tasks', { keyPath: 'key' }); d.createObjectStore('results', { keyPath: 'key' }); };
      r.onsuccess = () => { DB.db = r.result; DB.ok = true; res(true); };
      r.onerror = () => res(false); r.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
}
function idbRun(stores, fn){
  return new Promise(res => {
    if (!DB.ok) return res(false);
    try { const tx = DB.db.transaction(stores, 'readwrite'); fn(tx); tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false); } catch (e) { res(false); }
  });
}
const idbPut = (store, val) => idbRun(store, tx => { tx.objectStore(store).put(val); });
const idbPutMany = (store, arr) => idbRun(store, tx => { const os = tx.objectStore(store); arr.forEach(v => os.put(v)); });
const idbDel = key => idbRun(['tasks', 'results'], tx => { tx.objectStore('tasks').delete(key); tx.objectStore('results').delete(key); });
const idbClear = () => idbRun(['tasks', 'results'], tx => { tx.objectStore('tasks').clear(); tx.objectStore('results').clear(); });
const idbGet = (store, key) => new Promise(res => { if (!DB.ok) return res(null); try { const r = DB.db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } });
const idbAll = store => new Promise(res => { if (!DB.ok) return res([]); try { const r = DB.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); } catch (e) { res([]); } });

/* ---------- 서버 ---------- */
async function fetchHtml(q, force, onWait){
  for (let tries = 0; tries < 8; tries++) {
    if (S.paused) { const e = new Error('일시정지'); e.paused = true; throw e; }
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'fetch', actor: AUTH.id, q, force: !!force }) });
    const j = await res.json();
    if (j.ok) return j;
    if (j.busy) { onWait && onWait('다른 조회가 진행 중이에요. 잠시 기다립니다…'); await sleep((j.retry_after || 6) * 1000); continue; }
    const e = new Error(j.error || '조회 실패'); e.blocked = !!j.blocked; e.cap = !!j.cap; e.retry_after = j.retry_after || 0; throw e;
  }
  throw new Error('서버가 계속 바빠요.');
}

/** 한 품번 조회: 검색어 후보를 순서대로 시도해서 같은 상품이 처음 잡히는 검색어에서 멈춘다. */
async function lookup(entry, force, onMsg){
  const code = extractCode(entry.input);
  const queries = entry.customQuery ? [entry.customQuery] : code.queries;
  let best = null;
  for (let qi = 0; qi < queries.length; qi++) {
    const q = queries[qi];
    onMsg && onMsg(`「${q}」 조회 중…`);
    const r = await fetchHtml(q, force, onMsg);
    const items = (r.items && r.items.length) ? fromCompact(r.items) : parseItems(r.html);
    const cls = classify(items, code);
    const hit = cls.full.length + cls.part.length;
    const cand = { q, cached: r.cached, fetched_at: r.fetched_at, cls, hit };
    if (!best || hit > best.hit) best = cand;
    if (hit > 0) break;
  }
  return { code, best };
}

function summarize(r){
  const prim = r.full.length ? r.full : r.part, m = minOf(prim);
  const par = minOf(prim.filter(x => x.parallel)), dom = minOf(prim.filter(x => !x.parallel));
  return { nf: r.full.length, np: r.part.length, nex: r.exCount, total: r.total, q: r.q, cached: r.cached, at: r.fetched_at,
    basis: r.full.length ? 'full' : r.part.length ? 'part' : 'none', min: m ? m.eff : null, mall: m ? (m.malls || [m.mall]).join('·') : '',
    dom: dom ? dom.eff : null, par: par ? par.eff : null, med: median(prim.map(x => x.eff)) };
}

/* ---------- 대기열 ---------- */
function addLines(items){
  let added = 0, merged = 0, skipped = 0; const touched = new Map();
  for (const it of items) {
    const input = String(it.input == null ? '' : it.input).trim();
    if (!input) { skipped++; continue; }
    const code = extractCode(input), key = code.fullN || normCode(input);
    if (!key) { skipped++; continue; }
    let t = S.tasks.get(key);
    if (t) { t.rows.push({ no: it.no, input, src: it.src || '' }); merged++; touched.set(key, t); continue; }
    t = { key, seq: ++S.seq, input, label: code.tokens.join(' '), rows: [{ no: it.no, input, src: it.src || '' }], status: 'wait', sum: null };
    S.tasks.set(key, t); S.order.push(key); S.queue.push(key); added++; touched.set(key, t);
  }
  idbPutMany('tasks', Array.from(touched.values()));
  return { added, merged, skipped };
}
async function sleepPausable(sec, label){
  const end = Date.now() + sec * 1000;
  while (Date.now() < end && !S.paused) { setMsg(label(Math.ceil((end - Date.now()) / 1000)), true); await sleep(1000); }
}
async function processTask(t){
  t.status = 'run'; S.cur = t; S.detail.delete(t.key); updateAll();
  for (;;) {
    try {
      const { code, best } = await lookup({ input: t.input, customQuery: t.customQuery }, t.force, m => setMsg(`${t.label} · ${m}`));
      const r = { key: t.key, input: t.input, code: { tokens: code.tokens, base: code.base, queries: code.queries }, q: best.q, cached: best.cached, fetched_at: best.fetched_at,
        full: best.cls.full, part: best.cls.part, excluded: best.cls.excluded.slice(0, 60), exCount: best.cls.excluded.length, total: best.cls.total };
      t.sum = summarize(r); t.status = 'done'; t.error = ''; t.force = false; t.tries = 0;
      if (!DB.ok) S.memRes.set(t.key, r);
      await idbPut('results', r); await idbPut('tasks', t);
      S.cur = null; return;
    } catch (e) {
      if (e.paused) { t.status = 'wait'; S.queue.unshift(t.key); S.cur = null; idbPut('tasks', t); return; }
      if (e.blocked) {
        await sleepPausable((e.retry_after || 1800) + 5, s => `다나와가 접근을 막아서 쉬는 중이에요. ${fmtDur(s)} 뒤 자동으로 이어갑니다.`);
        if (S.paused) { t.status = 'wait'; S.queue.unshift(t.key); S.cur = null; idbPut('tasks', t); return; }
        continue;
      }
      if (e.cap) { S.paused = true; t.status = 'wait'; S.queue.unshift(t.key); S.cur = null; idbPut('tasks', t); setMsg('오늘 조회 한도에 도달했어요. 남은 품번은 저장돼 있어요 — 내일 「이어서 조회」를 눌러주세요.', true); return; }
      t.tries = (t.tries || 0) + 1;
      if (t.tries < 3) { await sleepPausable(15, s => `연결 오류 — ${s}초 뒤 다시 시도해요. (${e.message || e})`); if (S.paused) { t.status = 'wait'; S.queue.unshift(t.key); S.cur = null; return; } continue; }
      t.status = 'error'; t.error = e.message || String(e); S.cur = null; idbPut('tasks', t); return;
    }
  }
}
async function pump(){
  if (S.running) return;
  S.running = true; S.paused = false; updateAll();
  while (!S.paused) {
    const key = S.queue.shift(); if (key === undefined) break;
    const t = getTask(key); if (!t || t.status === 'done') continue;
    await processTask(t);
    updateAll();
  }
  S.running = false;
  if (!S.paused) setMsg(counts().err ? '조회를 마쳤어요. 실패한 건은 「실패 다시 시도」로 이어갈 수 있어요.' : '조회를 모두 마쳤어요.');
  updateAll();
}
function pause(){ S.paused = true; setMsg('지금 건까지 마치고 멈춥니다…'); updateQueueUI(); }
function retryErrors(){
  let n = 0;
  for (const k of S.order) { const t = getTask(k); if (t.status === 'error') { t.status = 'wait'; t.tries = 0; S.queue.push(k); idbPut('tasks', t); n++; } }
  if (n) { toast(`실패 ${n}건을 다시 대기열에 넣었어요.`); pump(); }
}

/* ---------- 집계 ---------- */
function counts(){
  const c = { all: S.tasks.size, rows: 0, wait: 0, run: 0, done: 0, err: 0, hit: 0, partOnly: 0, none: 0 };
  for (const t of S.tasks.values()) {
    c.rows += t.rows.length;
    if (t.status === 'wait') c.wait++; else if (t.status === 'run') c.run++; else if (t.status === 'error') c.err++;
    else if (t.status === 'done') { c.done++; if (t.sum.nf) c.hit++; else if (t.sum.np) c.partOnly++; else c.none++; }
  }
  return c;
}
const FILTERS = [['all','전체'], ['hit','정확 일치'], ['partOnly','색상 다른 것만'], ['none','같은 상품 없음'], ['pending','대기·조회 중'], ['error','실패']];
function passes(t, f){
  if (f === 'all') return true;
  if (f === 'pending') return t.status === 'wait' || t.status === 'run';
  if (f === 'error') return t.status === 'error';
  if (t.status !== 'done') return false;
  return f === 'hit' ? t.sum.nf > 0 : f === 'partOnly' ? (t.sum.nf === 0 && t.sum.np > 0) : (t.sum.nf === 0 && t.sum.np === 0);
}
function filtered(){
  const q = S.q.trim().toLowerCase(), nq = normCode(q).toLowerCase(), out = [];
  for (const k of S.order) {
    const t = getTask(k); if (!t || !passes(t, S.filter)) continue;
    if (q && !((nq && t.key.toLowerCase().includes(nq)) || t.input.toLowerCase().includes(q) || t.label.toLowerCase().includes(q))) continue;
    out.push(t);
  }
  return out;
}

/* ---------- 엑셀 올리기 ---------- */
async function onFile(f){
  try {
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    if (!aoa.length) return toast('파일에 내용이 없어요.', 'err');
    const first = (aoa[0] || []).map(c => String(c).trim());
    const NAME = /품번|상품명|품목명|제품명|상품코드|스타일|style|code|name/i;
    let col = first.findIndex(h => NAME.test(h)), hasHeader = col >= 0;
    if (col < 0) { col = 0; hasHeader = !first.some(c => /\d/.test(c)); }
    const width = aoa.reduce((m, r) => Math.max(m, r.length), 0);
    S.pending = { name: f.name, aoa, first, col, hasHeader, width };
    renderPending();
  } catch (e) { toast('파일을 읽지 못했어요: ' + (e.message || e), 'err'); }
}

    if (v) out.push({ no: i + 1, input: v, src: P.name });

}

    <div class="row"><button class="btn btn-pri" data-act="pvAdd" ${items.length ? '' : 'disabled'}>${items.length.toLocaleString()}줄 대기열에 추가</button><button class="btn btn-out" data-act="pvCancel">취소</button></div></div>`;

      ${live ? '<button class="btn btn-out" data-act="pause">일시정지</button>' : (remain ? '<button class="btn btn-pri" data-act="resume">이어서 조회</button>' : '')}
      ${c.err ? '<button class="btn btn-out" data-act="retryErr">실패 다시 시도</button>' : ''}
      <button class="btn btn-out" data-act="xlsAll" ${c.done ? '' : 'disabled'}>엑셀로 받기 (전체)</button>
      <button class="btn btn-out" data-act="xlsFlt" ${c.done ? '' : 'disabled'} title="아래 목록에서 지금 선택한 필터·검색 결과만">엑셀로 받기 (지금 목록)</button>
      <span class="grow"></span>
      <button class="btn btn-out btn-sm" data-act="clear">모두 지우기</button>
    </div>` : `<div class="hint" style="text-align:center;padding:10px;">아직 올린 품번이 없어요. 위에 붙여 넣거나 엑셀 파일을 올려주세요.</div>`;
}

/* ---------- 목록 ---------- */
let listTimer = null;
function scheduleList(){ if (listTimer) return; listTimer = setTimeout(() => { listTimer = null; renderList(); }, 1200); }
function updateAll(){ updateQueueUI(); scheduleList(); }

function chipFor(t){
  if (t.status === 'wait') return '<span class="chip gray">대기</span>';
  if (t.status === 'run') return '<span class="chip blue"><span class="spin"></span>조회 중</span>';
  if (t.status === 'error') return `<span class="chip bad" title="${esc(t.error)}">실패</span>`;
  const s = t.sum;
  return s.nf ? `<span class="chip ok">정확 ${s.nf}건</span>` : s.np ? `<span class="chip warn">색상 다른 ${s.np}건</span>` : '<span class="chip bad">없음</span>';
}
function listRow(t){
  const s = t.sum, open = S.open.has(t.key), done = t.status === 'done';
  const dim = done && s.basis === 'part' ? ' dim' : '';
  const same = t.input.replace(/\s+/g, ' ') === t.label;
  const og = same ? '' : `<div class="og">${esc(t.input.length > 70 ? t.input.slice(0, 70) + '…' : t.input)}</div>`;
  const no = t.rows.length > 1 ? `${t.rows.length}줄` : esc(t.rows[0].no);
  return `<tr data-key="${esc(t.key)}" tabindex="0" class="${open ? 'open' : ''}" aria-expanded="${open}">
    <td class="hm" style="color:var(--sub);white-space:nowrap">${no}</td>
    <td><div class="cd">${esc(t.label)}</div>${og}</td>
    <td class="r c${dim}">${done && s.min != null ? won(s.min) : '-'}</td>
    <td class="r hm${done && s.dom != null ? '' : ' dim'}">${done && s.dom != null ? won(s.dom) : '-'}</td>
    <td class="r hm${done && s.par != null ? '' : ' dim'}">${done && s.par != null ? won(s.par) : '-'}</td>
    <td>${chipFor(t)}</td></tr>
    ${open ? `<tr class="exp"><td colspan="6"><div id="exp_${esc(t.key)}">${S.detail.get(t.key) || '<div class="hint" style="padding:14px">불러오는 중…</div>'}</div></td></tr>` : ''}`;
}
function renderList(){
  const box = $('listbox'); if (!box) return;
  const c = counts();
  if (!c.all) { box.innerHTML = ''; return; }
  const cnt = { all: c.all, hit: c.hit, partOnly: c.partOnly, none: c.none, pending: c.wait + c.run, error: c.err };
  const list = filtered(), pages = Math.max(1, Math.ceil(list.length / PAGE));
  if (S.page >= pages) S.page = pages - 1;
  const slice = list.slice(S.page * PAGE, (S.page + 1) * PAGE);
  const focusSearch = document.activeElement && document.activeElement.id === 'srch';
  box.innerHTML = `
    <div class="tools">
      <div class="seg" role="group" aria-label="목록 필터">${FILTERS.map(([k, n]) => `<button data-f="${k}" class="${S.filter === k ? 'on' : ''}" aria-pressed="${S.filter === k}">${n}<b>${(cnt[k] || 0).toLocaleString()}</b></button>`).join('')}</div>
      <input type="search" id="srch" placeholder="품번·상품명 검색" value="${esc(S.q)}" aria-label="목록 검색">
      <span class="hint">행을 누르면 상세가 펼쳐져요.</span>
    </div>
    <div class="lst">
      <table class="l"><thead><tr><th class="hm">줄</th><th>품번</th><th class="r">최저가(합계)</th><th class="r hm">국내 표기 최저</th><th class="r hm">해외·병행 최저</th><th>상태</th></tr></thead>
      <tbody>${slice.length ? slice.map(listRow).join('') : '<tr><td colspan="6"><div class="empty">조건에 맞는 품번이 없어요.</div></td></tr>'}</tbody></table>
      ${pages > 1 ? `<div class="pager"><button class="btn btn-out btn-sm" data-pg="-1" ${S.page <= 0 ? 'disabled' : ''}>이전</button>${S.page + 1} / ${pages}쪽 (${list.length.toLocaleString()}개)<button class="btn btn-out btn-sm" data-pg="1" ${S.page >= pages - 1 ? 'disabled' : ''}>다음</button></div>` : ''}
    </div>`;
  if (focusSearch) { const e = $('srch'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); }
  slice.forEach(t => { if (S.open.has(t.key) && !S.detail.has(t.key)) loadDetail(t); });
}
async function loadDetail(t){
  let html;
  if (t.status === 'done') {
    const r = await getResult(t.key);
    html = r ? cardHtml(Object.assign({ id: t.key, status: 'done' }, r)) : '<div class="note bad" style="margin:14px">저장된 결과를 찾지 못했어요. 「이 검색어로 다시 조회」를 눌러주세요.</div>' + footHtml({ id: t.key, q: t.sum && t.sum.q, input: t.input });
  } else if (t.status === 'error') html = `<div class="res-b"><div class="note bad">${esc(t.error)}</div></div>` + footHtml({ id: t.key, input: t.input, code: { queries: extractCode(t.input).queries } });
  else html = '<div class="hint" style="padding:14px">아직 조회 전이에요. 차례가 되면 자동으로 조회해요.</div>' + footHtml({ id: t.key, input: t.input, code: { queries: extractCode(t.input).queries } });
  S.detail.set(t.key, html);
  const el = document.getElementById('exp_' + t.key); if (el) el.innerHTML = html;
}

/* ---------- 상세 카드 (펼침) ---------- */
function ladderHtml(r){
  const pts = r.full.map(x => ({ x, k: x.parallel ? 'par' : '' })).concat(r.part.map(x => ({ x, k: 'part' })));
  if (pts.length < 2) return '';
  const vals = pts.map(p => p.x.eff), lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(hi - lo, 1);
  const pos = v => (4 + (v - lo) / span * 92).toFixed(2);
  const med = median((r.full.length ? r.full : r.part).map(x => x.eff));
  const minV = (r.full.length ? r.full : r.part)[0].eff;
  const dots = pts.map((p, i) => `<span class="dot ${p.k}${p.x.eff === minV && p.k !== 'part' ? ' min' : ''}" style="left:${pos(p.x.eff)}%;top:${28 + (i % 3 - 1) * 15}px" title="${esc(p.x.mall)} ${won(p.x.eff)}${p.k==='part'?' (색상 다르거나 불명)':''}"></span>`).join('');
  const lab = (v, t, edge) => `<span class="tl" style="left:${pos(v)}%;top:${edge}px">${t}</span>`;
  return `<div class="legend"><span><i></i>정확 일치(국내 표기)</span><span><i class="par"></i>정확 일치(해외·병행 표기)</span><span><i class="part"></i>색상 다르거나 불명</span></div>
    <div class="ladder" role="img" aria-label="가격 분포: 최저 ${won(lo)}, 최고 ${won(hi)}"><div class="axis"></div>
      <span class="tick" style="left:${pos(med)}%"></span>${lab(med, '중앙값 ' + won(med), 54)}
      ${dots}${lab(lo, won(lo), 0)}${hi !== lo ? lab(hi, won(hi), 0) : ''}</div>`;
}
function dRow(x, isMin){
  const mallTxt = x.malls && x.malls.length > 1 ? x.malls.join('·') : x.mall;
  const shipTxt = x.catalog ? '-' : x.ship == null ? '확인필요' : x.ship === 0 ? '무료' : won(x.ship);
  return `<tr class="${isMin ? 'min' : ''}"><td>${esc(mallTxt)}</td><td class="ti"><a href="${esc(x.href)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.parallel ? '<span class="tag par">해외·병행</span>' : ''}${x.ad ? '<span class="tag ad">광고</span>' : ''}${x.catalog ? '<span class="tag cat">몰 묶음 최저가</span>' : ''}</td><td class="r">${won(x.price)}</td><td class="r">${shipTxt}</td><td class="r"><b>${won(x.eff)}</b></td></tr>`;
}
const tableHead = '<table class="t"><thead><tr><th>판매처</th><th>상품명</th><th class="r">판매가</th><th class="r">배송비</th><th class="r">합계</th></tr></thead><tbody>';
function cardHtml(r){
  const nf = r.full.length, np = r.part.length;
  const prim = nf ? r.full : r.part, primLabel = nf ? '정확 일치 최저가' : '최저가(색상 불명)';
  const exN = r.exCount != null ? r.exCount : r.excluded.length;
  const chip = nf ? `<span class="chip ok">정확 일치 ${nf}건</span>` : np ? `<span class="chip warn">색상 다른 ${np}건만</span>` : `<span class="chip bad">같은 상품 없음</span>`;
  const head = `<div class="res-h"><div class="main"><div class="code">${esc(r.code.tokens.join(' '))}</div><div class="orig">${r.input && r.input !== r.code.tokens.join(' ') ? esc(r.input) : ''}</div></div>${chip}</div>`;
  let body = '';
  if (!prim.length) {
    body = `<div class="note bad">다나와에서 같은 품번의 상품을 찾지 못했어요. (검색 ${r.total}건 중 ${exN}건 제외) 아래에서 검색어를 바꿔 다시 조회하거나 「다나와에서 보기」로 확인해보세요.</div>`;
  } else {
    const m = prim[0];
    const parMin = minOf(prim.filter(x => x.parallel)), domMin = minOf(prim.filter(x => !x.parallel));
    const med = median(prim.map(x => x.eff));
    body = `<div class="figs">
      <div class="fig"><div class="lab">${primLabel} (배송비 포함)</div><div class="num">${m.eff.toLocaleString('ko-KR')}<small>원</small></div><div class="sub">${esc(m.malls ? m.malls.join('·') : m.mall)}</div></div>
      <div class="fig sm"><div class="lab">국내 표기 최저</div><div class="num ${domMin ? '' : 'dim'}">${domMin ? won(domMin.eff) : '없음'}</div></div>
      <div class="fig sm"><div class="lab">해외·병행 표기 최저</div><div class="num ${parMin ? '' : 'dim'}">${parMin ? won(parMin.eff) : '없음'}</div></div>
      <div class="fig sm"><div class="lab">중앙값 · 건수</div><div class="num">${won(med)} · ${prim.length}건</div></div></div>`;
    if (!nf) body += `<div class="note warn">색상까지 같은 상품은 없고, <b>품번은 같은데 색상이 다르거나 표기가 없는</b> 상품만 있어요. 이 가격을 그대로 쓰면 안 돼요.</div>`;
    else if (np) body += `<div class="note info">같은 품번의 <b>다른 색상·표기 ${np}건</b>은 가격 계산에서 뺐어요(아래에서 확인).</div>`;
    if (prim.length < 3) body += `<div class="note warn">비교할 건수가 ${prim.length}건뿐이라 신뢰하기 어려워요.</div>`;
    if (prim.some(x => x.shipUnknown)) body += `<div class="note warn">배송비를 읽지 못한 상품이 있어요(합계에 0원으로 계산). 「다나와에서 보기」로 확인하세요.</div>`;
    body += ladderHtml(r);
    body += tableHead + prim.slice(0, 5).map((x, i) => dRow(x, i === 0)).join('') + '</tbody></table>';
    if (prim.length > 5) body += `<details class="fold"><summary>나머지 ${prim.length - 5}건 보기</summary>${tableHead}${prim.slice(5).map(x => dRow(x, false)).join('')}</tbody></table></details>`;
  }
  if (nf && np) body += `<details class="fold"><summary>색상 다르거나 표기 없는 ${np}건 (가격 계산 제외)</summary>${tableHead}${r.part.map(x => dRow(x, false)).join('')}</tbody></table></details>`;
  if (r.excluded.length) {
    const why = {}; r.excluded.forEach(e => why[e.why] = (why[e.why] || 0) + 1);
    body += `<details class="fold"><summary>제외한 ${exN}건${exN > r.excluded.length ? ` (앞의 ${r.excluded.length}건만 저장)` : ''} — ${Object.keys(why).map(k => k + ' ' + why[k]).join(' · ')}</summary><table class="t"><tbody>${r.excluded.map(e => `<tr><td style="white-space:nowrap">${esc(e.it.mall || '')}</td><td class="ti"><a href="${esc(e.it.href)}" target="_blank" rel="noopener">${esc(e.it.title)}</a></td><td class="r">${won(e.it.price)}</td><td><span class="chip gray">${esc(e.why)}</span></td></tr>`).join('')}</tbody></table></details>`;
  }
  const meta = `<div class="hint" style="margin-top:10px;">검색어 「${esc(r.q)}」 · 다나와 ${r.total}건 중 ${nf + np}건 사용 · ${r.cached ? '저장된 결과' : '새로 조회'} ${fmtTime(r.fetched_at)}</div>`;
  return `<div class="res">${head}<div class="res-b">${body}${meta}</div>${footHtml(r)}</div>`;
}
function footHtml(r){
  const q = r.q || (r.code && r.code.queries && r.code.queries[0]) || r.input;
  return `<div class="res-f" data-id="${esc(r.id)}"><input type="text" value="${esc(q)}" aria-label="검색어" data-act="q"><button class="btn btn-out btn-sm" data-act="requery">이 검색어로 다시 조회</button><button class="btn btn-out btn-sm" data-act="force" title="저장된 결과가 10분 넘었을 때만 새로 받아와요">새로 받기</button><a class="btn btn-out btn-sm" style="text-decoration:none" href="${esc(searchUrl(q))}" target="_blank" rel="noopener">다나와에서 보기</a><button class="btn btn-out btn-sm" data-act="del">삭제</button></div>`;
}

/* ---------- 엑셀 받기 ---------- */
async function exportXlsx(scope){
  const tasks = (scope === 'filtered' ? filtered() : S.order.map(getTask)).filter(Boolean);
  if (!tasks.some(t => t.status === 'done')) return toast('받을 결과가 아직 없어요.', 'err');
  setMsg('엑셀 파일을 만드는 중…');
  const resMap = new Map();
  if (DB.ok) (await idbAll('results')).forEach(r => resMap.set(r.key, r)); else S.memRes.forEach((r, k) => resMap.set(k, r));
  const stText = { wait: '대기', run: '조회 중', error: '실패', done: '' };
  const sum = [['원본 행','입력','품번','상태','정확 일치 건수','색상 다른 건수','제외 건수','최저가(합계)','최저가 기준','국내 표기 최저','해외·병행 표기 최저','중앙값','최저가 판매처','검색어','조회 시각','출처 파일']];
  const det = [['품번','구분','판매처','상품명','판매가','배송비','합계','해외·병행 표기','광고','링크']];
  const exc = [['품번','판매처','상품명','판매가','제외 사유','링크']];
  for (const t of tasks) {
    const s = t.sum, done = t.status === 'done';
    const state = done ? (s.nf ? '정확 일치' : s.np ? '색상 다른 것만' : '같은 상품 없음') : (stText[t.status] + (t.status === 'error' ? ': ' + (t.error || '') : ''));
    for (const row of t.rows) {
      sum.push([row.no, row.input, t.label, state, done ? s.nf : '', done ? s.np : '', done ? s.nex : '', done && s.min != null ? s.min : '', done ? (s.basis === 'full' ? '정확 일치' : s.basis === 'part' ? '색상 불명' : '') : '',
        done && s.dom != null ? s.dom : '', done && s.par != null ? s.par : '', done && s.med != null ? s.med : '', done ? s.mall : '', done ? s.q : '', done ? new Date(s.at * 1000).toLocaleString('ko-KR') : '', row.src]);
    }
    const r = resMap.get(t.key); if (!r) continue;
    const push = (x, tag) => det.push([t.label, tag, (x.malls || [x.mall]).join('·'), x.title, x.price, x.ship == null ? '' : x.ship, x.eff, x.parallel ? 'Y' : '', x.ad ? 'Y' : '', x.href]);
    r.full.forEach(x => push(x, '정확 일치')); r.part.forEach(x => push(x, '색상 다르거나 불명'));
    r.excluded.forEach(e => exc.push([t.label, e.it.mall, e.it.title, e.it.price == null ? '' : e.it.price, e.why, e.it.href]));
  }
  const wb = XLSX.utils.book_new();
  const add = (aoa, name, wch) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = wch.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(sum, '요약', [8,44,24,14,10,10,8,13,11,13,15,13,18,22,18,20]);
  add(det, '상세', [24,16,14,56,11,9,11,12,6,40]);
  add(exc, '제외', [24,14,56,11,26,40]);
  const d = new Date();
  XLSX.writeFile(wb, `최저가조회_${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.xlsx`);
  setMsg(`엑셀로 저장했어요. (${sum.length - 1}줄)`);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async ev => {
  const g = ev.target.closest('[data-act],[data-f],[data-pg],tr[data-key]'); if (!g) return;
  if (ev.target.closest('a')) return;
  if (g.dataset.f) { S.filter = g.dataset.f; S.page = 0; return renderList(); }
  if (g.dataset.pg) { S.page += +g.dataset.pg; return renderList(); }
  const act = g.dataset.act;
  if (g.matches('tr[data-key]') && !act) { const k = g.dataset.key; if (S.open.has(k)) S.open.delete(k); else S.open.add(k); return renderList(); }
  if (act === 'add') { const lines = $('lines').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); if (!lines.length) return toast('품번을 한 줄 이상 입력해주세요.', 'err'); doAdd(lines.map((s, i) => ({ no: i + 1, input: s, src: '붙여넣기' })), '붙여넣기'); $('lines').value = ''; return; }
  if (act === 'pvAdd') { const P = S.pending; if (!P) return; const items = pendingItems(); S.pending = null; renderPending(); return doAdd(items, P.name); }
  if (act === 'pvCancel') { S.pending = null; return renderPending(); }
  if (act === 'pause') return pause();
  if (act === 'resume') { S.paused = false; setMsg(''); return pump(); }
  if (act === 'retryErr') return retryErrors();
  if (act === 'xlsAll') return exportXlsx('all');
  if (act === 'xlsFlt') return exportXlsx('filtered');
  if (act === 'clear') {
    if (!confirm('올려 둔 품번과 조회 결과를 모두 지울까요? (되돌릴 수 없어요)')) return;
    S.paused = true; S.queue = []; S.tasks.clear(); S.order = []; S.open.clear(); S.detail.clear(); S.memRes.clear(); S.cur = null; await idbClear(); S.running = false; S.paused = false; setMsg('');
    return updateAll();
  }
  const bar = g.closest('.res-f'); if (!bar) return;
  const t = getTask(bar.dataset.id); if (!t) return;
  if (act === 'del') { S.tasks.delete(t.key); S.order = S.order.filter(k => k !== t.key); S.queue = S.queue.filter(k => k !== t.key); S.open.delete(t.key); S.detail.delete(t.key); S.memRes.delete(t.key); await idbDel(t.key); return updateAll(); }
  if (act === 'requery' || act === 'force') {
    const q = bar.querySelector('input').value.trim(); if (!q) return toast('검색어를 입력해주세요.', 'err');
    t.customQuery = q; t.force = act === 'force'; t.status = 'wait'; t.tries = 0; S.detail.delete(t.key);
    S.queue = S.queue.filter(k => k !== t.key); S.queue.unshift(t.key); await idbPut('tasks', t);
    updateAll(); if (!S.running) pump();
  }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr[data-key]')) { ev.preventDefault(); ev.target.click(); } });
let srchTimer = null;
document.addEventListener('input', ev => { if (ev.target.id === 'srch') { clearTimeout(srchTimer); srchTimer = setTimeout(() => { S.q = ev.target.value; S.page = 0; renderList(); }, 250); } });
window.addEventListener('beforeunload', ev => { if (S.running && !S.paused && S.queue.length) { ev.preventDefault(); ev.returnValue = ''; } });

/* ---------- 시작: 지난번 대기열 불러오기 ---------- */
(async function start(){
  render();
  if (!AUTH) return;
  await idbOpen();
  if (!DB.ok) setMsg('이 브라우저에서는 조회 결과를 저장할 수 없어요(시크릿 모드 등). 창을 닫으면 사라지니 엑셀로 받아 두세요.', true);
  const tasks = await idbAll('tasks');
  tasks.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  for (const t of tasks) {
    S.seq = Math.max(S.seq, t.seq || 0);
    if (t.status === 'run') t.status = 'wait';
    S.tasks.set(t.key, t); S.order.push(t.key); if (t.status === 'wait') S.queue.push(t.key);
  }
  updateAll();
  if (S.queue.length) { setMsg(`지난번에 남은 ${S.queue.length.toLocaleString()}건을 이어서 조회합니다.`); pump(); }
})();
window.__pc = { extractCode, parseItems, fromCompact, classify, normCode, S, addLines };   // 점검용 훅
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 대시보드</title>
<style>
  /* ============================================================
     스타일 교체 지점: 색·글꼴·모서리는 아래 변수만 바꾸면 전체가 바뀐다.
     (구조/데이터는 아래 TEAM, FLOWS, RULES 배열에 분리되어 있음)
     ============================================================ */
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --border:#DBD5C7;
    --ink:#20241F; --ink-muted:#5C6259;
    --accent:#2F5D53; --accent-ink:#FFFFFF; --accent-soft:#E3ECE8;
    --warn:#B4791B; --warn-soft:#F7E9D2;
    --radius:10px;
    --font-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141917; --surface:#1B211E; --border:#2E3833;
      --ink:#EAEEEA; --ink-muted:#93A099;
      --accent:#6BBFA8; --accent-ink:#0B1512; --accent-soft:#1E332C;
      --warn:#E3A54B; --warn-soft:#3A2D14;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.6}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 20px 56px}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:15px;margin:36px 0 12px;letter-spacing:-.01em}
  .lead{color:var(--ink-muted);margin:0;max-width:62ch}
  .notice{margin-top:16px;padding:10px 14px;background:var(--warn-soft);border-radius:var(--radius);font-size:13px}

  .cmd{margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .cmd-label{font-size:12px;font-weight:700;color:var(--ink-muted);margin-bottom:8px}
  .cmd-box{display:flex;gap:8px;flex-wrap:wrap}
  .cmd-box textarea{flex:1 1 360px;min-height:64px;resize:vertical;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  .btn{font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cmd-side{display:flex;flex-direction:column;gap:8px}
  .teams-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .pick{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}
  .pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
  .card h3{margin:0;font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .alias{font-size:11.5px;color:var(--ink-muted);font-weight:400}
  .role{margin:0;color:var(--ink-muted)}
  .agent{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted)}
  .ex{margin:0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:12.5px}
  .card .row{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}

  .flow{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
  .flow b{display:block;margin-bottom:4px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .step{padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12.5px}
  .arrow{color:var(--ink-muted)}
  ul.rules{margin:0;padding-left:18px}
  ul.rules li{margin:4px 0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>팀 대시보드</h1>
  <p class="lead">바이스트 AI 프로젝트팀 7명의 역할과 지시 방법입니다. 지시문을 만들어 복사한 뒤 Claude Code에서 "실장"에게 그대로 붙여넣으면 됩니다.</p>
  <div class="notice">이 화면은 팀 안내용입니다. 작업은 Claude Code 안에서 실행되며, 여기서 직접 작업을 시작하거나 진행 상황을 보여주지는 않습니다.</div>

  <section class="cmd" aria-labelledby="cmdT">
    <div class="cmd-label" id="cmdT">실장에게 내릴 지시문 만들기</div>
    <div class="cmd-box">
      <textarea id="task" placeholder="예: 바이스트키즈 신상 5개 기획해줘" aria-label="할 일"></textarea>
      <div class="cmd-side">
        <select id="brand" aria-label="브랜드">
          <option value="">브랜드 선택 안 함</option>
          <option>BUYEST</option>
          <option>BUYEST Kids</option>
        </select>
        <button class="btn" id="copy">지시문 복사</button>
      </div>
    </div>
    <div class="teams-pick" id="pick" role="group" aria-label="참여 팀 선택"></div>
    <div class="ex" id="preview" style="margin-top:10px;font-family:var(--font-mono);font-size:12.5px;padding:8px 10px;background:var(--bg);border-radius:8px"></div>
  </section>

  <h2>팀원</h2>
  <div class="grid" id="team"></div>

  <h2>기본 업무 흐름</h2>
  <div id="flows"></div>

  <h2>실장 규칙</h2>
  <ul class="rules" id="rules"></ul>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- 데이터 (정본: ~/.claude/CLAUDE.md 의 BUYEST-TEAM 블록) ---------------- */
var TEAM = [
  {name:'인스타팀', alias:'SNS팀',     agent:'buyest-sns',      role:'피드·릴스·스토리·캡션·해시태그·게시 일정', ex:'인스타팀, 이번 주 피드 캡션 3안 써줘'},
  {name:'디자인팀', alias:'콘텐츠팀',  agent:'buyest-design',   role:'릴스 콘티, 사진 연출, 상세페이지 비주얼 흐름, 카드뉴스', ex:'디자인팀, 신상 릴스 콘티 짜줘'},
  {name:'브랜드팀', alias:'브랜드 검수', agent:'buyest-brand',  role:'톤·용어·비주얼 일관성, 성인/키즈 섞임, 병행수입 표현 검수', ex:'브랜드팀, 이 문구 톤 검수해줘'},
  {name:'광고팀',   alias:'카피팀',    agent:'buyest-ad',       role:'메타·네이버·오픈마켓 광고 문구 여러 벌, A/B 테스트 설계', ex:'광고팀, 메타 광고 문구 3벌 써줘'},
  {name:'개발팀',   alias:'웹팀',      agent:'buyest-dev',      role:'카피라이터 툴, 툴킷 사이트, HTML·파이썬 업무 도구', ex:'개발팀, 툴킷에 새 도구 추가해줘'},
  {name:'보안팀',   alias:'보안 검사', agent:'buyest-security', role:'API 키·비밀번호 노출, Worker 프록시, 권한 구멍 점검', ex:'보안팀, 이 코드에 키 노출 없는지 봐줘'},
  {name:'검수팀',   alias:'품질팀',    agent:'buyest-qa',       role:'최종 판정. 증거 없으면 "아직 아님"', ex:'검수팀, 최종 판정 내려줘'}
];
var FLOWS = [
  {title:'신상 콘텐츠 기획', steps:['디자인팀 (콘티·연출)','인스타팀 (캡션·일정)','브랜드팀 검수','보고'], note:'앞 두 팀은 동시에 진행'},
  {title:'광고 집행 준비',   steps:['광고팀 (문구 3벌 이상)','브랜드팀 검수','검수팀 (근거 확인)','보고']},
  {title:'업무 도구 수정',   steps:['개발팀','보안팀','검수팀','보고']}
];
var RULES = [
  '결과물은 하나로, 목표는 한 줄로. 여러 개를 시키면 순서를 정해 하나씩 처리합니다.',
  '만든 팀과 검수하는 팀은 다르게 합니다. 같은 문제로 2번 넘게 반려되면 멈추고 사장님께 묻습니다.',
  '이미지·영상 생성(유료 도구)은 쓰기 전에 사장님께 먼저 묻습니다.',
  '게시·발송·결제·배포처럼 밖으로 나가는 일은 사장님 확인 없이 하지 않습니다.',
  '모든 대화와 결과물은 한국어입니다. 성인(BUYEST)과 키즈(BUYEST Kids) 브랜드는 섞지 않습니다.'
];

/* ---------------- 렌더 ---------------- */
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
var picked = {};   // 팀 이름 → true

function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(function(){t.classList.remove('on')},1600); }
function copyText(s){
  if(navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(s).then(function(){toast('복사했습니다')}, fallback); }
  fallback();
  function fallback(){ var ta=el('textarea'); ta.value=s; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('복사했습니다');}catch(e){toast('복사하지 못했습니다. 직접 선택해서 복사하세요');} ta.remove(); }
}

function buildCommand(){
  var task = document.getElementById('task').value.trim();
  var brand = document.getElementById('brand').value;
  var teams = TEAM.filter(function(t){return picked[t.name]}).map(function(t){return t.name});
  var s = '실장, ' + (brand ? brand + ' ' : '') + (task || '(할 일을 입력하세요)');
  if(teams.length) s += ' 참여 팀: ' + teams.join(', ') + '.';
  return s;
}
function refresh(){ document.getElementById('preview').textContent = buildCommand(); }

(function init(){
  var pick = document.getElementById('pick'), grid = document.getElementById('team');
  TEAM.forEach(function(t){
    var b = el('button','pick',t.name); b.type='button'; b.setAttribute('aria-pressed','false');
    b.addEventListener('click', function(){ picked[t.name]=!picked[t.name]; b.setAttribute('aria-pressed', picked[t.name]?'true':'false'); refresh(); });
    pick.appendChild(b);

    var c = el('article','card');
    var h = el('h3',null,t.name); h.appendChild(el('span','alias',t.alias)); c.appendChild(h);
    c.appendChild(el('p','role',t.role));
    c.appendChild(el('p','ex','“'+t.ex+'”'));
    var row = el('div','row'); row.appendChild(el('span','agent',t.agent));
    var cp = el('button','btn ghost','예시 복사'); cp.type='button'; cp.addEventListener('click', function(){ copyText(t.ex); });
    row.appendChild(cp); c.appendChild(row); grid.appendChild(c);
  });
  var fl = document.getElementById('flows');
  FLOWS.forEach(function(f){
    var d = el('div','flow'); d.appendChild(el('b',null,f.title));
    var st = el('div','steps');
    f.steps.forEach(function(s,i){ if(i) st.appendChild(el('span','arrow','→')); st.appendChild(el('span','step',s)); });
    d.appendChild(st); if(f.note) d.appendChild(el('div','alias',f.note)); fl.appendChild(d);
  });
  var ru = document.getElementById('rules'); RULES.forEach(function(r){ ru.appendChild(el('li',null,r)); });
  document.getElementById('task').addEventListener('input', refresh);
  document.getElementById('brand').addEventListener('change', refresh);
  document.getElementById('copy').addEventListener('click', function(){
    if(!document.getElementById('task').value.trim()){ toast('할 일을 먼저 입력하세요'); return; }
    copyText(buildCommand());
  });
  refresh();
})();
</script>
</body>
</html>

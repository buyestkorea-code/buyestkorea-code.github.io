<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUYEST AI TEAM</title>
<style>
  :root{
    --bg:#F6F3ED; --panel:#FFFFFF; --navy:#142E50; --ink:#24344A; --muted:#6B778A;
    --teal:#159E8F; --amber:#D99629; --red:#C74747; --blue:#3A62D1;
    --line:#E6DFD2; --soft:#EFEAE0;
    --floor:#F3EBDD;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font)}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
  .rail{background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px}
  .logo{width:48px;height:48px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:24px;margin-bottom:10px}
  .rail button{width:68px;padding:10px 4px;border:0;border-radius:12px;background:transparent;color:#C9D4E5;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
  .rail button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .rail button[aria-current="page"]{background:#2A68E0;color:#fff}
  .rail button:hover:not([aria-current="page"]){background:rgba(255,255,255,.08)}

  .main{padding:16px 20px 28px;min-width:0}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:14px}
  .title{margin:0;font-size:clamp(22px,3.2vw,34px);font-weight:900;letter-spacing:-.02em;color:var(--navy);line-height:1.15}
  .sub{color:var(--ink);font-weight:700;font-size:15px}
  .top .sp{flex:1}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
  .seg button{border:0;background:transparent;padding:8px 20px;border-radius:10px;font-weight:700;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:12.5px;font-weight:600;border:0}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
  .btn.ghost{background:#fff;color:var(--navy)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .layout{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
  .card h2{margin:0 0 10px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .card h3{margin:0 0 6px;font-size:15px}

  /* ---------- 오피스 ---------- */
  .office{position:relative;border-radius:22px;padding:14px;border:1px solid var(--line);
    background:
      linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),
      repeating-linear-gradient(0deg,transparent 0 59px,rgba(20,46,80,.045) 59px 60px),
      repeating-linear-gradient(90deg,transparent 0 59px,rgba(20,46,80,.045) 59px 60px),
      var(--floor)}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
  .cell{position:relative;min-width:0}
  .station{display:block;width:100%;padding:0;border:2px solid transparent;border-radius:20px;background:transparent;text-align:left;position:relative}
  .station:hover{background:rgba(255,255,255,.35)}
  .station[aria-pressed="true"]{border-color:#2A68E0;background:rgba(42,104,224,.07)}
  .station svg.art{display:block;width:100%;height:auto;margin-top:-2px}
  .pill{position:relative;z-index:2;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:6px 6px 0 6px}
  .name{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:4px 14px 4px 5px;font-weight:800;font-size:clamp(14px,1.5vw,19px)}
  .name .ico{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .name .ico svg{width:18px;height:18px}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:#E3E8EF;color:#46556B}
  .badge b{font-weight:800}
  .badge.teal{background:#D8F1EC;color:#0B6F64}
  .badge.amber{background:#FBEBCB;color:#8A5A07}
  .badge.red{background:#F8DADA;color:#962727}
  .badge.blue{background:#DCE6FB;color:#27489E}
  .badge.gray{background:#E9ECF1;color:#566377}
  .cnt{font-size:11.5px;color:var(--muted);font-weight:700}

  .lounge svg{display:block;width:100%;height:auto}
  .chief-board{position:absolute;left:49%;top:25%;width:46%;background:#fff;border:2px solid #AFC4EE;border-radius:12px;padding:6px 9px;font-size:clamp(10px,1.05vw,12.5px);line-height:1.35;box-shadow:0 3px 0 #C9D6F0;pointer-events:none}
  .chief-board b{display:block;margin-bottom:2px}
  .chief-board li{list-style:none;display:flex;gap:5px;align-items:center}
  .chief-board ul{margin:0;padding:0}

  .doc{position:absolute;z-index:6;width:30px;height:36px;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(20,46,80,.25))}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
  .foot{margin-top:10px;font-size:12px;color:var(--muted);text-align:right}

  /* ---------- 오른쪽 패널 ---------- */
  .side{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 150px);overflow:auto;padding-right:2px}
  .steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .steps li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg)}
  .steps li[data-s="working"],.steps li[data-s="reviewing"]{background:#DFF3EF}
  .steps li[data-s="changes_requested"],.steps li[data-s="blocked"]{background:#FBEBCB}
  .steps .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:#fff;border:2px solid #C5CCD8;flex:none}
  .steps li[data-s="completed"] .dot{background:var(--teal);border-color:var(--teal);color:#fff}
  .steps li[data-s="working"] .dot,.steps li[data-s="reviewing"] .dot{border-color:var(--teal);color:var(--teal)}
  .steps li[data-s="changes_requested"] .dot,.steps li[data-s="blocked"] .dot{border-color:var(--amber);color:var(--amber)}
  .steps small{display:block;color:var(--muted)}
  textarea,select,input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
  textarea{min-height:68px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .row>*{flex:1 1 auto}
  .msg{font-size:12.5px;margin-top:6px;color:var(--muted)}
  .msg.err{color:var(--red)}
  .feed{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
  .feed li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:7px 4px;border-bottom:1px solid var(--soft);font-size:13px}
  .feed time{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .feed .t-amber{color:#8A5A07}.feed .t-red{color:#962727}.feed .t-teal{color:#0B6F64}.feed .t-blue{color:#27489E}
  .empty{padding:18px;text-align:center;color:var(--muted);background:var(--bg);border-radius:12px}

  /* ---------- 다른 보기 ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
  .tbl th{font-size:12px;color:var(--muted)}
  .plist{display:flex;flex-direction:column;gap:8px}
  .pitem{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px}
  .pitem[aria-pressed="true"]{border-color:#2A68E0;background:#F2F6FF}
  .flow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:12px 0}
  .flow .col{display:flex;flex-direction:column;gap:8px;justify-content:center}
  .node{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;min-width:170px}
  .node .tn{font-weight:800}
  .arrow{align-self:center;font-size:22px;color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters select{width:auto;min-width:140px}
  .day{margin:14px 0 4px;font-weight:800;color:var(--navy)}
  .acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .acard{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}

  /* ---------- 애니메이션 (작업 중인 팀만) ---------- */
  .alt-b{opacity:0}
  @keyframes tapL{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  @keyframes tapR{from{transform:rotate(3deg)}to{transform:rotate(-3deg)}}
  @keyframes draw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  @keyframes altA{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes altB{0%,49%{opacity:0}50%,100%{opacity:1}}
  @keyframes codeUp{from{transform:translateY(0)}to{transform:translateY(-36px)}}
  @keyframes scan{from{transform:translateY(0)}to{transform:translateY(70px)}}
  @keyframes ping{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes magn{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,12px)}}
  @keyframes note{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .on .arm-l{animation:tapL .55s ease-in-out infinite alternate}
  .on .arm-r{animation:tapR .55s ease-in-out infinite alternate}
  .on[data-team="design"] .arm-r{animation:draw 1.6s ease-in-out infinite}
  .on .alt-a{animation:altA 4s steps(1) infinite}
  .on .alt-b{animation:altB 4s steps(1) infinite}
  .on .code{animation:codeUp 3s linear infinite}
  .on .scan{animation:scan 2.4s ease-in-out infinite alternate}
  .on .chk1{animation:ping 2.4s ease-in-out infinite}
  .on .chk2{animation:ping 2.4s ease-in-out .5s infinite}
  .on .chk3{animation:ping 2.4s ease-in-out 1s infinite}
  .on .magn{animation:magn 3s ease-in-out infinite}
  .on .sticky{animation:note 2s ease-in-out infinite}
  .on .sticky2{animation:note 2s ease-in-out .7s infinite}
  .on .head{animation:bob 1.2s ease-in-out infinite}
  .calm *,.calm *::before,.calm *::after{animation:none !important}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

  /* ---------- 반응형 ---------- */
  @media (max-width:1100px){ .layout{grid-template-columns:minmax(0,1fr)} .side{max-height:none;overflow:visible} }
  @media (max-width:760px){
    .app{grid-template-columns:minmax(0,1fr)}
    .rail{flex-direction:row;justify-content:space-around;padding:6px}
    .rail .logo{display:none}
    .rail button{width:auto;flex:1;padding:6px 2px}
    .main{padding:12px 12px 24px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .lounge{display:none}
    .chief-board{font-size:10px}
  }
  @media (max-width:430px){ .grid{grid-template-columns:minmax(0,1fr)} .chief-board{font-size:12px} }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="화면 이동">
    <div class="logo" aria-hidden="true">B</div>
    <button data-view="office" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>오피스</button>
    <button data-view="projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>프로젝트</button>
    <button data-view="schedule"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>일정</button>
    <button data-view="artifacts"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>결과물</button>
  </nav>

  <div class="main">
    <header class="top">
      <h1 class="title">BUYEST AI TEAM</h1>
      <span class="sub">일하는 AI팀이 보이는 대시보드</span>
      <span class="sp"></span>
      <div class="seg" role="group" aria-label="브랜드 선택">
        <button data-brand="buyest" aria-pressed="true">BUYEST</button>
        <button data-brand="buyest_kids" aria-pressed="false">BUYEST Kids</button>
      </div>
      <span class="chip" id="conn" title="실제 AI 실행기와 연결되어 있지 않습니다. 화면의 업무·시각·수치는 모두 예시입니다."><i></i>예시 모드 · 실제 실행 미연결</span>
      <button class="btn ghost" id="pause" aria-pressed="false">동작 정지</button>
    </header>

    <main id="view" tabindex="-1"></main>
    <div class="foot">실제 실행 상태 연결 전 · 화면 예시 (업무·시각·결과물은 모두 예시 데이터)</div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   BUYEST AI TEAM — 2D 오피스 대시보드 (데모)
   구조: 데이터(스토어) → 화면. 애니메이션은 데이터 상태로만 결정된다.
   DemoAdapter(아래 DEMO)가 이벤트를 만들고, 실제 연결은 같은 이벤트 형식을
   LiveAdapter로 흘려 넣으면 된다. (지금은 미연결)
   ===================================================================== */
function h(tag, attrs){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v = attrs[k]; if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k === 'on'){ for(var ev in v) e.addEventListener(ev, v[ev]); }
    else e.setAttribute(k, v === true ? '' : v);
  }
  for(var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
  function add(p, c){
    if(c == null || c === false) return;
    if(Array.isArray(c)) return c.forEach(function(x){ add(p, x); });
    p.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
}

/* ---------------- 상수 ---------------- */
var TEAMS = [
  {id:'sns',      name:'인스타팀', role:'피드·릴스·스토리·캡션·해시태그·게시 일정', agent:'buyest-sns',      ex:'인스타팀, 이번 주 피드 캡션 3안 써줘'},
  {id:'design',   name:'디자인팀', role:'릴스 콘티·사진 연출·상세페이지 비주얼 흐름·카드뉴스', agent:'buyest-design',   ex:'디자인팀, 신상 릴스 콘티 짜줘'},
  {id:'ad',       name:'광고팀',   role:'메타·네이버·오픈마켓 광고 문구 여러 벌, A/B 테스트 설계', agent:'buyest-ad',       ex:'광고팀, 메타 광고 문구 3벌 써줘'},
  {id:'brand',    name:'브랜드팀', role:'톤·용어·비주얼 일관성, 성인/키즈 구분, 병행수입 표현 검수', agent:'buyest-brand',    ex:'브랜드팀, 이 문구 톤 검수해줘'},
  {id:'chief',    name:'실장',     role:'업무 분해·배정·진행 조율·검수 요청·결과 취합', agent:'(메인 Claude)',   ex:'실장, 바이스트키즈 신상 5개 기획해줘'},
  {id:'dev',      name:'개발팀',   role:'카피라이터 툴, 툴킷 사이트, HTML·파이썬 업무 도구', agent:'buyest-dev',      ex:'개발팀, 툴킷에 새 도구 추가해줘'},
  {id:'security', name:'보안팀',   role:'API 키·비밀번호 노출, Worker 프록시, 권한 구멍 점검', agent:'buyest-security', ex:'보안팀, 이 코드에 키 노출 없는지 봐줘'},
  {id:'qa',       name:'검수팀',   role:'최종 판정. 증거가 없으면 "아직 아님"', agent:'buyest-qa',       ex:'검수팀, 최종 판정 내려줘'}
];
var TEAM = {}; TEAMS.forEach(function(t){ TEAM[t.id] = t; });
var BRANDS = {buyest:'BUYEST', buyest_kids:'BUYEST Kids'};

var SM = { // 작업 상태 → 표시
  queued:{t:'배정 대기', i:'○', tone:'gray'},
  working:{t:'작업 중', i:'●', tone:'teal'},
  review_pending:{t:'검수 대기', i:'◐', tone:'amber'},
  reviewing:{t:'검수 중', i:'◎', tone:'teal'},
  changes_requested:{t:'수정 요청', i:'↺', tone:'amber'},
  blocked:{t:'진행 막힘', i:'!', tone:'amber'},
  completed:{t:'완료', i:'✓', tone:'blue'},
  failed:{t:'오류', i:'✕', tone:'red'},
  cancelled:{t:'취소', i:'–', tone:'gray'}
};
var WORKFLOWS = {
  content:{label:'콘텐츠', note:'디자인팀 + 인스타팀 → 브랜드팀 검수'},
  ad:{label:'광고 준비', note:'광고팀 → 브랜드팀 → 검수팀'},
  code:{label:'코드·업무 도구', note:'개발팀 → 보안팀 → 검수팀'}
};

/* ---------------- 스토어 ---------------- */
var STORE = {}, ui = {brand:'buyest', view:'office', team:null, project:null, paused:false};

function newBrandState(brand){
  var bs = {brand:brand, projects:[], tasks:{}, artifacts:[], schedule:[], feed:[], elapsed:0,
            seen:{}, lastSeq:{}, scripts:[], handoffs:[], n:0};
  var kids = brand === 'buyest_kids';
  var p1 = makeProject(bs, 'content', kids ? '신상 키즈 콘텐츠 제작 — 예시' : '상세페이지 제작 — 예시');
  startScript(bs, p1);
  makeProject(bs, 'ad', kids ? '키즈 메타 광고 문구 — 예시(시작 전)' : '메타 광고 문구 — 예시(시작 전)');
  seedSchedule(bs, p1);
  return bs;
}

function makeProject(bs, wf, title){
  var pid = 'p' + (++bs.n) + '-' + bs.brand;
  var kids = bs.brand === 'buyest_kids';
  var p = {id:pid, brand:bs.brand, title:title, workflow:wf, status:'active', taskIds:[], chain:[], seq:0, createdAt:Date.now()};
  function T(key, team, title, kind, deps){
    var id = pid + '-' + key;
    bs.tasks[id] = {id:id, projectId:pid, brand:bs.brand, teamId:team, title:title, kind:kind,
      status:'queued', deps:(deps||[]).map(function(d){ return pid + '-' + d; }), artifactIds:[],
      reason: kind === 'review' ? '앞 단계 결과물 대기' : '배정 전', version:1};
    p.taskIds.push(id); return id;
  }
  if(wf === 'content'){
    T('a','design', kids ? '키즈 룩북 시안 제작' : '상세페이지 시안 제작', 'create');
    T('b','sns', kids ? '키즈 소개 캡션 작성' : '소개 캡션 작성', 'create');

/* ---------------- 데모 어댑터: 시나리오 → 이벤트 ---------------- */
function startScript(bs, p){
  var tid = function(k){ return p.id + '-' + k; };
  var evs = [], at0 = bs.elapsed;
  function E(at, type, taskId, payload){ evs.push({at:at0 + at, type:type, taskId:taskId, payload:payload || {}}); }
  function S(at, task, to, reason, extra){ E(at, 'task_status_changed', tid(task), Object.assign({to:to, reason:reason || null}, extra || {})); }
  function submit(at, task, ver, toTeam){
    E(at, 'artifact_created', tid(task), {version:ver});
    S(at + 100, task, 'review_pending', '결과물 제출 (v' + ver + ')');
    E(at + 200, 'handoff', tid(task), {fromTeamId:bs.tasks[tid(task)].teamId, toTeamId:toTeam});
  }
  p.script = true;
  if(p.workflow === 'content'){
    E(0,'handoff',tid('a'),{fromTeamId:'chief', toTeamId:'design'}); S(100,'a','working');
    E(300,'handoff',tid('b'),{fromTeamId:'chief', toTeamId:'sns'});   S(400,'b','working');
    submit(6000,'a',1,'brand'); submit(8500,'b',1,'brand');
    S(10500,'r1','reviewing','검수 시작');
    E(16500,'review_decided',tid('r1'),{reviewerTeamId:'brand', decision:'changes_requested', targets:['a'], reason:'브랜드 용어 수정 필요', approved:['b'], final:false});
    S(16700,'r1','queued','수정본 대기'); S(18500,'a','working','수정 시작 (v2)',{version:2});
    submit(25000,'a',2,'brand'); S(27000,'r1','reviewing','수정본 검수');
    E(32000,'review_decided',tid('r1'),{reviewerTeamId:'brand', decision:'approved', targets:['a','b'], final:true});
    S(32200,'r1','completed'); E(33500,'handoff',tid('r1'),{fromTeamId:'brand', toTeamId:'chief'});
  } else if(p.workflow === 'ad'){
    E(0,'handoff',tid('a'),{fromTeamId:'chief', toTeamId:'ad'}); S(100,'a','working');
    submit(6000,'a',1,'brand'); S(8000,'r1','reviewing','검수 시작');
    E(13000,'review_decided',tid('r1'),{reviewerTeamId:'brand', decision:'approved', targets:['a'], final:false});
    S(13200,'r1','completed'); E(13400,'handoff',tid('r1'),{fromTeamId:'brand', toTeamId:'qa'});
    S(15000,'r2','reviewing','근거 확인');
    E(21000,'review_decided',tid('r2'),{reviewerTeamId:'qa', decision:'approved', targets:['a'], final:true});
    S(21200,'r2','completed'); E(22500,'handoff',tid('r2'),{fromTeamId:'qa', toTeamId:'chief'});
  } else {
    E(0,'handoff',tid('a'),{fromTeamId:'chief', toTeamId:'dev'}); S(100,'a','working');
    submit(7000,'a',1,'security'); S(9000,'r1','reviewing','키·권한 점검');
    E(14000,'review_decided',tid('r1'),{reviewerTeamId:'security', decision:'approved', targets:['a'], final:false});
    S(14200,'r1','completed'); E(14400,'handoff',tid('r1'),{fromTeamId:'security', toTeamId:'qa'});
    S(16000,'r2','reviewing','증거 확인'); S(19000,'r2','blocked','실제 실행 화면 증거 필요'); S(23000,'r2','reviewing','증거 확인 재개');
    E(28000,'review_decided',tid('r2'),{reviewerTeamId:'qa', decision:'approved', targets:['a'], final:true});
    S(28200,'r2','completed'); E(29500,'handoff',tid('r2'),{fromTeamId:'qa', toTeamId:'chief'});
  }
  evs.forEach(function(e, i){ e.sort = i; });
  evs.sort(function(a, b){ return a.at - b.at || a.sort - b.sort; });
  bs.scripts.push({pid:p.id, evs:evs, i:0});
}

/* ---------------- 이벤트 적용 (중복·역순 무시) ---------------- */
function applyEvent(bs, raw){
  var p = bs.projects.filter(function(x){ return x.id === raw.projectId; })[0]; if(!p) return;
  var ev = {eventId: raw.projectId + '-e' + (p.seq + 1), sequence: p.seq + 1, occurredAt: new Date().toISOString(), receivedAt: new Date().toISOString(),
            projectId:raw.projectId, brand:bs.brand, taskId:raw.taskId, type:raw.type, payload:raw.payload};
  if(bs.seen[ev.eventId]) return;
  if(ev.sequence <= (bs.lastSeq[ev.projectId] || 0)) return;
  bs.seen[ev.eventId] = 1; bs.lastSeq[ev.projectId] = ev.sequence; p.seq = ev.sequence;
  var t = bs.tasks[ev.taskId], pl = ev.payload, feed = null;

  if(ev.type === 'task_status_changed' && t){
    t.status = pl.to; t.reason = pl.reason || null; if(pl.version) t.version = pl.version;
    var m = SM[pl.to];
    if(pl.to !== 'queued') feed = {team:t.teamId, tone:m.tone, text:m.t + (pl.reason ? ' — ' + pl.reason : '')};
  } else if(ev.type === 'artifact_created' && t){
    var a = {id:'a-' + t.id + '-v' + pl.version, taskId:t.id, projectId:p.id, brand:bs.brand, teamId:t.teamId, version:pl.version,
             title:t.title + ' v' + pl.version + ' — 예시', url:null, reviewStatus:'pending', createdAt:Date.now()};
    bs.artifacts.push(a); t.artifactIds.push(a.id);
  } else if(ev.type === 'handoff'){
    bs.handoffs.push({from:pl.fromTeamId, to:pl.toTeamId});
    feed = {team:pl.fromTeamId, tone:'blue', text:TEAM[pl.toTeamId].name + '에게 결과물 전달'};
  } else if(ev.type === 'review_decided'){
    var rev = TEAM[pl.reviewerTeamId].name;
    (pl.targets || []).forEach(function(k){
      var tk = bs.tasks[p.id + '-' + k]; if(!tk) return;
      var art = bs.artifacts.filter(function(x){ return x.taskId === tk.id; }).pop();
      if(pl.decision === 'changes_requested'){
        tk.status = 'changes_requested'; tk.reason = pl.reason; if(art) art.reviewStatus = 'changes_requested';
      } else if(pl.final){
        tk.status = 'completed'; tk.reason = null; if(art) art.reviewStatus = 'approved';
      } else if(art){ art.reviewStatus = 'in_review'; }
    });
    (pl.approved || []).forEach(function(k){
      var tk = bs.tasks[p.id + '-' + k]; if(!tk) return;
      var art = bs.artifacts.filter(function(x){ return x.taskId === tk.id; }).pop(); if(art) art.reviewStatus = 'in_review';
    });
    feed = pl.decision === 'changes_requested'
      ? {team:pl.reviewerTeamId, tone:'amber', text:'수정 요청 — ' + pl.reason}
      : {team:pl.reviewerTeamId, tone:'teal', text:(pl.final ? '최종 승인' : '검수 통과') + ' (' + rev + ')'};
  }
  // 필수 작업과 검수가 전부 끝난 경우에만 프로젝트 완료
  var all = p.taskIds.every(function(id){ return bs.tasks[id].status === 'completed'; });
  if(all && p.status !== 'completed'){
    p.status = 'completed';
    pushFeed(bs, {team:'chief', tone:'blue', text:'결과 취합 완료 — ' + p.title, pid:p.id});
  }
  if(feed){ feed.pid = p.id; pushFeed(bs, feed); }
}
function pushFeed(bs, f){
  f.time = new Date(); bs.feed.unshift(f); if(bs.feed.length > 60) bs.feed.length = 60;
}

/* ---------------- 팀 상태 요약 ---------------- */
function teamInfo(bs, id){
  if(id === 'chief'){
    var act = bs.projects.filter(function(p){ return p.script && p.status !== 'completed'; }).length;
    var fin = bs.projects.filter(function(p){ return p.status === 'completed'; }).length;
    if(act) return {anim:true, label:'조율 중', tone:'teal', count:act, extra:[]};
    if(fin) return {anim:false, label:'취합 완료', tone:'blue', count:0, extra:[]};
    return {anim:false, label:'대기', tone:'gray', count:0, extra:[]};
  }
  var ts = Object.keys(bs.tasks).map(function(k){ return bs.tasks[k]; }).filter(function(t){ return t.teamId === id; });
  var c = {}; ts.forEach(function(t){ c[t.status] = (c[t.status] || 0) + 1; });
  var open = ts.filter(function(t){ return t.status !== 'completed' && t.status !== 'cancelled'; }).length;
  var anim = !!(c.working || c.reviewing), extra = [];
  ['failed','blocked','changes_requested'].forEach(function(s){ if(c[s]) extra.push(s); });
  var main;
  if(c.working) main = 'working'; else if(c.reviewing) main = 'reviewing';
  else if(extra.length) main = extra[0]; else if(c.review_pending) main = 'review_pending';
  else if(c.queued) main = 'queued'; else if(c.completed) main = 'completed';
  var m = main ? SM[main] : {t:'대기', tone:'gray'};
  return {anim:anim, label:m.t, tone:m.tone, count:open, extra: extra.filter(function(s){ return s !== main; })};
}

var $view = document.getElementById('view');
function cur(){ return STORE[ui.brand]; }
function fmtTime(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0'); }
function fmtDate(ms){
  var d = new Date(ms), w = '일월화수목금토'[d.getDay()];
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + w + ') ';
}
function fmtHM(ms){ var d = new Date(ms); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function badge(tone, text){ return h('span', {class:'badge ' + tone}, text); }
function statusBadge(s){ var m = SM[s]; return badge(m.tone, m.i + ' ' + m.t); }
function projectOf(bs, id){ return bs.projects.filter(function(p){ return p.id === id; })[0]; }
function activeProject(bs){
  var sel = ui.project && projectOf(bs, ui.project);
  if(sel) return sel;
  return bs.projects.filter(function(p){ return p.script && p.status !== 'completed'; })[0] || bs.projects.filter(function(p){ return p.script; }).pop() || bs.projects[0];
}

var stationEls = {};
function renderOffice(){
  var bs = cur(); stationEls = {};
  var order = ['sns','design','ad','brand','chief','dev','security','lounge','qa'];
  var grid = h('div', {class:'grid'});
  order.forEach(function(id){
    if(id === 'lounge'){ var lg = h('div', {class:'cell lounge'}); lg.innerHTML = loungeSvg(); grid.append(lg); return; }
    var t = TEAM[id];
    var btn = h('button', {class:'station', type:'button', 'data-team':id, 'aria-pressed': ui.team === id ? 'true' : 'false'});
    var ico = h('span', {class:'ico'}); ico.innerHTML = iconSvg(id);
    var pill = h('div', {class:'pill'}, h('span', {class:'name'}, ico, t.name), h('span', {class:'badges'}), h('span', {class:'cnt'}));
    btn.append(pill);
    var wrap = h('span', {class:'art-wrap'}); wrap.innerHTML = stationSvg(id, ui.brand); btn.append(wrap);
    btn.addEventListener('click', function(){ ui.team = (ui.team === id) ? null : id; paintOffice(); renderSide(); });

    grid.append(cell);
    stationEls[id] = btn;
  });
  var legend = h('div', {class:'legend', 'aria-label':'상태 안내'}, Object.keys(SM).map(function(k){ return h('span', null, SM[k].i + ' ' + SM[k].t); }));
  var office = h('div', {class:'office', id:'office'}, grid);
  var side = h('aside', {class:'side', id:'side', 'aria-label':'프로젝트 상세'});
  $view.replaceChildren(h('div', {class:'layout'}, h('div', null, office, legend), side));
  paintOffice(); renderSide();
}

function paintOffice(){
  var bs = cur();
  TEAMS.forEach(function(t){
    var el = stationEls[t.id]; if(!el) return;
    var inf = teamInfo(bs, t.id);
    var svg = el.querySelector('svg.art');
    svg.classList.toggle('on', inf.anim);
    el.classList.toggle('on', inf.anim);
    el.setAttribute('data-team', t.id);
    el.setAttribute('aria-pressed', ui.team === t.id ? 'true' : 'false');
    var b = el.querySelector('.badges'); b.replaceChildren(badge(inf.tone, '● ' + inf.label), inf.extra.map(function(s){ return badge(SM[s].tone, SM[s].t); }));
    el.querySelector('.cnt').textContent = inf.count ? '진행 ' + inf.count + '건' : '';
    el.setAttribute('aria-label', t.name + ', ' + inf.label + (inf.count ? ', 진행 ' + inf.count + '건' : ''));
    // 애니메이션 클래스는 svg 자체에 있어야 선택자가 맞는다
    svg.setAttribute('data-team', t.id);
  });
  // CSS 선택자(.on .arm-l)가 svg 에 걸리도록 별도 처리
  if(stationEls.chiefBoard){
    var p = activeProject(bs), b = stationEls.chiefBoard;
    b.replaceChildren(h('b', null, '프로젝트 현황'), h('ul', null, p.taskIds.map(function(id){
      var t = bs.tasks[id]; return h('li', null, SM[t.status].i, ' ', t.title);
    })));
  }
}

    parts.push(h('section', {class:'card'},

    ));

function composer(){
  var bs = cur();
  var ta = h('textarea', {id:'cmdtext', placeholder:'어떤 일을 맡길까요?', 'aria-label':'실장에게 지시할 내용', maxlength:'120'});
  var sel = h('select', {id:'cmdwf', 'aria-label':'업무 종류'}, Object.keys(WORKFLOWS).map(function(k){ return h('option', {value:k}, WORKFLOWS[k].label + ' — ' + WORKFLOWS[k].note); }));
  var msg = h('div', {class:'msg', role:'status'}, '예시 실행입니다. 실제 AI는 호출되지 않고 예시 이벤트만 재생됩니다.');
  var btn = h('button', {class:'btn', type:'button'}, '예시 실행');
  var lock = false;
  btn.addEventListener('click', function(){
    var text = ta.value.trim();
    if(!text){ msg.className = 'msg err'; msg.textContent = '지시 내용을 입력하세요.'; ta.focus(); return; }
    if(lock) return; lock = true; btn.disabled = true; setTimeout(function(){ lock = false; btn.disabled = false; }, 1500);
    var p = makeProject(bs, sel.value, text.slice(0, 40) + ' — 예시');
    startScript(bs, p); ui.project = p.id; ta.value = '';
    pushFeed(bs, {team:'chief', tone:'blue', text:'지시 접수(예시) — ' + p.title, pid:p.id});
    render();
  });
  return h('section', {class:'card'}, h('h2', null, '실장에게 지시'), ta, h('div', {class:'row'}, sel), h('div', {class:'row'}, btn,
    h('button', {class:'btn ghost', type:'button', on:{click:function(){ STORE[ui.brand] = newBrandState(ui.brand); ui.project = null; ui.team = null; render(); }}}, '처음부터 다시')), msg);
}

  }));
  var creators = p.taskIds.filter(function(id){ return bs.tasks[id].kind === 'create'; });
  function node(id){ var k = bs.tasks[id]; return h('div', {class:'node'}, h('div', {class:'tn'}, TEAM[k.teamId].name), h('div', null, k.title + (k.version > 1 ? ' (v' + k.version + ')' : '')), h('div', {style:'margin-top:4px'}, statusBadge(k.status)), k.reason ? h('div', {class:'msg'}, k.reason) : null); }
  var flow = h('div', {class:'flow'}, h('div', {class:'col'}, creators.map(node)));
  p.chain.forEach(function(id){ flow.append(h('div', {class:'arrow', 'aria-hidden':'true'}, '→'), h('div', {class:'col'}, node(id))); });
  var done = p.status === 'completed';
  var tbl = h('table', {class:'tbl'}, h('thead', null, h('tr', null, ['팀','작업','상태','사유/비고','결과물'].map(function(x){ return h('th', null, x); }))),
    h('tbody', null, p.taskIds.map(function(id){ var k = bs.tasks[id]; return h('tr', null, h('td', null, TEAM[k.teamId].name), h('td', null, k.title), h('td', null, statusBadge(k.status)), h('td', null, k.reason || '—'), h('td', null, k.artifactIds.length ? k.artifactIds.length + '건' : '—')); })));
  var det = h('section', {class:'card'}, h('h2', null, p.title), h('p', {class:'msg'}, WORKFLOWS[p.workflow].label + ' · 검수 경로: ' + WORKFLOWS[p.workflow].note),
    flow, h('div', {class:'msg'}, done ? '필수 검수 단계가 모두 끝나 프로젝트가 완료되었습니다(예시).' : '파일 제출과 최종 검수 통과는 다른 단계입니다. 모든 검수가 끝나기 전에는 완료로 표시하지 않습니다.'), tbl);
  $view.replaceChildren(h('div', {class:'layout'}, det, h('aside', {class:'side'}, h('section', {class:'card'}, h('h2', null, '프로젝트 목록'), list))));
}

/* ----- 일정 ----- */
var schedTeam = '';
function renderSchedule(){
  var bs = cur();
  var sel = h('select', {'aria-label':'팀 필터', on:{change:function(e){ schedTeam = e.target.value; renderSchedule(); }}},
    h('option', {value:''}, '전체 팀'), TEAMS.map(function(t){ return h('option', {value:t.id, selected: schedTeam === t.id}, t.name); }));
  var items = bs.schedule.filter(function(s){ return !schedTeam || s.teamId === schedTeam; }).sort(function(a, b){ return a.at - b.at; });
  var body = [], last = '';
  items.forEach(function(s){
    var d = fmtDate(s.at); if(d !== last){ body.push(h('div', {class:'day'}, d)); last = d; }
    body.push(h('div', {class:'node', style:'width:100%;margin-bottom:6px'}, h('b', null, fmtHM(s.at) + '  ' + s.title), h('div', {class:'msg'}, TEAM[s.teamId].name + ' · 예정 시각은 실행했다는 증거가 아닙니다')));
  });
  $view.replaceChildren(h('section', {class:'card'}, h('h2', null, '공유 일정 · ' + BRANDS[ui.brand]), h('div', {class:'filters'}, sel),
    items.length ? body : h('div', {class:'empty'}, '조건에 맞는 일정이 없습니다. 팀 필터를 바꿔 보세요.')));
}

/* ----- 결과물 ----- */
var artFilter = '';
function renderArtifacts(){
  var bs = cur();
  var sel = h('select', {'aria-label':'프로젝트 필터', on:{change:function(e){ artFilter = e.target.value; renderArtifacts(); }}},
    h('option', {value:''}, '전체 프로젝트'), bs.projects.map(function(p){ return h('option', {value:p.id, selected: artFilter === p.id}, p.title); }));
  var RS = {pending:['gray','제출됨 · 검수 전'], in_review:['teal','검수 진행'], changes_requested:['amber','수정 요청'], approved:['blue','검수 통과']};
  var items = bs.artifacts.filter(function(a){ return !artFilter || a.projectId === artFilter; });
  $view.replaceChildren(h('section', {class:'card'}, h('h2', null, '결과물 · ' + BRANDS[ui.brand]), h('div', {class:'filters'}, sel),
    items.length ? h('div', {class:'acards'}, items.map(function(a){
      var r = RS[a.reviewStatus];
      return h('div', {class:'acard'}, h('b', null, a.title), h('div', {class:'msg'}, TEAM[a.teamId].name + ' · v' + a.version), badge(r[0], r[1]),
        h('button', {class:'btn ghost', type:'button', disabled:true, title:'예시 결과물이라 연결된 파일이 없습니다'}, '열기 (파일 없음)'));
    })) : h('div', {class:'empty'}, '아직 결과물이 없습니다. 오피스에서 예시 실행을 시작하면 팀이 제출한 결과물이 여기에 쌓입니다.')));
}

function render(){
  document.querySelectorAll('.rail [data-view]').forEach(function(b){ b.toggleAttribute('aria-current', b.dataset.view === ui.view); if(b.dataset.view === ui.view) b.setAttribute('aria-current','page'); });
  document.querySelectorAll('[data-brand]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.brand === ui.brand ? 'true' : 'false'); });
  ({office:renderOffice, projects:renderProjects, schedule:renderSchedule, artifacts:renderArtifacts})[ui.view]();
}

/* ----- 문서 전달 효과 (handoff 이벤트에서만) ----- */
function flyDoc(from, to){
  var o = document.getElementById('office'), a = stationEls[from], b = stationEls[to];
  if(ui.view !== 'office' || !o || !a || !b || ui.paused || document.hidden) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var r = o.getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  var el = h('div', {class:'doc'}); el.innerHTML = '<svg viewBox="0 0 30 36"><path d="M2 2h18l8 8v24H2z" fill="#fff" stroke="#2A68E0" stroke-width="2"/><path d="M7 16h16M7 22h16M7 28h10" stroke="#9FB4DD" stroke-width="2.4" stroke-linecap="round"/></svg>';
  o.append(el);
  var x1 = ra.left - r.left + ra.width / 2, y1 = ra.top - r.top + ra.height * .55, x2 = rb.left - r.left + rb.width / 2, y2 = rb.top - r.top + rb.height * .55;
  var an = el.animate([{transform:'translate('+x1+'px,'+y1+'px) scale(.8)', opacity:0},{transform:'translate('+x1+'px,'+(y1-20)+'px) scale(1)', opacity:1, offset:.15},{transform:'translate('+x2+'px,'+(y2-20)+'px) scale(1)', opacity:1, offset:.85},{transform:'translate('+x2+'px,'+y2+'px) scale(.8)', opacity:0}], {duration:1000, easing:'ease-in-out'});
  an.onfinish = function(){ el.remove(); };
}

/* ----- 시계: 데이터만 갱신, 그림은 데이터를 따라간다 ----- */
setInterval(function(){
  if(ui.paused || document.hidden) return;
  var bs = cur(); bs.elapsed += 250;
  var changed = false;
  bs.scripts.forEach(function(sc){
    while(sc.i < sc.evs.length && sc.evs[sc.i].at <= bs.elapsed){ applyEvent(bs, Object.assign({projectId:sc.pid}, sc.evs[sc.i])); sc.i++; changed = true; }
  });
  if(!changed) return;
  var hs = bs.handoffs.splice(0);
  if(ui.view === 'office'){ paintOffice(); renderSide(); hs.forEach(function(x, i){ setTimeout(function(){ flyDoc(x.from, x.to); }, i * 300); }); }
  else if(ui.view === 'projects') renderProjects();
  else if(ui.view === 'artifacts') renderArtifacts();
}, 250);

/* ----- 컨트롤 ----- */
document.querySelectorAll('.rail [data-view]').forEach(function(b){ b.addEventListener('click', function(){ ui.view = b.dataset.view; render(); }); });
document.querySelectorAll('[data-brand]').forEach(function(b){ b.addEventListener('click', function(){ if(ui.brand === b.dataset.brand) return; ui.brand = b.dataset.brand; ui.team = null; ui.project = null; feedFilter = ''; artFilter = ''; schedTeam = ''; render(); }); });
var pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', function(){
  ui.paused = !ui.paused; pauseBtn.setAttribute('aria-pressed', ui.paused ? 'true' : 'false');
  pauseBtn.textContent = ui.paused ? '동작 재생' : '동작 정지';
  document.body.classList.toggle('calm', ui.paused);
});

STORE.buyest = newBrandState('buyest'); STORE.buyest_kids = newBrandState('buyest_kids');
render();
</script>

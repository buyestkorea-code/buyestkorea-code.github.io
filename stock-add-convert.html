<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>재고추가변환</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 1150px; margin: 32px auto; padding: 0 20px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.lead { color: #555; margin-top: 6px; font-size: 13.5px; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin: 16px 0; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #666; font-weight: 600; }
  input[type=file] { font-size: 13px; }
  .modes { display: flex; gap: 6px; }
  .modes button { font-size: 13px; padding: 7px 14px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; }
  .modes button.on { background: #111827; color: #fff; border-color: #111827; }
  .btn { font-size: 15px; padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; }
  .btn-primary { background: #111827; color: #fff; }
  .btn-green { background: #0f766e; color: #fff; }
  .btn:disabled { background: #d1d5db; color: #6b7280; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; background: #fff; }
  th, td { border-bottom: 1px solid #e5e7eb; padding: 7px 8px; text-align: left; }
  th { background: #f3f4f6; position: sticky; top: 0; }
  .tbl-wrap { max-height: 62vh; overflow: auto; border: 1px solid #e5e7eb; border-radius: 6px; margin-top: 12px; }
  #status { color: #6b7280; margin: 10px 0; font-size: 13px; }
  #result { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; }
  #result.ok { background: #f0fdf4; color: #15803d; }
  #result.err { background: #fef2f2; color: #b91c1c; white-space: pre-wrap; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .c-sale { background: #f0fdf4; color: #15803d; }
  .c-soldout { background: #fef2f2; color: #b91c1c; }
  .c-new { background: #eff6ff; color: #1d4ed8; }
  .c-check { background: #fef3c7; color: #92400e; }
  .meta { font-size: 12px; color: #6b7280; margin-left: 6px; }
  code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>재고추가변환</h1>
  <p class="lead">
    가로형 재고추가 엑셀(브랜드별 사이즈 매트릭스)을 올리면 → <b>이카운트 세로 양식</b>(품목코드·품목명·규격명·수량·상태)으로 변환합니다.<br>
    상태는 BUYEST 사이트 기준입니다 — <span class="chip c-sale">판매중</span> <span class="chip c-soldout">품절</span> <span class="chip c-new">신규</span>(사이트·이카운트에 없음) <span class="chip c-check">확인필요</span>
  </p>

  <div class="row">
    <div class="field">
      <label>재고추가 파일 (.xlsx)</label>
      <input type="file" id="stockFile" accept=".xlsx,.xls">
    </div>
    <div class="field">
      <label>이카운트 품목 조회 방식</label>
      <div class="modes">
        <button id="mAuto" class="on" onclick="setMode('cache')">자동 (서버 캐시)</button>
        <button id="mManual" onclick="setMode('manual')">수동 (엑셀 업로드)</button>
      </div>
    </div>
    <div class="field" id="ecFileField" style="display:none;">
      <label>이카운트 품목 엑셀 (.xlsx) — 품목코드 / 품목명[규격]</label>
      <input type="file" id="ecFile" accept=".xlsx,.xls">
    </div>
  </div>

  <button class="btn btn-primary" id="runBtn" onclick="run()" disabled>변환</button>
  <button class="btn btn-green" id="dlBtn" onclick="download()" style="display:none;">엑셀 다운로드</button>

  <div id="status"></div>
  <div id="result"></div>
  <div class="tbl-wrap" id="tblWrap" style="display:none;"><table id="tbl"></table></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script>
const API_URL = 'https://buyest.co.kr/stock_add_convert_api.php';
let mode = 'cache';
let stockWB = null, ecWB = null, resultItems = [], srcBase = 'result';

function setMode(m) {
  mode = m;
  document.getElementById('mAuto').classList.toggle('on', m === 'cache');
  document.getElementById('mManual').classList.toggle('on', m === 'manual');
  document.getElementById('ecFileField').style.display = m === 'manual' ? 'flex' : 'none';
  refreshRunBtn();
}

document.getElementById('stockFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  srcBase = f.name.replace(/\.[^.]+$/, '');
  stockWB = XLSX.read(await f.arrayBuffer(), { type: 'array' });
  refreshRunBtn();
});
document.getElementById('ecFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  ecWB = XLSX.read(await f.arrayBuffer(), { type: 'array' });
  refreshRunBtn();
});

function refreshRunBtn() {
  document.getElementById('runBtn').disabled = !stockWB || (mode === 'manual' && !ecWB);
}

const S = v => (v === null || v === undefined) ? '' : String(v).trim();
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(String(v).replace(/,/g, ''));
  return isFinite(n) ? n : null;
}
function cleanSize(lbl) {
  let s = S(lbl);
  if (/^\d+\.0$/.test(s)) s = s.slice(0, -2);   // 38.0 -> 38
  return s;
}

/* 가로형 재고추가 매트릭스 파서.
   - "BRAND" 헤더행 또는 col4가 "TU"인 사이즈 스케일행이 나올 때마다 현재 사이즈 컬럼맵을 갱신
   - MODEL(col3) 있는 행 = 품목. 사이즈 컬럼별 수량을 세로로 펼침
   - col1의 "발 볼 전부 C" 같은 메모의 끝 알파벳 1자 = 발볼(사이즈에 " C" 붙임)
   - col4에 숫자만 있으면 단품(TU) 수량 */
function parseStock(wb) {
  const out = [];
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true });
    let sizeCols = null;
    for (const row of aoa) {
      if (!row) continue;
      const c0 = S(row[0]);
      if (/^20\d\d[.\-/]/.test(c0)) continue;              // 블록 헤더행
      const c3 = S(row[3]), c4 = S(row[4]).toUpperCase();
      const isBrandHdr = c0.toUpperCase() === 'BRAND';
      const isScale = c4 === 'TU' && !c3;
      if (isBrandHdr || isScale) {
        sizeCols = [];
        for (let c = 5; c <= 21; c++) {
          const t = S(row[c]);
          if (t && t.toUpperCase() !== 'TU') sizeCols.push({ col: c, label: t });
        }
        continue;
      }
      if (!c3) continue;                                    // 품목행 아님
      const note = S(row[1]);
      const wm = note.match(/(?:^|\s)([A-E])$/);
      const width = wm ? ' ' + wm[1] : '';
      // 단품(TU) 수량
      const tuv = num(row[4]);
      if (c4 !== 'TU' && tuv && tuv > 0) out.push({ model: c3, size: 'TU', qty: tuv });
      for (const sc of (sizeCols || [])) {
        const q = num(row[sc.col]);
        if (q && q > 0) out.push({ model: c3, size: cleanSize(sc.label) + width, qty: q });
      }
    }
  }
  return out;
}

/* 이카운트 품목 엑셀 → [{code,name,size}] . 헤더행 자동 감지(품목코드/품목명 포함행) */
function parseEcount(wb) {
  const rows = [];
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false });
    let cCode = -1, cName = -1, cSpec = -1, started = false;
    for (const row of aoa) {
      if (!row) continue;
      if (!started) {
        for (let i = 0; i < row.length; i++) {
          const t = S(row[i]).replace(/\s/g, '');
          if (/품목코드|품번코드|^코드$/.test(t)) cCode = i;
          if (/품목명|품명|품목\[/.test(t)) cName = i;
          if (/규격명|^규격$|사이즈/.test(t)) cSpec = i;
        }
        if (cCode >= 0 && cName >= 0) { started = true; continue; }
        continue;
      }
      const code = S(row[cCode]).replace(/\t/g, '');
      if (!code || !/^\d/.test(code)) continue;
      let nm = S(row[cName]).replace(/\t/g, '');
      let sz = cSpec >= 0 ? S(row[cSpec]).replace(/\t/g, '') : '';
      if (!sz) { const m = nm.match(/\[([^\]]*)\]\s*$/); if (m) { sz = m[1].trim(); nm = nm.replace(/\s*\[[^\]]*\]\s*$/, '').trim(); } }
      rows.push({ code, name: nm, size: sz });
    }
  }
  return rows;
}

async function run() {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const dlBtn = document.getElementById('dlBtn');
  result.textContent = ''; result.className = '';
  dlBtn.style.display = 'none';
  document.getElementById('tblWrap').style.display = 'none';
  status.textContent = '엑셀 파싱 중...';

  try {
    const rows = parseStock(stockWB);
    if (!rows.length) throw new Error('재고추가 품목을 못 찾았어요. BRAND / MODEL 헤더가 있는 가로형 파일인지 확인해주세요.');

    const payload = { rows, ecount_source: mode };
    if (mode === 'manual') {
      const ec = parseEcount(ecWB);
      if (!ec.length) throw new Error('이카운트 품목 엑셀에서 품목코드/품목명을 못 읽었어요.');
      payload.ecount_rows = ec;
      status.textContent = `재고추가 ${rows.length}행 · 이카운트 조회표 ${ec.length}건 — 서버 확인 중...`;
    } else {
      status.textContent = `재고추가 ${rows.length}행 — 서버 캐시로 확인 중...`;
    }

    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '서버 오류');

    resultItems = data.items;
    render(data);
    let metaTxt = '';
    if (data.ecount_source === 'cache' && data.ecount_meta) metaTxt = ` · 이카운트 캐시 기준: ${data.ecount_meta.updated_at}`;
    if (data.ecount_source === 'manual') metaTxt = ' · 업로드한 이카운트 엑셀 기준';
    const cnt = c => resultItems.filter(i => i.상태 === c).length;
    status.innerHTML = `총 ${resultItems.length}행 — 판매중 ${cnt('판매중')} · 품절 ${cnt('품절')} · 신규 ${cnt('신규')} · 확인필요 ${cnt('확인필요')}${metaTxt}`;
    result.className = 'ok';
    result.textContent = '✅ 변환 완료. 확인 후 엑셀로 받으세요.';
    dlBtn.style.display = 'inline-block';
  } catch (e) {
    status.textContent = '';
    result.className = 'err';
    result.textContent = '오류: ' + e.message;
  }
}

function render(data) {
  const chip = s => ({ '판매중': 'c-sale', '품절': 'c-soldout', '신규': 'c-new', '확인필요': 'c-check' }[s] || 'c-check');
  const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const body = data.items.map((it, i) => `<tr>
    <td>${i + 1}</td>
    <td>${esc(it.품목코드) || '<span style="color:#b91c1c;">—</span>'}</td>
    <td>${esc(it.품목명)}</td>
    <td>${esc(it.규격명)}</td>
    <td>${esc(it.수량)}</td>
    <td><span class="chip ${chip(it.상태)}">${esc(it.상태)}</span></td>
  </tr>`).join('');
  document.getElementById('tbl').innerHTML =
    `<thead><tr><th>#</th><th>품목코드</th><th>품목명</th><th>규격명</th><th>수량</th><th>상태</th></tr></thead><tbody>${body}</tbody>`;
  document.getElementById('tblWrap').style.display = 'block';
}

function download() {
  const aoa = [['품목코드', '품목명', '규격명', '수량', '상태']];
  for (const it of resultItems) aoa.push([it.품목코드, it.품목명, it.규격명, it.수량, it.상태]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // 품목코드 열을 텍스트로 (앞자리 0 유지)
  for (let r = 1; r < aoa.length; r++) {
    const ref = XLSX.utils.encode_cell({ r, c: 0 });
    if (ws[ref]) { ws[ref].t = 's'; ws[ref].z = '@'; }
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '이카운트변환');
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  XLSX.writeFile(wb, `${srcBase}_이카운트변환_${stamp}.xlsx`);
}
</script>
</body>
</html>

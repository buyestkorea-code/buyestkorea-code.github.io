<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이카운트-BUYEST 재고 동기화 테스트</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #fee2e2; color: #b91c1c; }
  button { font-size: 16px; padding: 10px 24px; background: #111827; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: wait; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; text-align: center; }
  .card .num { font-size: 24px; font-weight: 700; }
  .card .label { font-size: 12px; color: #6b7280; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
  th, td { border-bottom: 1px solid #e5e7eb; padding: 6px 8px; text-align: left; }
  th { background: #f3f4f6; }
  .N { color: #b91c1c; }
  .Y { color: #15803d; }
  #status { color: #6b7280; margin: 10px 0; }
  #error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>이카운트 ↔ BUYEST 재고 동기화 <span class="badge">DRY-RUN (실제 변경 없음)</span></h1>
  <p>버튼을 누르면 서버의 실제 DB 상태와 이카운트 매핑을 비교만 합니다. 아무것도 실제로 바꾸지 않아요.</p>
  <button id="runBtn" onclick="runTest()">지금 실행</button>
  <div id="status"></div>
  <div id="error"></div>
  <div id="summary" class="summary"></div>
  <div id="tableWrap"></div>

<script>
const API_URL = 'https://buyest.co.kr/ecount_sync_dryrun_api.php';

async function runTest() {
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const summaryEl = document.getElementById('summary');
  const tableWrap = document.getElementById('tableWrap');
  btn.disabled = true;
  status.textContent = '실행 중... (몇 초 걸릴 수 있어요)';
  errorEl.textContent = '';
  summaryEl.innerHTML = '';
  tableWrap.innerHTML = '';

  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '알 수 없는 오류');

    status.textContent = `실행 시각: ${data.run_at} (모드: ${data.mode})`;

    const s = data.summary;
    summaryEl.innerHTML = `
      <div class="card"><div class="num">${s.products_in_mapping.toLocaleString()}</div><div class="label">매핑된 상품</div></div>
      <div class="card"><div class="num">${s.already_correct.toLocaleString()}</div><div class="label">이미 정상</div></div>
      <div class="card"><div class="num" style="color:#b91c1c">${s.needs_change.toLocaleString()}</div><div class="label">변경 필요</div></div>
      <div class="card"><div class="num">${s.option_not_found.toLocaleString()}</div><div class="label">옵션 매칭 실패</div></div>
    `;

    if (data.changes && data.changes.length) {
      let rows = data.changes.map(c => `
        <tr>
          <td>${c.pid}</td>
          <td>${escapeHtml(c.product_name)}</td>
          <td>${c.size || '-'}</td>
          <td>${c.ec_code}</td>
          <td>${c.qty}</td>
          <td class="${c.current}">${c.current}</td>
          <td class="${c.desired}">${c.desired}</td>
        </tr>
      `).join('');
      tableWrap.innerHTML = `
        <p>${data.changes_truncated ? '(상위 500건만 표시)' : ''} 변경 필요 목록:</p>
        <table>
          <thead><tr><th>pid</th><th>상품명</th><th>사이즈</th><th>이카운트코드</th><th>재고</th><th>현재값</th><th>변경될값</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
  } catch (e) {
    errorEl.textContent = '오류: ' + e.message;
    status.textContent = '';
  } finally {
    btn.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>

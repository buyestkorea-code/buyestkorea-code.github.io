<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>행사 POS</title>
<style>
  :root{
    --bg:#fafafa; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
    --pri:#111827; --green:#0f766e; --red:#b91c1c; --blue:#1d4ed8; --amber:#92400e;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:16px;}
  h1{font-size:19px;margin:0 0 4px;}
  h2{font-size:16px;margin:0 0 8px;}
  p.lead{color:var(--sub);font-size:13px;margin:4px 0 16px;line-height:1.6;}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .bar .spacer{flex:1;}
  .crumb{font-size:13px;color:var(--sub);}
  .crumb b{color:var(--ink);cursor:pointer;text-decoration:underline;}
  .btn{font-size:14px;padding:9px 16px;border:none;border-radius:7px;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--pri);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-outline{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed;}
  .btn-big{font-size:18px;padding:16px 20px;border-radius:10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.15s;}
  .tile:hover{border-color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .tile h3{margin:0 0 6px;font-size:15px;}
  .tile .meta{font-size:12px;color:var(--sub);}
  .tile-add{display:flex;align-items:center;justify-content:center;color:var(--sub);border-style:dashed;font-size:14px;min-height:70px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field label{font-size:12px;color:var(--sub);font-weight:600;}
  input,select,textarea{font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:140px;}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
  th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;}
  th{background:#f3f4f6;position:sticky;top:0;}
  .tbl-wrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .c-sale{background:#f0fdf4;color:#15803d;}
  .c-return{background:#eff6ff;color:#1d4ed8;}
  .c-manual{background:#fef3c7;color:#92400e;}
  .c-courier{background:#ede9fe;color:#5b21b6;}
  .c-recall{background:#ffedd5;color:#9a3412;}
  .st-ok{background:#f0fdf4;color:#15803d;}
  .st-short{background:#fef2f2;color:#b91c1c;}
  .st-unchecked{background:#fef3c7;color:#92400e;}
  .st-over{background:#ede9fe;color:#5b21b6;}
  .st-none{background:#f3f4f6;color:#6b7280;}
  .c-void{background:#f3f4f6;color:#9ca3af;text-decoration:line-through;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:12px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:100;display:none;}
  #toast.err{background:var(--red);}
  #toast.ok{background:var(--green);}

  /* ---- 스캔 화면 ---- */
  .scan-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;}
  .dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--sub);cursor:pointer;transition:border-color .12s,background .12s;}
  .dropzone:hover,.dropzone.drag{border-color:var(--pri);background:#f3f4f6;color:var(--ink);}
  .dropzone.has-file{border-style:solid;border-color:var(--green);}
  .dropzone input[type=file]{display:none;}
  #barcodeInput{font-size:26px;padding:16px;width:100%;text-align:center;letter-spacing:1px;border:2px solid var(--pri);border-radius:10px;}
  .scan-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .scan-actions .btn{flex:1;min-width:110px;}
  .item-card{margin-top:14px;padding:16px;border-radius:12px;border:2px solid var(--line);}
  .item-card.hit{border-color:var(--green);background:#f0fdf4;}
  .item-card.miss{border-color:var(--red);background:#fef2f2;}
  .item-card .name{font-size:19px;font-weight:800;}
  .item-card .meta{font-size:14px;color:var(--sub);margin-top:2px;}
  .item-card .qty{font-size:15px;margin-top:6px;font-weight:700;}
  .qty.low{color:var(--red);}
  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--sub);}
  .stat b{display:block;font-size:20px;color:var(--ink);}
  .recent-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .recent-item .grow{flex:1;}
  .recent-item .void-btn{color:var(--red);cursor:pointer;font-size:12px;text-decoration:underline;background:none;border:none;}
  .recent-item .edit-btn, .edit-btn{color:var(--blue);cursor:pointer;font-size:12px;text-decoration:underline;background:none;border:none;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;border:1px solid var(--line);}
  .tab.active{background:var(--pri);color:#fff;border-color:var(--pri);}
  #camWrap{display:none;margin-top:10px;}
  #camReader{width:100%;max-width:420px;margin:0 auto;}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;}
  @media print{ .tabs,.bar,.crumb,#toast{display:none !important;} body{background:#fff;padding:0;} .card{break-inside:avoid;} }
</style>
</head>
<body>

<div id="toast"></div>

<div id="app"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="assets/camera-scan.js"></script>
<script>
const REPORT_API = 'https://buyest.co.kr/pos_report_api.php';
const EXECUTE_API = 'https://buyest.co.kr/pos_execute_api.php';

const S = v => (v===null||v===undefined) ? '' : String(v).trim();
const N = v => { const n = Number(String(v??'').replace(/,/g,'')); return isFinite(n) ? n : 0; };
function esc(s){ return S(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* onclick="fn('...')" 처럼 홑따옴표 JS 문자열 안에 값을 끼워넣을 때 전용 — HTML 속성은 파서가 먼저 엔티티를 디코딩한 뒤 JS로 해석하므로, HTML 이스케이프만으로는 JS 문자열 탈출(XSS)을 막지 못한다. 백슬래시/홑따옴표를 JS 레벨로 먼저 이스케이프한 뒤 HTML 이스케이프를 적용한다. */
function escJsAttr(s){ return esc(S(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
/* 클릭/드래그앤드롭/붙여넣기(Ctrl+V)로 파일을 고르는 드롭존. 기존 input의 change 리스너를 그대로 재사용한다. */
function wireDropzone(zoneId, inputId){
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  ['dragenter','dragover'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e => {
    if (e.dataTransfer.files[0]) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change', { bubbles: true })); }
  });
  zone.addEventListener('paste', e => {
    const f = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0];
    if (f) { const dt = new DataTransfer(); dt.items.add(f); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true })); }
  });
}
function fmtDate(ts){ const d = new Date(ts*1000); return d.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}) + ' ' + d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
function fmtMD(ts){ const d = new Date(ts*1000); return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(ts){ return new Date(ts*1000).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
/* YYYY-MM-DD 고정 포맷 — 서버 daily_summary의 FROM_UNIXTIME(...,'%Y-%m-%d')와 맞춰야 날짜별로 묶임.
   주의: toLocaleDateString('ko-KR')은 "2026. 9. 23."처럼 점+공백이 섞여 나와서 split(' ')로 자르면
   날짜가 깨짐 — 반드시 이 함수처럼 연/월/일을 직접 조립할 것. */
function fmtYMD(ts){ const d = new Date(ts*1000); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtYMDHM(ts){ return fmtYMD(ts) + ' ' + fmtTime(ts); }
function money(n){ return N(n).toLocaleString('ko-KR'); }
const TYPE_LABEL_KO = {sale:'판매', return:'반품', manual_sale:'수기판매', courier:'주문택배', recall:'회수'};
const TYPE_LABEL_CHIP = {sale:['판매','c-sale'], return:['반품','c-return'], manual_sale:['수기판매','c-manual'], courier:['주문택배','c-courier'], recall:['회수','c-recall']};
/* 주문택배/회수는 재고만 줄이고 매출(판매금액)로는 안 잡는 이동 거래 — 금액 표시는 생략 */
const isMoveType = type => type === 'courier' || type === 'recall';
/* 거래 한 건의 표시용 품명/사이즈 — 등록품목이면 재고파일에서 온 브랜드+품명/사이즈,
   수기판매(미등록바코드)면 그때 입력한 manual_name/manual_size */
function txnDisplayName(t){
  if (t.item_id) return [t.item_brand, t.item_item_name].filter(Boolean).join(' ') || ('#' + t.barcode);
  return t.manual_name || ('#' + t.barcode);
}
function txnDisplaySize(t){
  return t.item_id ? (t.item_size || '') : (t.manual_size || '');
}
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type||'';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

/* ---------- API 헬퍼 ---------- */
async function apiGet(action, params){
  try {
    const q = new URLSearchParams({action, ...params});
    const res = await fetch(REPORT_API + '?' + q.toString());
    if (!res.ok) return {ok:false, error:`서버 오류 (HTTP ${res.status})`};
    return await res.json();
  } catch (e) {
    return {ok:false, error:'서버에 연결할 수 없어요. 잠시 후 다시 시도해주세요.'};
  }
}
async function apiPost(action, body){
  try {
    const res = await fetch(EXECUTE_API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action, ...body})
    });
    if (!res.ok) return {ok:false, error:`서버 오류 (HTTP ${res.status})`};
    return await res.json();
  } catch (e) {
    return {ok:false, error:'서버에 연결할 수 없어요. 잠시 후 다시 시도해주세요.'};
  }
}

/* ---------- 상태 ---------- */
const state = {
  screen: 'events',      // events | event | upload | scan | daily | export
  events: [],
  event: null,            // {id, name, ...}
  actor: null,             // 로그인한 사용자 아이디 (buyest.dash.auth) — 쓰기 요청마다 같이 보내 서버 감사로그에 남김
  corner: null,           // 행사당 자동생성되는 단일 코너(내부용, 화면엔 안 보임)
  items: [],              // 현재 행사 품목 캐시
  recent: [],             // 최근 스캔/거래 (화면 로컬 표시용)
  scanned: null,           // 마지막 조회 결과 {found, item|barcode}
  mode: 'sale',            // sale | return | exchange | manual
  exchangeStep: null,      // 'return' | 'sale' (교환 진행중 단계)
  exchangeReturn: null,
  camActive: false,
};

/* 로그인 여부 확인 — 이 사이트(index.html)의 인트라넷 로그인(localStorage 'buyest.dash.auth',
   {id,pass,role})을 그대로 재사용. pos.html은 index.html과 같은 origin의 iframe이라 localStorage를
   그대로 공유한다. 로그인 안 했으면(=guest, "로그인 없이 도구만 사용") 행사 POS는 아예 막는다. */
function getAuth(){
  try {
    const raw = localStorage.getItem('buyest.dash.auth');
    if (!raw) return null;
    const a = JSON.parse(raw);
    return (a && a.id) ? a : null;
  } catch (e) { return null; }
}
function renderLoginRequired(){
  document.getElementById('app').innerHTML = `
    <h1>행사 POS</h1>
    <div class="card" style="text-align:center;padding:48px 20px;">
      <p class="lead" style="margin:0 0 18px;font-size:15px;">로그인한 직원만 사용할 수 있어요.<br>상단(인트라넷 홈)에서 로그인한 뒤 새로고침해주세요.</p>
      <button class="btn btn-primary" onclick="location.reload()">새로고침</button>
    </div>
  `;
}

/* ============================================================
   화면 1: 행사 목록
   ============================================================ */
async function renderEvents(){
  stopCamera();
  state.screen = 'events';
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>행사 POS</h1>
    <p class="lead">행사(백화점 팝업 등)를 선택하거나 새로 만드세요. 행사마다 재고파일 하나를 올리고 바코드로 판매·반품·교환을 기록합니다.</p>
    <div class="bar"><div class="spacer"></div><button class="btn btn-primary" onclick="openCreateEvent()">+ 새 행사</button></div>
    <div id="eventsGrid" class="grid"><div class="hint">불러오는 중...</div></div>
  `;
  const res = await apiGet('events', {});
  const grid = document.getElementById('eventsGrid');
  if (!res.ok){ grid.innerHTML = `<div class="hint" style="color:var(--red);">${esc(res.error||'행사 목록을 못 불러왔어요')}</div>`; return; }
  state.events = res.events;
  if (state.events.length === 0){
    grid.innerHTML = '<div class="hint">아직 등록된 행사가 없어요. "+ 새 행사"로 시작하세요.</div>';
    return;
  }
  grid.innerHTML = state.events.map(ev => `
    <div class="tile" onclick="enterEvent(${ev.id})">
      <h3>${esc(ev.name)}</h3>
      <div class="meta">${ev.start_date?esc(ev.start_date):'기간 미정'} ${ev.end_date?'~ '+esc(ev.end_date):''}</div>
      ${ev.memo ? `<div class="meta">${esc(ev.memo)}</div>` : ''}
    </div>
  `).join('');
}

function openCreateEvent(){
  showModal(`
    <h2>새 행사 만들기</h2>
    <div class="field"><label>행사 이름 (예: 10월 롯데백화점 동래)</label><input id="mEvName" placeholder="행사 이름"></div>
    <div class="row">
      <div class="field"><label>시작일</label><input id="mEvStart" type="date"></div>
      <div class="field"><label>종료일</label><input id="mEvEnd" type="date"></div>
    </div>
    <div class="field"><label>메모</label><input id="mEvMemo" placeholder="선택사항"></div>
    <div class="bar"><div class="spacer"></div><button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="submitCreateEvent()">만들기</button></div>
  `);
}
async function submitCreateEvent(){
  const name = S(document.getElementById('mEvName').value);
  if (!name){ toast('행사 이름을 입력해주세요','err'); return; }
  const res = await apiPost('create_event', {
    name, actor: state.actor,
    start_date: document.getElementById('mEvStart').value || null,
    end_date: document.getElementById('mEvEnd').value || null,
    memo: S(document.getElementById('mEvMemo').value),
  });
  if (!res.ok){ toast(res.error||'생성 실패','err'); return; }
  closeModal();
  await enterEvent(res.event_id);
}

/* ============================================================
   행사 진입 — 툴킷 로그인 계정만 접근 가능(가입 관리 인트라넷 로그인, PIN 없음)
   ============================================================ */
async function enterEvent(eventId){
  return loadEvent(eventId);
}

/* 행사 하나 = 재고파일 하나. 예전엔 행사 안에 "코너"를 여러 개 만들어 각각 재고를 올리는
   구조였는데, 사용자 확인 결과 그런 구분이 필요 없고 행사 단위로만 나누면 된다고 확정됨 —
   그래서 코너 선택 UI는 없애고, 행사마다 코너를 자동으로 1개만 만들어(이벤트명과 동일) 뒤에서
   투명하게 씀 (서버 API는 내부적으로 corner_id를 여전히 쓰지만 화면엔 안 보임). */
async function loadEvent(eventId){
  const list = state.events.length ? state.events : (await apiGet('events',{})).events;
  state.event = list.find(e => e.id === eventId) || {id:eventId};

  let res = await apiGet('corners', {event_id: eventId});
  if (!res.ok){ toast(res.error||'불러오기 실패','err'); return; }
  let corners = res.corners;
  if (corners.length === 0){
    const cr = await apiPost('create_corner', {event_id: eventId, actor: state.actor, name: state.event.name || '재고'});
    if (!cr.ok){ toast(cr.error||'초기화 실패','err'); return; }
    res = await apiGet('corners', {event_id: eventId});
    corners = res.corners;
  }
  state.corner = corners[0];

  const itemsRes = await apiGet('items', {corner_id: state.corner.id});
  state.items = itemsRes.items || [];

  goScan();
}

function goScan(){
  state.mode = 'sale';
  state.exchangeStep = null;
  state.exchangeReturn = null;
  if (state.items.length === 0) renderUploadScreen();
  else renderScanScreen();
}

/* 스캔/업로드/일별현황/마감다운로드 화면 공통 상단(행사명 + 탭 + 행사삭제) */
function topNav(active){
  return `
    <div class="crumb"><b onclick="renderEvents()">행사 목록</b> / ${esc(state.event.name)}
      <button class="btn btn-outline" style="margin-left:8px;padding:3px 10px;font-size:11px;color:var(--red);" onclick="confirmDeleteEvent()">행사 삭제</button>
    </div>
    <h1 style="margin-top:8px;">${esc(state.event.name)}</h1>
    <div class="tabs">
      <div class="tab ${active==='scan'?'active':''}" onclick="goScan()">스캔</div>
      <div class="tab ${active==='daily'?'active':''}" onclick="renderDailyScreen()">일별 현황</div>

let pendingUploadRows = null;
async function handleInventoryFile(e){
  const f = e.target.files[0];
  if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true});

    wrap.innerHTML = '<div class="hint" style="color:var(--red);">바코드 컬럼을 찾지 못했어요. 양식을 확인해주세요.</div>';

/* 품목명에서 (품번, 사이즈) 분리. 사이즈는 "품번_사이즈" 처럼 밑줄이 2개 이상일 때 마지막 조각이거나,
   밑줄이 1개여도 마지막 조각이 TU/S/M/48 같은 사이즈 모양일 때만 인정한다.
   예전엔 무조건 "마지막 밑줄 뒤 = 사이즈"로 잘라서, "행_1A000 96 68950 999"처럼 사이즈가 아예 없는
   품목명(앞의 "행_"이 유일한 밑줄)은 품번 전체가 사이즈로 저장되는 버그가 있었다(2026-10-02 수정). */
const SIZE_TOKEN_RE = /^(XXS|XS|S|M|L|XL|XXL|XXXL|TU|FREE|F|ONE|OS|UNI|\d{1,3}(\.5)?|\d{1,2}[YMA])$/i;
function splitNameAndSize(itemName){
  const parts = itemName.split('_');
  if (parts.length >= 3){
    return { styleCode: parts.slice(0,-1).join('_'), size: parts[parts.length-1].trim() };
  }
  if (parts.length === 2 && SIZE_TOKEN_RE.test(parts[1].trim())){
    return { styleCode: parts[0], size: parts[1].trim() };
  }
  return { styleCode: itemName, size: '' };
}

/* 분류명/품목명/바코드/재고량/단가 헤더를 찾아 매핑, 분류명은 병합셀이라 fill-down.
   파일에 '사이즈'(또는 '규격') 컬럼이 따로 있으면 그 값을 우선 사이즈로 쓴다. */
function parseInventoryExcel(aoa){
  let headerIdx = -1, colMap = {};
  for (let i=0;i<aoa.length;i++){
    const row = aoa[i]||[];
    const idx = {};
    row.forEach((cell,ci) => {
      const t = S(cell);
      if (t==='분류명') idx.brand = ci;
      if (t==='품목명') idx.item_name = ci;
      if (t==='바코드') idx.barcode = ci;
      if (t==='재고량') idx.init_qty = ci;
      if (t==='단가') idx.price = ci;
      if (t==='사이즈' || t==='규격') idx.size = ci;
    });
    if (idx.item_name!==undefined && idx.barcode!==undefined){ headerIdx = i; colMap = idx; break; }
  }
  if (headerIdx === -1) return [];

  const out = [];
  let curBrand = '';
  for (let i=headerIdx+1;i<aoa.length;i++){
    const row = aoa[i];
    if (!row) continue;
    const allEmpty = row.every(c => S(c)==='');
    if (allEmpty) continue;
    if (colMap.brand!==undefined && S(row[colMap.brand])!=='') curBrand = S(row[colMap.brand]);
    const barcode = S(row[colMap.barcode]);
    if (!barcode) continue;
    const itemName = S(row[colMap.item_name]);
    const parsed = splitNameAndSize(itemName);
    const styleCode = parsed.styleCode;
    const size = (colMap.size!==undefined && S(row[colMap.size])!=='') ? S(row[colMap.size]) : parsed.size;
    out.push({
      brand: curBrand,
      item_name: itemName,
      style_code: styleCode,
      size: size,
      barcode: barcode,
      init_qty: colMap.init_qty!==undefined ? N(row[colMap.init_qty]) : 0,
      price: colMap.price!==undefined ? N(row[colMap.price]) : 0,
    });
  }
  return out;
}

async function submitUpload(){
  if (!pendingUploadRows || pendingUploadRows.length===0) return;
  const res = await apiPost('upload_items', {corner_id: state.corner.id, actor: state.actor, items: pendingUploadRows});
  if (!res.ok){ toast(res.error||'업로드 실패','err'); return; }
  toast(`신규 ${res.inserted}건, 갱신 ${res.updated}건 업로드됐어요`, 'ok');
  const itemsRes = await apiGet('items', {corner_id: state.corner.id});
  state.items = itemsRes.items || [];
  goScan();
}

async function onScanSubmit(){

  const barcode = S(input.value);
  if (!barcode) return;

  if (state.mode === 'exchange'){
    return handleExchangeScan(barcode);
  }
  await lookupAndShow(barcode, state.mode);

async function lookupAndShow(barcode, intent){
  const res = await apiGet('item_lookup', {corner_id: state.corner.id, barcode});
  const box = document.getElementById('scanResult');
  if (!res.ok){ toast(res.error||'조회 실패','err'); focusBarcode(); return; }

  if (!res.found && res.style_matches && res.style_matches.length){
    // 택의 품번 바코드로 찍은 경우 — 사이즈별 품목이 여러 개라 사이즈를 고르게 한다
    state.scannedItem = null;
    box.innerHTML = `
      <div class="item-card hit">
        <div class="name">${esc(res.style_matches[0].brand)} ${esc(res.style_matches[0].item_name)}</div>
        <div class="meta">품번 바코드 ${esc(barcode)} — 사이즈를 선택하세요</div>
        <div class="scan-actions">
          ${res.style_matches.map(m => `<button class="btn btn-outline" ${m.cur_qty<=0?'style="opacity:.55;"':''} onclick="pickStyleMatch('${escJsAttr(m.barcode)}', '${intent}')">${esc(m.size || '-')}<br><span style="font-weight:400;font-size:12px;">재고 ${m.cur_qty}</span></button>`).join('')}
        </div>
      </div>`;
    focusBarcode();
    return;
  }
  if (!res.found){
    box.innerHTML = renderUnregisteredCard(barcode, res.prev_manual, intent);
    focusBarcode();
    return;
  }
  const item = res.item;
  state.scannedItem = item;
  box.innerHTML = renderItemCard(item, intent);
  if (res.matched_by === 'style') box.insertAdjacentHTML('afterbegin', `<div class="hint" style="margin-top:12px;">품번 바코드(${esc(barcode)})로 찾았어요</div>`);
  focusBarcode();
}
function pickStyleMatch(barcode, intent){ lookupAndShow(barcode, intent); }

/* ---- 추가 판매(장바구니): 한 고객이 여러 개 살 때 바코드를 계속 찍어서 한번에 확정 (판매/주문택배 모드) ----
   담긴 건 확정 전까지 이 화면(브라우저) 안에만 있고, 확정하면 상품마다 기존 scan_sale/scan_move로 1건씩 기록된다. */
state.cart = []; state.cartEventId = null; state.cartBusy = false; state.scannedItem = null;
function cartFinal(c){
  let f = c.price;
  if (c.discount_type === 'percent') f = c.price * (1 - c.discount_value/100);
  else if (c.discount_type === 'amount') f = c.price - c.discount_value;
  return Math.max(0, Math.round(f));
}
function readCardFields(){
  const type = document.getElementById('scanDiscType').value;
  return {
    price: N(document.getElementById('scanPrice').value),
    discount_type: type,
    discount_value: type === 'none' ? 0 : N(document.getElementById('scanDiscVal').value),
    note: S(document.getElementById('scanNote').value),
  };
}
/* 판매 장바구니와 주문택배 장바구니는 섞지 않는다 */
function cartModeOk(){
  if (state.cart.length && state.cart[0].mode !== state.mode){
    toast('담은 상품이 "' + (state.cart[0].mode==='courier'?'주문택배':'판매') + '"예요. 먼저 확정하거나 비운 뒤에 다른 구분으로 담아주세요', 'err');
    return false;
  }
  return true;
}
function cartPush(){
  const item = state.scannedItem;
  if (!item || !document.getElementById('scanPrice') || !cartModeOk()) return;
  state.cart.push(Object.assign({item, mode: state.mode}, readCardFields()));
  state.scannedItem = null;
  document.getElementById('scanResult').innerHTML = '';
  renderCart();
  toast('담았어요 — 다음 상품 바코드를 스캔하세요', 'ok');
  focusBarcode();
}
function cartRemove(i){ state.cart.splice(i, 1); renderCart(); }
function cartClear(){
  if (!state.cart.length) return;
  if (!confirm('담은 ' + state.cart.length + '개를 모두 비울까요?')) return;
  state.cart = []; renderCart(); focusBarcode();
}
function renderCart(){
  const box = document.getElementById('cartBox');
  if (!box) return;
  const cart = state.cart;
  if (!cart.length){ box.innerHTML = ''; return; }
  const label = cart[0].mode === 'courier' ? '주문택배' : '판매';
  const total = cart.reduce((a, c) => a + cartFinal(c), 0);
  // 같은 바코드를 담은 개수가 현재고를 넘으면 안내
  const cnt = {}; cart.forEach(c => { cnt[c.item.barcode] = (cnt[c.item.barcode] || 0) + 1; });
  box.innerHTML = `
    <div class="item-card" style="border-color:#6366f1;background:#eef2ff;">
      <div class="name">담은 상품 ${cart.length}개 · 합계 ${money(total)}원 <span style="font-weight:400;font-size:12px;">(${label})</span></div>
      ${cart.map((c, i) => `
        <div class="recent-item">
          <span class="grow">${esc(c.item.brand)} ${esc(c.item.item_name)}${c.item.size ? ' ('+esc(c.item.size)+')' : ''} · ${money(cartFinal(c))}원
            ${cnt[c.item.barcode] > c.item.cur_qty ? '<span style="color:var(--red);">· 현재고('+c.item.cur_qty+'개)보다 많이 담김</span>' : ''}</span>
          <button class="void-btn" onclick="cartRemove(${i})">빼기</button>
        </div>`).join('')}
      <div class="hint" style="margin:6px 0;">다음 상품 바코드를 이어서 스캔하세요. 다 담았으면 아래 버튼으로 한번에 확정합니다.</div>
      <button class="btn btn-big ${cart[0].mode==='courier' ? '' : 'btn-primary'}" style="width:100%;${cart[0].mode==='courier' ? 'background:#5b21b6;color:#fff;' : ''}" onclick="submitCart(false)">${cart.length}개 한번에 ${label} 확정</button>
      <button class="btn btn-outline" style="width:100%;margin-top:6px;" onclick="cartClear()">담은 것 모두 비우기</button>
    </div>`;
}
async function submitCart(withCurrent){
  if (state.cartBusy) return;
  if (withCurrent){
    if (!state.scannedItem || !document.getElementById('scanPrice') || !cartModeOk()) return;
    state.cart.push(Object.assign({item: state.scannedItem, mode: state.mode}, readCardFields()));
    state.scannedItem = null;
  }
  if (!state.cart.length) return;
  state.cartBusy = true;
  const list = state.cart.slice();
  let done = 0, failMsg = '';
  for (const c of list){
    const base = {corner_id: state.corner.id, actor: state.actor, barcode: c.item.barcode, price: c.price,
                  discount_type: c.discount_type, discount_value: c.discount_value, note: c.note};
    const res = c.mode === 'courier'
      ? await apiPost('scan_move', Object.assign(base, {move_type: 'courier'}))
      : await apiPost('scan_sale', base);
    if (!res.ok){ failMsg = res.error || '처리 실패'; break; }
    done++;
    state.cart.shift();   // 성공한 건은 바로 비워서, 중간에 실패해도 중복 기록 없이 나머지만 남게 한다
  }
  state.cartBusy = false;
  renderCart();
  if (failMsg) toast(`${done}건 처리 후 중단됐어요: ${failMsg} (나머지 ${state.cart.length}개는 아직 담겨 있어요)`, 'err');
  else toast(`${done}개 ${list[0].mode==='courier'?'주문택배':'판매'} 처리됐어요`, 'ok');
  await afterTxn();
}

function renderItemCard(item, intent){
  const low = item.cur_qty <= 0;
  return `
    <div class="item-card hit">
      <div class="name">${esc(item.brand)} ${esc(item.item_name)}</div>
      <div class="meta">${item.size ? '사이즈 ' + esc(item.size) + ' · ' : ''}바코드 ${esc(item.barcode)}</div>
      <div class="qty ${low?'low':''}">현재고 ${item.cur_qty}개 ${low?'(0 이하 — 확인 후 진행)':''}</div>
      ${intent==='recall' ? `

    if (!res.ok || !res.found){ toast('반품 상품이 재고파일에 없어요. 교환 대신 개별 반품/판매로 처리해주세요.','err'); focusBarcode(); return; }

async function submitExchange(saleBarcode){

async function afterTxn(){
  document.getElementById('scanResult').innerHTML = '';

  state.items = itemsRes.items || [];

  await loadRecent();

function updateScanStats(){
  const st = cornerStats();
  const statEls = document.querySelectorAll('.stat-row .stat b');
  if (statEls.length === 5){
    statEls[0].textContent = st.itemCount; statEls[1].textContent = st.totalQty; statEls[2].textContent = st.salesQty;
    statEls[3].textContent = st.courierQty; statEls[4].textContent = st.recallQty;
  }
}

async function loadRecent(){
  const res = await apiGet('txns', {corner_id: state.corner.id});
  const wrap = document.getElementById('recentList');
  if (!wrap) return;
  if (!res.ok || res.txns.length===0){ wrap.innerHTML = '<div class="hint">아직 거래 내역이 없어요.</div>'; return; }
  res.txns.forEach(t => { state.txnMap[t.id] = t; });
  wrap.innerHTML = res.txns.slice(0,60).map(t => {
    const [label, cls] = TYPE_LABEL_CHIP[t.type] || [t.type,''];
    const size = txnDisplaySize(t);
    return `
      <div class="recent-item">
        <span class="chip ${t.voided? 'c-void':cls}">${label}${t.voided?'(취소됨)':''}</span>
        <span class="grow">${esc(txnDisplayName(t))}${size?' ('+esc(size)+')':''} ${t.type==='recall'?'':money(t.final_amount)+'원'} ${t.note?('· '+esc(t.note)):''}</span>
        <span>${fmtDate(t.created_at)}</span>
        ${!t.voided ? `<button class="edit-btn" onclick="openEditTxn(${t.id})">수정</button><button class="void-btn" onclick="voidTxn(${t.id})">취소</button>` : ''}
      </div>`;
  }).join('');
}

/* ---- 거래 수정 (판매가/할인/비고, 수기 입력건 품명·사이즈, 판매↔주문택배↔회수 구분) ----
   수량·품목은 안 바뀌고, 바뀌기 전/후 값은 서버 감사로그에 남는다. 취소된 거래는 수정 불가. */
state.txnMap = {};
function openEditTxn(txnId){
  const t = state.txnMap[txnId];
  if (!t || t.voided) return;
  const isManual = !t.item_id;
  const canChangeType = !isManual && !t.exchange_group && ['sale','courier','recall'].includes(t.type);
  const isSalesType = ty => ty === 'sale' || ty === 'manual_sale' || ty === 'courier';   // 주문택배도 매출
  const hasMoney = isSalesType(t.type) || canChangeType; // 회수 → 판매/주문택배로 바꾸면 금액 입력이 필요
  const showMoneyNow = isSalesType(t.type);
  const [label] = TYPE_LABEL_CHIP[t.type] || [t.type];
  showModal(`
    <h2>거래 수정</h2>
    <div class="hint" style="margin:0 0 10px;">${esc(txnDisplayName(t))}${txnDisplaySize(t) ? ' ('+esc(txnDisplaySize(t))+')' : ''} · 바코드 ${esc(t.barcode)} · ${label}<br>수량(재고)은 바뀌지 않아요.</div>
    ${isManual && t.type !== 'return' ? `
      <div class="row">
        <div class="field"><label>품명</label><input id="etName" value="${esc(t.manual_name||'')}"></div>
        <div class="field"><label>사이즈</label><input id="etSize" value="${esc(t.manual_size||'')}"></div>
      </div>` : ''}
    ${canChangeType ? `
      <div class="field"><label>구분</label>
        <select id="etType" onchange="onEditTypeChange()">
          <option value="sale" ${t.type==='sale'?'selected':''}>판매</option>
          <option value="courier" ${t.type==='courier'?'selected':''}>주문택배</option>
          <option value="recall" ${t.type==='recall'?'selected':''}>회수</option>
        </select>
      </div>` : ''}
    ${hasMoney ? `
      <div id="etMoney" style="display:${showMoneyNow?'block':'none'};">
        <div class="row">
          <div class="field"><label>판매가</label><input id="etPrice" type="number" value="${t.price}"></div>
          <div class="field"><label>할인</label>
            <select id="etDiscType" onchange="document.getElementById('etDiscVal').disabled = this.value==='none'">
              <option value="none" ${t.discount_type==='none'?'selected':''}>없음</option>
              <option value="percent" ${t.discount_type==='percent'?'selected':''}>% 할인</option>
              <option value="amount" ${t.discount_type==='amount'?'selected':''}>금액 차감</option>
            </select>
          </div>
          <div class="field"><label>할인값</label><input id="etDiscVal" type="number" value="${t.discount_value}" ${t.discount_type==='none'?'disabled':''}></div>
        </div>
      </div>` : ''}
    <div class="field"><label>비고</label><input id="etNote" value="${esc(t.note||'')}"></div>
    <div class="bar"><div class="spacer"></div><button class="btn btn-outline" onclick="closeModal()">닫기</button><button class="btn btn-primary" onclick="submitEditTxn(${t.id})">저장</button></div>
  `);
}
function onEditTypeChange(){
  const sel = document.getElementById('etType');
  const box = document.getElementById('etMoney');
  if (sel && box) box.style.display = (sel.value === 'sale' || sel.value === 'courier') ? 'block' : 'none';
}
async function submitEditTxn(txnId){
  const t = state.txnMap[txnId];
  if (!t) return;
  const body = {txn_id: txnId, actor: state.actor, note: S(document.getElementById('etNote').value)};
  const typeSel = document.getElementById('etType');
  const newType = typeSel ? typeSel.value : t.type;
  if (typeSel) body.type = newType;
  if (document.getElementById('etName')){
    body.manual_name = S(document.getElementById('etName').value);
    body.manual_size = S(document.getElementById('etSize').value);
    if (!body.manual_name){ toast('품명을 입력해주세요','err'); return; }
  }
  if (document.getElementById('etPrice') && (newType === 'sale' || newType === 'manual_sale' || newType === 'courier')){
    body.price = N(document.getElementById('etPrice').value);
    body.discount_type = document.getElementById('etDiscType').value;
    body.discount_value = body.discount_type === 'none' ? 0 : N(document.getElementById('etDiscVal').value);
  }
  const res = await apiPost('update_txn', body);
  if (!res.ok){ toast(res.error||'수정 실패','err'); return; }
  closeModal();
  toast(res.unchanged ? '바뀐 내용이 없어요' : '수정했어요', 'ok');
  await refreshAfterTxnEdit(t);
}
async function refreshAfterTxnEdit(t){
  if (state.screen === 'daily'){
    const ymd = fmtYMD(t.created_at);
    await renderDailyScreen();
    await toggleDayDetail(ymd);   // 수정한 날짜 상세를 다시 펼쳐서 바로 확인
  } else {
    await afterTxn();
  }
}
async function voidTxn(txnId){

/* ---- 카메라 스캔 ---- */
/* 폰 카메라 스캔 — assets/camera-scan.js(오인식 방지: 바코드 종류 제한, 조준 박스, 연속 n회 + 일정 시간 같은 값이어야 확정,
   확정 후 중복 차단)를 사용. 아는 바코드(재고파일에 있음)는 빨리, 모르는 값은 더 확실히 읽혀야 확정된다. */
let posCam = null;
function killCameraStreamsNow(){
  // 화면을 갈아엎기 직전에도 카메라 불이 바로 꺼지도록 영상 트랙을 즉시 정지
  document.querySelectorAll('#camReader video').forEach(v => {
    const st = v.srcObject;
    if (st && st.getTracks) st.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
  });
}
async function stopCamera(){
  killCameraStreamsNow();
  const cam = posCam; posCam = null; state.camActive = false;
  if (cam){ try { await cam.stop(); } catch(e){} }
  const wrap = document.getElementById('camWrap');
  if (wrap) wrap.style.display = 'none';
}
async function toggleCamera(){
  const wrap = document.getElementById('camWrap');
  if (state.camActive){ await stopCamera(); (state.screen==='stocktake' ? document.getElementById('countInput') : document.getElementById('barcodeInput'))?.focus(); return; }
  if (typeof Html5Qrcode === 'undefined' || typeof RobustCameraScan === 'undefined'){ toast('카메라 스캔 라이브러리를 불러오지 못했어요','err'); return; }
  wrap.style.display = 'block';
  state.camActive = true;
  const statusEl = () => document.getElementById('camStatus');
  posCam = RobustCameraScan.create({
    elementId: 'camReader',
    isKnown: code => !!stItemByBarcode(code),
    onStatus: (msg, kind) => {
      const el = statusEl();
      if (el){ el.textContent = msg; el.style.color = kind==='ok' ? 'var(--green)' : (kind==='warn' ? 'var(--amber)' : 'var(--sub)'); }
    },
    onAccept: (text) => {
      if (state.screen === 'stocktake'){
        document.getElementById('countInput').value = text; onCountSubmit();
      } else if (state.screen === 'scan'){
        document.getElementById('barcodeInput').value = text; onScanSubmit();
      }
    },
  });
  try {
    await posCam.start();
  } catch(e){
    toast('카메라를 열 수 없어요: ' + (e && e.message ? e.message : e), 'err');
    await stopCamera();
  }
}

/* ============================================================
   리포트 — 하루(또는 전체 기간)의 판매 총계를 한 장으로 요약.
   매출 = 판매 + 수기판매 + 주문택배(취소 제외). 반품은 금액이 0으로 기록돼 있어 매출에서 빼지 않고 수량만 보여준다.
   브랜드 비중 · 인기품목 · 시간대(전체 기간은 날짜별) 흐름 · 엑셀/텍스트 복사/인쇄.
   ============================================================ */
const REPORT_COLORS = ['#0f766e','#1d4ed8','#b45309','#7c3aed','#be123c','#0369a1','#4d7c0f'];
const REPORT_OTHER = '#9ca3af';
const reportState = {eventId: null, date: null, data: null};
const pct1 = (a, b) => b > 0 ? (Math.round(a / b * 1000) / 10).toFixed(1) + '%' : '-';

function reportCompute(txns, isAll){
  const valid = txns.filter(t => !t.voided);
  const sales = valid.filter(t => t.type === 'sale' || t.type === 'manual_sale' || t.type === 'courier');
  const grp = {sale:{qty:0,list:0,final:0}, manual_sale:{qty:0,list:0,final:0}, courier:{qty:0,list:0,final:0}};
  const tot = {qty:0, list:0, final:0, discCnt:0};
  const brands = {}, products = {}, buckets = {};
  // 수기 입력(재고 연결 없음)이라도 택의 품번이 재고파일 품번과 같으면 브랜드/품목명은 재고파일 것으로 집계한다
  // (사이즈가 재고파일에 없거나 달라서 품목 연결은 못 한 건들 — 브랜드 비중이 '(미등록)'으로 몰리는 걸 막는다)
  const styleKey = s => S(s).replace(/^행_/, '').replace(/\s+/g, '').toUpperCase();
  const styleInfo = {};
  (state.items || []).forEach(it => { const k = styleKey(it.style_code || it.item_name); if (k && !styleInfo[k]) styleInfo[k] = it; });
  sales.forEach(t => {
    const q = Math.abs(t.qty_delta) || 1;
    const list = t.price * q, fin = t.final_amount;
    const g = grp[t.type]; g.qty += q; g.list += list; g.final += fin;
    tot.qty += q; tot.list += list; tot.final += fin;
    if (t.discount_type && t.discount_type !== 'none' && list > fin) tot.discCnt += 1;
    const hit = t.item_id ? null : (styleInfo[styleKey(t.barcode)] || styleInfo[styleKey(t.manual_name)] || null);
    const brand = t.item_id ? (t.item_brand || '(브랜드 없음)') : (hit ? (hit.brand || '(브랜드 없음)') : '(미등록 상품)');
    const b = brands[brand] = brands[brand] || {name: brand, qty: 0, final: 0}; b.qty += q; b.final += fin;
    const pname = t.item_id ? [t.item_brand, t.item_item_name].filter(Boolean).join(' ')
      : (hit ? [hit.brand, hit.item_name].filter(Boolean).join(' ') : ('(미등록) ' + (t.manual_name || t.barcode)));
    const p = products[pname] = products[pname] || {name: pname, qty: 0, final: 0, sizes: {}}; p.qty += q; p.final += fin;
    const sz = txnDisplaySize(t) || '-'; p.sizes[sz] = (p.sizes[sz] || 0) + q;
    const key = isAll ? fmtYMD(t.created_at) : String(new Date(t.created_at*1000).getHours()).padStart(2,'0') + '시';
    const k = buckets[key] = buckets[key] || {label: key, qty: 0, final: 0}; k.qty += q; k.final += fin;
  });
  const exGroups = new Set(valid.filter(t => t.exchange_group).map(t => t.exchange_group));
  const brandList = Object.values(brands).sort((a,b) => b.final - a.final || b.qty - a.qty);
  const productList = Object.values(products).sort((a,b) => b.qty - a.qty || b.final - a.final);
  return {
    isAll, tot, grp,
    discAmt: tot.list - tot.final,
    returnCnt: valid.filter(t => t.type === 'return' && !t.exchange_group).length,
    exchangeCnt: exGroups.size,
    recallCnt: valid.filter(t => t.type === 'recall').length,
    voidCnt: txns.filter(t => t.voided).length,
    brands: brandList, products: productList,
    buckets: Object.values(buckets).sort((a,b) => a.label < b.label ? -1 : 1),
  };
}

function reportBrandRows(d, maxN){
  // 상위 maxN개 + 나머지는 '기타'로 묶는다
  const rows = d.brands.slice(0, maxN).map((b, i) => ({...b, color: REPORT_COLORS[i % REPORT_COLORS.length]}));
  const rest = d.brands.slice(maxN);
  if (rest.length) rows.push({name: `기타 (${rest.length}개 브랜드)`, qty: rest.reduce((a,b)=>a+b.qty,0), final: rest.reduce((a,b)=>a+b.final,0), color: REPORT_OTHER});
  return rows;
}
function reportSizesText(p){
  return Object.entries(p.sizes).sort((a,b) => b[1]-a[1]).map(([s,q]) => `${s}×${q}`).join(', ');
}

/* ============================================================
   실재고 확인 — 행사가 끝나고 본사로 돌아온 실물을 바코드로 스캔해서, "돌아와 있어야 할 수량(예상수량)"과
   "실제로 확인된 수량"을 품목별로 대조한다. 판매/반품 원장(pos_txn)과는 별개인 pos_count 원장을 써서
   스캔해도 재고 수량 자체는 안 바뀌고 "실물로 확인했다"는 기록만 쌓인다.

   예상수량 = 행사 남은 재고(cur_qty)  — 기본값. 판매/주문택배는 고객에게 나간 것이라 제외, 반품은 이미 cur_qty에 반영됨.
     · 회수(recall)분은 행사 중간에 이미 본사로 보낸 물량이라 최종 검수 때는 행사 재고에 없다 → 기본 제외
       (사용자 확정 2026-10-03; 처음엔 포함이 기본이었다가 정정됨). 화면 체크박스로 포함도 가능.
   스캔하면 바로 1개 확인으로 기록된다(버튼 한 번 더 누르는 단계 없음) — 잘못 찍으면 결과 카드의
   "방금 확인 취소"로 되돌린다. 수천 개를 찍는 작업이라 속도가 중요해서 이렇게 함.
   ============================================================ */
const stState = { includeRecall: false, filter: 'todo', brand: '', q: '', sound: true, unreg: 0,
                  lastCountId: null, lastCountBarcode: '', recentCounts: [], lastCam: {code:'', ts:0}, qTimer: null };

const stExpected = it => it.cur_qty + (stState.includeRecall ? (it.recall_qty || 0) : 0);
/* ok=일치 / short=일부만 확인(부족) / unchecked=아직 하나도 못 찾음 / over=예상보다 많이 확인(초과) / none=예상도 0이고 확인도 0(대상 아님) */
function stStatus(it){
  const e = stExpected(it), c = it.counted_qty;
  if (e <= 0 && c === 0) return 'none';
  if (c === 0) return 'unchecked';
  if (c === e) return 'ok';
  return c < e ? 'short' : 'over';
}
const ST_LABEL = {ok:'일치', short:'부족', unchecked:'미확인', over:'초과', none:'해당없음'};
function stSummary(items){
  const s = {ok:0, short:0, unchecked:0, over:0, none:0, expectedSum:0, confirmedSum:0, extraSum:0, curSum:0, recallSum:0, recallAll:0};
  items.forEach(it => {
    s.recallAll += it.recall_qty || 0;
    s.curSum += it.cur_qty;                                        // 스캔 화면 '현재 총 재고'와 같은 값
    s.recallSum += stState.includeRecall ? (it.recall_qty || 0) : 0;
    const e = Math.max(stExpected(it), 0), c = it.counted_qty;
    s[stStatus(it)]++;
    s.expectedSum += e; s.confirmedSum += Math.min(c, e); s.extraSum += Math.max(c - e, 0);
  });
  s.target = items.length - s.none;
  return s;
}
function stItemByBarcode(code){
  if (state._bcFor !== state.items){ state._bcMap = new Map(state.items.map(i => [String(i.barcode), i])); state._bcFor = state.items; }
  return state._bcMap.get(String(code));
}
let _stAudio = null;
function stBeep(kind){
  if (!stState.sound) return;
  try {
    _stAudio = _stAudio || new (window.AudioContext || window.webkitAudioContext)();
    const o = _stAudio.createOscillator(), g = _stAudio.createGain();
    o.connect(g); g.connect(_stAudio.destination);
    o.type = 'sine'; o.frequency.value = kind==='ok' ? 880 : (kind==='warn' ? 520 : 240);
    g.gain.value = 0.08;
    o.start(); o.stop(_stAudio.currentTime + (kind==='ok' ? 0.08 : 0.28));
  } catch(e){ /* 소리는 부가기능 — 안 나도 작업엔 지장 없음 */ }
}

/* 요약(진행률/통계 박스) + 필터 칩 + 표를 한 번에 다시 그림 — 데이터가 바뀔 때마다 이걸 호출 */
function updateStocktakePanels(){
  const s = stSummary(state.items);
  const pct = s.expectedSum > 0 ? Math.round(s.confirmedSum / s.expectedSum * 1000) / 10 : 0;
  const prog = document.getElementById('stProgress');
  if (prog) prog.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;">
      <span><b>${s.confirmedSum.toLocaleString('ko-KR')}</b> / ${s.expectedSum.toLocaleString('ko-KR')}개 확인 (${pct}%)</span>
      <span style="color:var(--sub);">대상 ${s.target}품목${s.extraSum ? ` · 초과 확인 +${s.extraSum}개` : ''}</span>
    </div>
    <div style="height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;"><div style="height:100%;width:${Math.min(pct,100)}%;background:var(--green);"></div></div>
    <div class="hint" style="margin-top:8px;line-height:1.7;">
      <b>예상수량 ${s.expectedSum.toLocaleString('ko-KR')}개</b> = 행사 남은 재고 ${s.curSum.toLocaleString('ko-KR')}개${stState.includeRecall ? ` + 회수분 ${s.recallSum.toLocaleString('ko-KR')}개(중간에 본사로 보낸 것)` : (s.recallAll ? ` <span style="color:var(--sub);">(회수분 ${s.recallAll.toLocaleString('ko-KR')}개는 이미 본사로 보낸 물량이라 제외)</span>` : '')}${s.expectedSum !== s.curSum + s.recallSum ? ` + 음수재고 보정 ${(s.expectedSum - s.curSum - s.recallSum).toLocaleString('ko-KR')}개` : ''}<br>
      위쪽 숫자(개)는 <b>수량</b>, 아래 필터 칩의 숫자는 <b>품목 수</b>예요. 같은 상품이 2개 이상인 품목이 있어서 서로 달라요.
    </div>`;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('stOk', s.ok); set('stShort', s.short); set('stUnchecked', s.unchecked); set('stOver', s.over); set('stUnreg', stState.unreg);

  const chips = [['todo','확인필요', s.short + s.unchecked + s.over], ['all','전체', state.items.length], ['unchecked','미확인', s.unchecked],
                 ['short','부족', s.short], ['over','초과', s.over], ['ok','일치', s.ok], ['none','해당없음', s.none]];

  renderStocktakeTable();
}

const ST_ROW_LIMIT = 300;
function renderStocktakeTable(){
  const wrap = document.getElementById('stocktakeTableWrap');
  if (!wrap) return;
  if (state.items.length === 0){ wrap.innerHTML = '<div class="hint">품목이 없어요.</div>'; return; }
  const q = S(stState.q).toLowerCase();
  let rows = state.items.filter(it => {
    const st = stStatus(it);
    if (stState.filter === 'todo' ? !['short','unchecked','over'].includes(st) : (stState.filter !== 'all' && st !== stState.filter)) return false;
    if (stState.brand && it.brand !== stState.brand) return false;
    if (q && !(String(it.item_name).toLowerCase().includes(q) || String(it.barcode).includes(q) || String(it.brand).toLowerCase().includes(q))) return false;
    return true;
  });
  // 많이 모자란 것부터(차이가 가장 작은 음수 → 큰 순) 보이게
  rows.sort((a,b) => (a.counted_qty - stExpected(a)) - (b.counted_qty - stExpected(b)));
  const total = rows.length;
  rows = rows.slice(0, ST_ROW_LIMIT);
  const bg = {unchecked:'#fffbeb', short:'#fef2f2', over:'#f5f3ff'};
  wrap.innerHTML = total === 0 ? '<div class="hint">조건에 맞는 품목이 없어요.</div>' : `
    ${total > ST_ROW_LIMIT ? `<div class="hint" style="margin:0 0 6px;">${total}건 중 ${ST_ROW_LIMIT}건만 표시 — 브랜드/검색/필터로 좁혀보세요. (엑셀에는 전체가 들어가요)</div>` : ''}
    <div class="tbl-wrap"><table>
      <thead><tr><th>브랜드</th><th>품명</th><th>사이즈</th><th>바코드</th><th>행사 남은재고</th><th>회수분</th><th>예상수량</th><th>확인수량</th><th>차이</th><th>상태</th><th>비고</th></tr></thead>
      <tbody>${rows.map(it => {
        const st = stStatus(it), e = stExpected(it), diff = it.counted_qty - e;
        return `<tr ${bg[st] ? `style="background:${bg[st]};"` : ''}>
          <td>${esc(it.brand)}</td><td>${esc(it.item_name)}</td><td>${esc(sizeText(it.size))}</td><td>${esc(it.barcode)}</td>
          <td>${it.cur_qty}</td><td>${it.recall_qty || 0}</td><td><b>${e}</b></td><td><b>${it.counted_qty}</b></td>
          <td>${diff>0?'+':''}${diff}</td>
          <td><span class="chip st-${st}">${ST_LABEL[st]}</span></td>
          <td style="max-width:220px;">${it.note ? esc(it.note) + ' ' : ''}<button class="edit-btn" onclick="openItemNote(${it.id})">${it.note ? '수정' : '+비고'}</button></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
}

/* 품목 비고(분실/파손 등 특이사항) — 마감 엑셀의 비고 칸으로 나간다 */
function openItemNote(itemId){
  const it = state.items.find(i => i.id === itemId);
  if (!it) return;
  showModal(`
    <h2>품목 비고</h2>
    <div class="hint" style="margin:0 0 10px;">${esc(it.brand)} ${esc(it.item_name)}${it.size ? ' ('+esc(it.size)+')' : ''} · 바코드 ${esc(it.barcode)}</div>
    <div class="field"><label>비고 (예: 분실 / 파손 / 다른 매장 발송)</label><input id="itemNoteInput" value="${esc(it.note||'')}"></div>
    <div class="bar"><div class="spacer"></div><button class="btn btn-outline" onclick="closeModal()">닫기</button><button class="btn btn-primary" onclick="submitItemNote(${it.id})">저장</button></div>
  `);
  const el = document.getElementById('itemNoteInput'); el.focus();
  el.addEventListener('keydown', e => { if (e.key==='Enter') submitItemNote(itemId); });
}
async function submitItemNote(itemId){
  const note = S(document.getElementById('itemNoteInput').value);
  const res = await apiPost('update_item_note', {item_id: itemId, actor: state.actor, note});
  if (!res.ok){ toast(res.error||'저장 실패','err'); return; }
  const it = state.items.find(i => i.id === itemId);
  if (it) it.note = note;
  closeModal();
  renderStocktakeTable();
  toast('저장했어요','ok');
}

async function onCountSubmit(fromCamera){
  const input = document.getElementById('countInput');
  const barcode = S(input.value);
  if (!barcode) return;
  input.value = '';
  const box = document.getElementById('countResult');

  const it = stItemByBarcode(barcode);
  if (!it){
    stBeep('err');
    box.innerHTML = `
      <div class="item-card miss">
        <div class="name">미등록상품</div>
        <div class="meta">바코드 ${esc(barcode)} — 이 행사 재고파일에 없는 상품이 실물로 나왔어요.</div>
        <div class="field"><label>비고</label><input id="countNote" placeholder="예: 다른 행사/매장 상품 섞여옴"></div>
        <button class="btn btn-outline btn-big" style="width:100%;margin-top:8px;" onclick="submitUnregCount('${escJsAttr(barcode)}')">그래도 발견 기록 남기기</button>
      </div>`;
    input.focus();
    return;
  }

  const res = await apiPost('confirm_count', {corner_id: state.corner.id, actor: state.actor, barcode, note: ''});
  if (!res.ok){ stBeep('err'); toast(res.error||'처리 실패','err'); input.focus(); return; }
  it.counted_qty = res.counted_qty;      // 서버 값이 기준 (다른 기기에서 같이 찍고 있을 수 있음)
  it.cur_qty = res.cur_qty;
  stState.lastCountId = res.count_id; stState.lastCountBarcode = barcode;

  const e = stExpected(it), c = it.counted_qty, st = stStatus(it);
  const msg = st==='ok' ? `✔ 일치 — 확인 ${c} / 예상 ${e}개`
            : st==='over' ? `⚠ 초과! 예상 ${e}개인데 ${c}개 확인됐어요 (판매·반품 기록이 빠졌거나 섞여 들어온 상품일 수 있어요)`
            : `확인 ${c} / 예상 ${e}개 — ${e-c}개 더 있어야 해요`;
  stBeep(st==='over' ? 'warn' : 'ok');
  box.innerHTML = `
    <div class="item-card ${st==='over'?'miss':'hit'}">
      <div class="name">${esc(it.brand)} ${esc(it.item_name)}</div>
      <div class="meta">${it.size ? '사이즈 ' + esc(it.size) + ' · ' : ''}바코드 ${esc(it.barcode)}</div>
      <div class="qty ${st==='over'?'low':''}">${msg}</div>
      <button class="btn btn-outline" style="margin-top:8px;" onclick="undoLastCount()">방금 확인 취소</button>
    </div>`;
  updateStocktakePanels();
  loadCountRecent();
  input.focus();
}

async function undoLastCount(){
  if (!stState.lastCountId) return;
  const id = stState.lastCountId, barcode = stState.lastCountBarcode;
  const res = await apiPost('void_count', {count_id: id, actor: state.actor});
  if (!res.ok){ toast(res.error||'취소 실패','err'); return; }
  const it = stItemByBarcode(barcode);
  if (it && !res.already) it.counted_qty = Math.max(0, it.counted_qty - 1);
  stState.lastCountId = null;
  document.getElementById('countResult').innerHTML = '';
  toast('방금 확인을 취소했어요','ok');
  updateStocktakePanels();
  loadCountRecent();
  document.getElementById('countInput').focus();
}

async function submitUnregCount(barcode){
  const note = S(document.getElementById('countNote')?.value || '');
  const res = await apiPost('confirm_count', {corner_id: state.corner.id, actor: state.actor, barcode, note});
  if (!res.ok){ toast(res.error||'처리 실패','err'); return; }
  stBeep('warn');
  toast('미등록 발견으로 기록했어요', 'ok');
  document.getElementById('countResult').innerHTML = '';
  await loadCountRecent();
  document.getElementById('countInput').focus();
}

async function loadCountRecent(){
  const res = await apiGet('counts', {corner_id: state.corner.id, limit: 40});
  const wrap = document.getElementById('countRecentList');
  if (!res.ok) return;
  stState.unreg = res.unregistered || 0;
  stState.recentCounts = res.counts;
  const un = document.getElementById('stUnreg'); if (un) un.textContent = stState.unreg;
  if (!wrap) return;
  if (res.counts.length === 0){ wrap.innerHTML = '<div class="hint">아직 확인한 내역이 없어요.</div>'; return; }
  wrap.innerHTML = res.counts.map(c => {
    const name = c.item_id ? [c.item_brand, c.item_item_name].filter(Boolean).join(' ') : ('미등록 #' + c.barcode);
    return `
      <div class="recent-item">
        <span class="chip ${c.voided?'c-void':(c.item_id?'c-sale':'c-manual')}">${c.item_id?'확인':'미등록 발견'}${c.voided?'(취소됨)':''}</span>
        <span class="grow">${esc(name)}${c.item_size?' ('+esc(c.item_size)+')':''} ${c.note?('· '+esc(c.note)):''}</span>
        <span>${fmtDate(c.created_at)}</span>
        ${!c.voided ? `<button class="void-btn" onclick="voidCount(${c.id})">취소</button>` : ''}
      </div>`;
  }).join('');
}
async function voidCount(countId){
  if (!confirm('이 확인 기록을 취소할까요?')) return;
  const row = stState.recentCounts.find(c => c.id === countId);
  const res = await apiPost('void_count', {count_id: countId, actor: state.actor});
  if (!res.ok){ toast(res.error||'취소 실패','err'); return; }
  if (row && row.item_id && !res.already){
    const it = state.items.find(i => i.id === row.item_id);
    if (it) it.counted_qty = Math.max(0, it.counted_qty - 1);
  }
  if (stState.lastCountId === countId) stState.lastCountId = null;
  toast('취소됐어요','ok');
  updateStocktakePanels();
  await loadCountRecent();
}

/* 주기적 새로고침(여러 명이 동시에 찍을 때) — 서버 값으로 맞춘다 */
async function refreshStocktakeFromServer(){
  const itemsRes = await apiGet('items', {corner_id: state.corner.id});
  if (itemsRes.ok){ state.items = itemsRes.items; updateStocktakePanels(); }
  await loadCountRecent();
}

/* ---- 실재고 확인 엑셀 다운로드 ---- */
async function downloadStocktake(){
  toast('데이터를 모으는 중...', 'ok');
  const [itemsRes, countsRes] = await Promise.all([
    apiGet('items', {corner_id: state.corner.id}),
    apiGet('counts', {corner_id: state.corner.id, limit: 0}),
  ]);
  if (!itemsRes.ok || !countsRes.ok){ toast('데이터를 불러오지 못했어요','err'); return; }
  const items = itemsRes.items, counts = countsRes.counts;
  state.items = items;

  const rowOf = it => {
    const e = stExpected(it);
    const returned = it.cur_qty - it.init_qty + it.sold_qty + (it.courier_qty||0) + (it.recall_qty||0); // 반품수량(원장에서 역산)
    return {
      '브랜드': it.brand, '품목명': it.item_name, '사이즈': it.size, '바코드': it.barcode,
      '초기재고': it.init_qty, '판매': it.sold_qty, '반품': returned, '주문택배': it.courier_qty||0, '회수': it.recall_qty||0,
      '행사 남은재고': it.cur_qty, '예상수량': e, '확인수량': it.counted_qty, '차이': it.counted_qty - e,
      '상태': ST_LABEL[stStatus(it)], '비고': it.note || '',
    };
  };
  const all = items.map(it => ({it, row: rowOf(it)}));
  const todo = all.filter(x => ['short','unchecked','over'].includes(stStatus(x.it)))
                  .sort((a,b) => a.row['차이'] - b.row['차이']).map(x => x.row);

  const s = stSummary(items);
  const unregRows = counts.filter(c => !c.item_id).slice().reverse().map(c => ({
    '시간': fmtYMDHM(c.created_at), '바코드': c.barcode, '비고': c.note || '', '취소여부': c.voided ? '취소됨' : '',
  }));
  const scanRows = counts.slice().reverse().map(c => ({
    '시간': fmtYMDHM(c.created_at), '구분': c.item_id ? '확인' : '미등록 발견', '바코드': c.barcode,
    '브랜드': c.item_brand || '', '품목명': c.item_item_name || '', '사이즈': c.item_size || '',
    '비고': c.note || '', '취소여부': c.voided ? '취소됨' : '',
  }));
  const summary = [
    ['행사', state.event.name], ['다운로드 시각', fmtYMDHM(Math.floor(Date.now()/1000))],
    ['회수분 예상수량 포함', stState.includeRecall ? '포함' : '제외'], [],
    ['예상수량 합계', s.expectedSum], ['확인수량 합계(예상 범위 내)', s.confirmedSum],
    ['확인율', s.expectedSum ? Math.round(s.confirmedSum / s.expectedSum * 1000) / 10 + '%' : '-'],
    ['초과 확인 수량', s.extraSum], [],
    ['대상 품목', s.target], ['일치', s.ok], ['부족(일부만 확인)', s.short], ['미확인', s.unchecked], ['초과', s.over],
    ['해당없음(예상 0, 확인 0)', s.none], ['미등록 발견(취소 제외)', countsRes.unregistered || 0],
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), '요약');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(todo), '확인필요(부족·초과)');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(all.map(x => x.row)), '품목별대조');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(unregRows), '미등록발견');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(scanRows), '확인스캔내역');
  XLSX.writeFile(wb, `${state.event.name}_실재고확인_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ============================================================
   마감 다운로드 (엑셀)
   ============================================================ */
function renderExportScreen(){
  stopCamera();
  state.screen = 'export';
  const app = document.getElementById('app');
  app.innerHTML = topNav('export') + `
    <p class="lead">거래원장 + 재고대사표를 엑셀로 받습니다. 회수 시 실물 재고와 "현재전산재고"를 대조하세요.</p>
    <button class="btn btn-primary btn-big" onclick="downloadExport()">엑셀 다운로드</button>
  `;
}
async function downloadExport(){
  toast('데이터를 모으는 중...', 'ok');
  const res = await apiGet('export', {event_id: state.event.id});
  if (!res.ok){ toast(res.error||'실패','err'); return; }

  // 시트1: 거래원장
  const ledgerRows = res.txns.map(t => ({
    '날짜': fmtDate(t.created_at),
    '구분': TYPE_LABEL_KO[t.type] + (t.exchange_group?'(교환)':'') + (t.voided?' [취소됨]':''),
    '품명': txnDisplayName(t),
    '사이즈': txnDisplaySize(t),
    '바코드': t.barcode,
    '수량': t.qty_delta,
    '정가': t.price,
    '할인구분': t.discount_type,
    '할인값': t.discount_value,
    '최종금액': t.final_amount,
    '비고': t.note || '',
  }));

  // 시트2: 재고대사 (품목별 초기재고/거래내역/현재고 + 비고)
  const txnByItem = {};
  res.txns.forEach(t => {
    if (!t.item_id) return;
    (txnByItem[t.item_id] = txnByItem[t.item_id] || []).push(t);
  });
  const reconcileRows = res.items.map(it => {
    const list = (txnByItem[it.id] || []).slice().sort((a,b)=>a.created_at-b.created_at);
    const history = list.map(t => {
      const lbl = TYPE_LABEL_KO[t.type] || t.type;
      const qty = Math.abs(t.qty_delta);
      const flag = t.voided ? '[취소]' : '';
      return `${lbl}${qty}(${fmtMD(t.created_at)})${flag}`;
    }).join(', ');
    const returned = list.filter(t => t.type==='return' && !t.voided).reduce((a,t)=>a+Math.abs(t.qty_delta),0);
    const counted = it.counted_qty || 0;
    return {
      '브랜드': it.brand,
      '품목명': it.item_name,
      '사이즈': it.size,
      '바코드': it.barcode,
      '기존재고(초기)': it.init_qty,
      '판매수량': it.sold_qty || 0,
      '반품수량': returned,
      '주문택배수량': it.courier_qty || 0,
      '회수수량': it.recall_qty || 0,
      '거래내역': history,
      '현재전산재고(최종 검수 예상수량)': it.cur_qty,
      '실사확인수량': counted,
      '차이': counted - it.cur_qty,
      '비고': it.note || '',
    };
  });

  // 시트3: 재고파일에 없는 바코드(미등록)로 수기 입력한 거래 — 수기판매 + 미등록 주문택배/회수
  const manualRows = res.txns.filter(t => !t.item_id).map(t => ({
    '날짜': fmtDate(t.created_at), '구분': TYPE_LABEL_KO[t.type] || t.type, '바코드': t.barcode,
    '품명': t.manual_name, '사이즈': t.manual_size, '최종금액': t.type==='recall' ? '' : t.final_amount,
    '비고': t.note || '', '취소여부': t.voided?'취소됨':'',
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reconcileRows), '재고대사');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ledgerRows), '거래원장');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(manualRows), '미등록수기내역');
  XLSX.writeFile(wb, `${res.event.name}_마감정산_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ============================================================
   행사 삭제
   ============================================================ */
function confirmDeleteEvent(){
  showModal(`
    <h2 style="color:var(--red);">행사 전체 삭제</h2>
    <p class="lead">"${esc(state.event.name)}"의 재고·거래 내역이 모두 영구 삭제됩니다. 되돌릴 수 없어요. 계속하려면 행사 이름을 그대로 입력하세요.</p>
    <div class="field"><input id="mDelConfirm" placeholder="${esc(state.event.name)}"></div>
    <div class="bar"><div class="spacer"></div><button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-red" onclick="submitDeleteEvent()">영구 삭제</button></div>
  `);
}
async function submitDeleteEvent(){
  const v = S(document.getElementById('mDelConfirm').value);
  if (v !== state.event.name){ toast('행사 이름이 일치하지 않아요','err'); return; }
  const res = await apiPost('delete_event', {event_id: state.event.id, actor: state.actor});
  if (!res.ok){ toast(res.error||'삭제 실패','err'); return; }
  closeModal();
  toast('삭제됐어요','ok');
  renderEvents();
}

/* ---------- 모달 ---------- */
function showModal(html){
  let bg = document.getElementById('modalBg');
  if (!bg){
    bg = document.createElement('div'); bg.id='modalBg'; bg.className='modal-bg';
    bg.innerHTML = '<div class="modal" id="modalBody"></div>';
    document.body.appendChild(bg);
  }
  document.getElementById('modalBody').innerHTML = html;
  bg.style.display = 'flex';
}
function closeModal(){
  const bg = document.getElementById('modalBg');
  if (bg) bg.style.display = 'none';
}

/* ---------- 동시작업 지원: 2~3명이 각자 기기에서 같은 코너를 동시에 스캔할 때, 다른 기기에서
   방금 판매/확인한 내용이 내 화면 숫자/최근내역에도 자동으로 반영되게 주기적으로 새로고침.
   입력 중인 바코드칸/스캔결과 카드는 절대 건드리지 않고 통계·최근내역만 갱신 — 진행 중인
   입력을 방해하지 않는다. ---------- */
setInterval(async () => {
  if (!state.corner) return;
  try {
    if (state.screen === 'scan') {
      const itemsRes = await apiGet('items', {corner_id: state.corner.id});
      if (itemsRes.ok) {
        state.items = itemsRes.items;
        updateScanStats();
      }
      await loadRecent();
    } else if (state.screen === 'stocktake') {
      await refreshStocktakeFromServer();
    }
  } catch (e) { /* 다음 주기에 다시 시도 — 네트워크 잠깐 끊겨도 화면 자체는 안 죽게 */ }
}, 12000);

/* ---------- 시작 ---------- */
(function start(){
  const auth = getAuth();
  if (!auth){ renderLoginRequired(); return; }
  state.actor = auth.id;
  renderEvents();
})();
</script>
